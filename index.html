    return c.role ? assignRoleAtPosition(c.sector, c.date, c.type, c.role, c.ridx, ui.tmplPickedWorker, null, null) : assignAtPosition(c.sector, c.date, c.type, c.pos, ui.tmplPickedWorker, null, null);
  }
  if(a==="tmpl-hours-custom"){ ui.tmplHoursMode = "custom"; return render(); }
  if(a==="tmpl-hours-partial"){ ui.tmplCustomStart = el.dataset.cs; ui.tmplCustomEnd = el.dataset.ce; ui.tmplHoursMode = "custom"; return render(); }
  // חפיפה: העובד שנבחר נוסף לתא יחד עם העובד שכבר משובץ בו, באותן שעות שלו (2026-10-07)
  if(a==="tmpl-hours-shadow"){
    const c = ui.tmplCell; if(!c) return;
    const host = tmplCellHost(c);
    if(!host){ ui.tmplCellMsg = "אין עובד משובץ בתא הזה"; return render(); }
    return tmplSaveShadowChange(c, {addShadow:{workerId:ui.tmplPickedWorker, hostId:host.worker_id, cs:host.custom_start||null, ce:host.custom_end||null}});
  }
  // הורדת עובד מסוים מהמשמרת (בלי לגעת באחרים באותו תא/משבצת) - 2026-10-07
  if(a==="tmpl-remove-worker"){
    const c = ui.tmplCell; if(!c) return;
    const wid = el.dataset.worker;
    const assignmentsByDate = {};
    (ui.assignments||[]).forEach(x=>{ (assignmentsByDate[x.entry_date] = assignmentsByDate[x.entry_date]||[]).push(x); });
    const list = tmplAssignedList(assignmentsByDate, c.date, c.sector, c.type).map(x=>x.worker_id).filter(id=>id!==wid);
    return (async()=>{
      try{
        await setAssignmentListPreservingHours(c.sector, c.date, c.type, list, "manual", null, null, null, {dropShadowIds:[wid]});
        ui.tmplCell = null; ui.tmplPickedWorker=null; ui.tmplHoursMode=null; ui.tmplCellMsg=null; ui.tmplShowOtherSectors=false; ui.tmplRoleOverride=null;
        ui.loaded = false;
        await loadAggregateData(teamById(ui.teamId));
      }catch(e){ ui.tmplCellMsg = "שגיאה בשמירה: " + e.message; render(); }
    })();
  }
  if(a==="tmpl-remove-shadow"){
    const c = ui.tmplCell; if(!c) return;
    return tmplSaveShadowChange(c, {dropShadowIds:[el.dataset.worker]});
  }
  if(a==="tmpl-hours-confirm"){
    const c = ui.tmplCell; if(!c) return;
    if(ui.tmplRoleOverride){
      const cs = document.getElementById("tmplCustomStart").value;
      const ce = document.getElementById("tmplCustomEnd").value;
      return assignRoleAtPosition(c.sector, c.date, c.type, c.role, c.ridx, ui.tmplPickedWorker, cs, ce);
    }
    return c.role ? confirmMokedCustomHours() : confirmTmplCustomHours();
  }

  // ---- manual build ----
  if(a==="manual-exit"){ ui.mode=null; return render(); }
  if(a==="stask-cell"){ ui.staskCell = {sector:el.dataset.sector, date:el.dataset.date, slot:Number(el.dataset.slot)}; ui.staskMsg = null; ui.staskBusy = false; return render(); }
  if(a==="stask-close" || a==="stask-close-bg"){ ui.staskCell = null; ui.staskMsg = null; return render(); }
  if(a==="stask-save" || a==="stask-remove") return schedTaskAction(a);
  /* "סיימתי" בסוף שיבוץ ידני (2026-10-20, סרגיי): כל שיבוץ נשמר כבר בלחיצה; הכפתור מחזיר לטבלה המרוכזת
     ומזכיר לפרסם אם הסידור עוד לא פורסם */
  if(a==="manual-done"){
    ui.mode = null;
    const tm = teamById(ui.teamId);
    const pub = tm ? isSchedulePublished(sectorGroupForTeam(tm), ui) : false;
    ui.buildMsg = pub ? "✔ השיבוץ הידני נשמר. הסידור כבר פורסם — השינויים מופיעים לעובדים."
                      : "✔ השיבוץ הידני נשמר. כדי שהעובדים יראו את הסידור — לחצו \"📢 פרסם סידור לעובדים\".";
    render(); window.scrollTo(0,0); return;
  }
  if(a==="manual-toggle"){
    const key = el.dataset.key;
    ui.manualOpenSlot = (ui.manualOpenSlot===key) ? null : key;
    return render();
  }
  if(a==="manual-close"){ ui.manualOpenSlot=null; return render(); }
  if(a==="manual-save") return saveManualSlot(el.dataset.sector, el.dataset.date, el.dataset.type);

  // ---- admin ----
  if(a==="admin-pin-submit"){
    const pin = document.getElementById("adminPin").value;
    return (async()=>{
      try{
        const ok = await apiRpc("verify_edit_pin",{p_pin:pin});
        if(!ok){ ui.adminError="קוד שגוי"; return render(); }
        S.pin = pin; localStorage.setItem("cst_pin", pin); ui.pinOk = true; ui.adminError=null;
        render();
      }catch(err){ ui.adminError="שגיאה: "+err.message; render(); }
    })();
  }
  if(a==="admin-pick-recipient"){
    const label = el.dataset.label;
    const group = getAdminRecipients().find(r=>r.label===label);
    if(!group) return render();
    ui.recipientLabel = label; ui.teamIds = group.teamIds; ui.workers=null;
    return render();
  }
  if(a==="admin-back"){ if(isSessionPin() && !(ui.mgrPick && ui.teamIds)) return goHome(); ui.recipientLabel=null; ui.teamIds=null; ui.workers=null; return render(); }
  if(a==="admin-set-team-code"){
    const code = document.getElementById("adminTeamCode").value;
    if(!code){ ui.teamCodeMsg = "יש להזין קוד"; return render(); }
    return (async()=>{
      try{
        await apiRpc("admin_set_team_code", {p_pin:S.pin, p_team_id:ui.codeTeamId, p_code:code});
        ui.teamCode = code; ui.teamCodeMsg = "נשמר.";
        render();
      }catch(err){ ui.teamCodeMsg = "שגיאה: "+err.message; render(); }
    })();
  }
  if(a==="admin-city-edit"){ ui.cityEditId = el.dataset.id; ui.cityEditMsg = null; return render(); }
  if(a==="admin-city-cancel"){ ui.cityEditId = null; ui.cityEditMsg = null; return render(); }
  if(a==="admin-city-save"){
    const pr = readCityPrefs("cityEdit");
    if(pr.error){ ui.cityEditMsg = pr.error; return render(); }
    const wid = el.dataset.id;
    return (async()=>{
      try{
        await apiRpc("admin_update_worker_cities", {p_pin:S.pin, p_worker_id:wid, p_cities:pr.cities});
        const w = (ui.workers||[]).find(x=>x.id===wid); if(w) w.city_sectors = pr.cities;
        ui.cityEditId = null; ui.cityEditMsg = null; ui.adminMsg = "סדר הערים נשמר."; render();
      }catch(err){ ui.cityEditMsg = "שגיאה: " + err.message; render(); }
    })();
  }
  if(a==="admin-add"){
    const name = document.getElementById("adminNewName").value;
    const code = document.getElementById("adminNewCode").value;
    const teamEl = document.getElementById("adminNewTeam");
    const targetTeamId = teamEl ? teamEl.value : ui.teamIds[0];
    const roleEl = document.getElementById("adminNewRole");
    const role = roleEl ? (roleEl.value || null) : null;
    // שיוך עיר: רלוונטי ונשלח רק אם הגזרה שנבחרה היא בפועל "אביחי קדוש" (סובב ירושלים) -
    // כדי לא "לדרוס" בטעות שיוך עיר על עובד של דניאל כתב/ירושלים, שם השיוך נגזר מהצוות עצמו.
    let citySectors = null;
    const targetTeam = teamById(targetTeamId);
    if(isCityPoolTeam(targetTeam)){
      const pr = readCityPrefs("adminNewCity");
      if(pr.error){ ui.adminMsg = pr.error; return render(); }
      citySectors = pr.cities;
    }
    /* עדכון עובד קיים בלי בחירת ערים לא מוחק את סדר העדיפויות שלו (2026-10-12) - שינוי סדר / "ללא העדפה"
       לעובד קיים נעשה בכפתור "✏️ שינוי" בטבלה. */
    const existing = (ui.workers||[]).find(w=>w.team_id===targetTeamId && w.name===name.trim());
    if(existing && !citySectors && existing.city_sectors && existing.city_sectors.length) citySectors = existing.city_sectors;
    if(!name||!code){ ui.adminMsg = "יש למלא שם וקוד"; return render(); }
    return (async()=>{
      try{ await apiRpc("admin_upsert_worker",{p_pin:S.pin,p_team_id:targetTeamId,p_name:name,p_code:code,p_role:role,p_city_sectors:citySectors}); ui.adminMsg="נשמר."; ui.workers=null; render(); }
      catch(err){ ui.adminMsg="שגיאה: "+err.message; render(); }
    })();
  }
  if(a==="admin-delete"){
    const id = el.dataset.id;
    return (async()=>{
      try{ await apiRpc("admin_delete_worker",{p_pin:S.pin,p_worker_id:id}); ui.workers=null; render(); }
      catch(err){ ui.adminMsg="שגיאה: "+err.message; render(); }
    })();
  }
  if(a==="admin-unlock-worker"){
    const id = el.dataset.id;
    return (async()=>{
      try{ await apiRpc("admin_unlock_worker_code",{p_pin:S.pin,p_worker_id:id}); ui.adminMsg="הנעילה נפתחה."; ui.workers=null; render(); }
      catch(err){ ui.adminMsg="שגיאה: "+err.message; render(); }
    })();
  }
  if(a==="admin-unlock-team"){
    return (async()=>{
      try{ await apiRpc("admin_unlock_team_code",{p_pin:S.pin,p_team_id:ui.codeTeamId}); ui.teamCodeLockedUntil=null; ui.teamCodeMsg="הנעילה נפתחה."; render(); }
      catch(err){ ui.teamCodeMsg="שגיאה: "+err.message; render(); }
    })();
  }
}

/* בחירה/ביטול עובדים בעריכת משבצת ידנית - צריך רינדור מחדש רק כדי לעדכן ספירה, אבל לא לאבד את מצב הצ'קבוקסים - לכן לא ממחזרים render() כאן */
document.addEventListener("input", function(e){
  if(e.target.dataset && e.target.dataset.action==="custom-start"){
    S.ui.entries[e.target.dataset.date].customStart = e.target.value;
  }
  if(e.target.dataset && e.target.dataset.action==="custom-end"){
    S.ui.entries[e.target.dataset.date].customEnd = e.target.value;
  }
});

/* מה שהפורטל (portal.js) צריך מהקוד הראשי */
const App = { SUPABASE_URL, SUPABASE_ANON_KEY, effQuota, logoStripHtml, S, render, apiGet, apiRpc, escapeHtml, fmtDateHeb, fmtDate, addDays, parseDate, dayTypeForDate, SHIFT_LABELS, teamById, loadJSON, saveJSON, pickerTiles, sectorGroupForTeam, isMokedTeam, currentPeriodStart };

init();
})();
</script>
