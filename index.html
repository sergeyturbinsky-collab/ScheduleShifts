<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הגשת אילוצים ובניית סידור עבודה</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c3a6e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="איזור אישי">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>if("serviceWorker" in navigator) window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
<style>
  :root{
    --bg:#eaf4ff; --card:#ffffff; --border:#cfe3f7; --text:#0f2942; --muted:#5c7a99;
    --primary:#1668c7; --primary-dark:#0d4a94; --primary-light:#e5f0fd;
    --danger:#d0342c; --danger-bg:#fde8e7; --ok:#1a8a4a; --ok-bg:#e6f7ec;
    --warn:#b8860b; --warn-bg:#fff6e0;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);direction:rtl;}
  header.top{background:linear-gradient(90deg,var(--primary-dark),var(--primary));color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  header.top h1{font-size:18px;margin:0;}
  header.top .sub{font-size:12px;opacity:.85;}
  main{max-width:1100px;margin:0 auto;padding:16px;}
  /* מסכי לוח המשמרות (טבלה מרוכזת / שיבוץ ידני) - רוחב גדול יותר כדי שהלוח יוצג רחב, לבקשת סרגיי (2026-10-07) */
  main:has(.tmpl-table){max-width:min(1800px,98vw);}
  .tmpl-shadow{display:block;margin-top:3px;padding-top:3px;border-top:1px dashed #bbb;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(20,60,110,.06);}
  h2{font-size:17px;margin:0 0 12px;color:var(--primary-dark);}
  h3{font-size:15px;margin:14px 0 8px;color:var(--primary-dark);}
  .btn{display:inline-block;background:var(--primary);color:#fff;border:none;border-radius:7px;padding:9px 16px;font-size:14px;cursor:pointer;margin:2px;}
  .btn:hover{background:var(--primary-dark);}
  .btn.secondary{background:#fff;color:var(--primary);border:1px solid var(--primary);}
  .btn.danger{background:var(--danger);}
  .btn.ok{background:var(--ok);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn.small{padding:5px 10px;font-size:12px;}
  input[type=text],input[type=password],input[type=date],input[type=time],select,textarea{
    padding:8px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;background:#fff;color:var(--text);
  }
  label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .grid-teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .team-tile{background:var(--primary-light);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center;cursor:pointer;font-weight:600;}
  .team-tile:hover{background:#d7e9fc;}
  table{border-collapse:collapse;width:100%;font-size:13px;}
  table th,table td{border:1px solid var(--border);padding:6px 8px;text-align:center;}
  table th{background:var(--primary-light);color:var(--primary-dark);}
  .shortage{background:var(--danger-bg)!important;color:var(--danger);font-weight:700;}
  .ok-cell{background:var(--ok-bg)!important;color:var(--ok);}
  .banner{padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:14px;}
  .banner.open{background:var(--ok-bg);color:var(--ok);border:1px solid #b6e3c6;}
  .banner.closed{background:var(--danger-bg);color:var(--danger);border:1px solid #f3c3c0;}
  .banner.notyet{background:var(--warn-bg);color:var(--warn);border:1px solid #f0dca0;}
  .day-card{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#fafdff;}
  .day-card h4{margin:0 0 6px;font-size:14px;color:var(--primary-dark);}
  .chip-opts{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{border:1px solid var(--border);border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer;background:#fff;user-select:none;}
  .chip.on{background:var(--danger);color:#fff;border-color:#a82720;}
  .chip.on::before{content:"✕ ";font-weight:700;}
  /* מאבטחים מסמנים "מה כן יכולים" - וי ירוק במקום X אדום; המוקד (בלי positive) נשאר X אדום כי הם מסמנים "מה לא יכולים" */
  .chip.on.positive{background:var(--ok);border-color:#136b39;}
  .chip.on.positive::before{content:"✓ ";font-weight:700;}
  .missing-worker{color:var(--muted);font-style:italic;}
  .pill{display:inline-block;background:var(--primary-light);border:1px solid var(--border);border-radius:12px;padding:2px 9px;font-size:12px;margin:2px;}
  .worker-chip{display:inline-flex;align-items:center;gap:4px;background:var(--primary-light);border:1px solid var(--border);border-radius:14px;padding:3px 8px 3px 4px;font-size:12px;margin:2px;}
  .worker-chip button{border:none;background:transparent;color:var(--danger);cursor:pointer;font-size:13px;padding:0 3px;}
  .avail-list label.opt{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:13px;}
  .muted{color:var(--muted);font-size:13px;}
  .flexbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  /* פריסת "שיבוץ" מול פאנלים צדדיים (מי זמין / סיכום משמרות) - עוטף לרוחב מלא במסכים צרים */
  .side-layout{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;}
  .side-layout>.side-main{flex:2 1 480px;min-width:280px;}
  .side-layout>.side-aside{flex:1 1 280px;min-width:240px;display:flex;flex-direction:column;gap:14px;}
  .side-layout>.side-aside>.card{margin-bottom:0;}
  .streak-warn{color:#b45309;font-weight:700;font-size:.85em;}
.streak-box{border-color:#f59e0b !important;background:#fffbeb !important;}
.note-box{background:#fff8e6;border:1px solid #f0dca0;border-radius:8px;padding:10px 12px;font-size:13px;color:#7a5c00;margin-bottom:12px;}
  .overlay{position:fixed;inset:0;background:rgba(10,30,55,.55);display:flex;align-items:center;justify-content:center;z-index:50;}
  .overlay .card{max-width:360px;width:90%;}
  .slot-row{cursor:pointer;}
  .slot-row:hover{background:#f2f8ff;}
  .tmpl-block{border:1px solid var(--border);border-radius:8px;margin-bottom:16px;overflow:hidden;}
  .tmpl-sector-head{background:var(--primary-dark);color:#fff;padding:8px 12px;font-weight:700;font-size:14px;}
  .tmpl-bucket-head{background:var(--primary-light);color:var(--primary-dark);padding:5px 12px;font-weight:600;font-size:13px;}
  .tmpl-table{border-collapse:collapse;width:100%;font-size:12px;}
  .tmpl-table th,.tmpl-table td{border:1px solid var(--border);padding:5px 6px;text-align:center;white-space:nowrap;}
  .tmpl-table th{background:#f4f7fb;font-weight:600;}
  .tmpl-table th .shabbat-th{font-weight:500;font-size:.9em;color:#7a5c00;margin-top:2px;}
  .tmpl-table td.tmpl-pos{background:#f4f7fb;font-weight:600;}
  .stask-cell{font-size:.9em;min-width:70px;}
  .tmpl-pos-hrs{font-size:.72em;font-weight:400;color:#4b5563;white-space:nowrap;line-height:1.35;}
  .tmpl-na{background:#2a2a2a;}
  .tmpl-missing{font-weight:800;}
  .tmpl-cell{cursor:pointer;}
  .tmpl-cell:hover{background:#eef6ff;}
  /* חוסר 8 שעות מנוחה בין משמרות עוקבות של אותו עובד (ידני/אוטומטי כאחד) - לבקשת סרגיי, 2026-09-28 */
  .tmpl-restwarn{background:var(--danger-bg)!important;color:var(--danger)!important;font-weight:800;box-shadow:inset 0 0 0 2px var(--danger);}
  .tmpl-resttight{background:#fff3a6!important;}
  /* בפלט הסידור (מסך התצוגה להדפסה + ההדפסה עצמה) לא מוצגים סימוני מגבלות - לא אדום ולא צהוב (2026-10-07) */
  #printArea .tmpl-restwarn, #printArea .tmpl-resttight{background:transparent!important;color:inherit!important;box-shadow:none!important;font-weight:inherit!important;}
  #printArea .tmpl-restwarn-note{display:none!important;}
  /* בפלט הסידור כל המשבצות באותו גודל: עמודות ימים ברוחב שווה (גם בין הטבלאות של בוקר/ערב/לילה) וגובה אחיד.
     לבקשת סרגיי (2026-10-08) */
  #printArea .tmpl-table{table-layout:fixed;width:100%;}
  #printArea .tmpl-table th:first-child, #printArea .tmpl-table td.tmpl-pos{width:96px;}
  #printArea .tmpl-table td{height:60px;vertical-align:middle;white-space:normal;overflow-wrap:anywhere;line-height:1.25;}
  .tmpl-restwarn-note{display:block;font-size:.8em;font-weight:700;color:var(--danger);}
  .slot-editor{background:#f6fbff;border-top:2px solid var(--primary);}
  .backlink{cursor:pointer;color:var(--primary);font-size:13px;margin-bottom:10px;display:inline-block;}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:20px;}

/* פס הלוגואים (2026-10-20, סרגיי - לוגואים מעודכנים): פס לבן מעל הכותרת, כי הלוגואים מעוצבים לרקע לבן.
   הלוגו של יחידת האבטחה שהיה כאן קודם היה פגום ולא הוצג. אותן תמונות משמשות גם בפלט הדפסה/PDF (logoStripHtml). */
.header-banner { margin: -14px -18px 12px; padding: 10px 14px; background: #fff; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: 0 0 calc(100% + 36px); max-width: calc(100% + 36px); box-sizing: border-box; border-bottom: 3px solid var(--primary); }
.logo-chip { flex: 1 1 0px; min-width: 0px; display: flex; align-items: center; justify-content: center; }
.logo-chip img { max-width: 100%; max-height: 70px; width: auto; height: auto; display: block; }
@media (max-width: 600px){ .header-banner{ padding: 8px 10px; gap: 8px; } .logo-chip img{ max-height: 48px; } }
.logo-strip { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:8px; margin-bottom:10px; border-bottom:2px solid #1f4e8c; }
.logo-strip img { width:auto; display:block; }

/* פלט סידור להדפסה/PDF - לבקשת סרגיי (2026-10-05): כפתור "הדפס/PDF" מפעיל window.print(), וכללי
   ה-@media print האלה מעלימים את כל שאר הדף ומשאירים רק את #printArea גלוי, מעמדת (position:absolute)
   בראש העמוד כדי שההדפסה תתחיל מלמעלה בלי קשר למיקום המקורי שלו ב-DOM. */
.print-header{margin-bottom:10px;}
@media print{
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute;top:0;right:0;left:0;width:100%;margin:0;padding:0;}
  .no-print{display:none!important;}
  /* משבצות "לא נדרש" (בלי תקן, אף אחד לא אמור להיות משובץ) - כחול כהה בפלט ההדפסה/PDF, לבקשת סרגיי (2026-10-05) */
  .tmpl-na{background:#0b2545!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  /* סימון צהוב של "בדיוק 8 שעות מנוחה" - מוצג רק על המסך, לא בפלט (לבקשת סרגיי, 2026-10-07) */
  .tmpl-resttight{background:transparent!important;}
}
</style>
</head>

(function(){
  var mine = (document.querySelector('script[src*="portal.js?v="]')||{}).src || "", hiddenAt = 0;
  function check(){
    fetch(location.pathname + "?nc=" + Date.now(), {cache:"no-store"}).then(function(r){ return r.text(); }).then(function(t){
      var m = t.match(/portal\.js\?v=(\d+)/), cur = mine.match(/portal\.js\?v=(\d+)/);
      if(m && cur && m[1] !== cur[1] && !document.querySelector("input:focus, textarea:focus, select:focus")) location.reload();
    }).catch(function(){});
  }
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "hidden"){ hiddenAt = Date.now(); return; }
    if(hiddenAt && Date.now() - hiddenAt > 60000) check();
  });
  window.addEventListener("load", function(){ mine = (document.querySelector('script[src*="portal.js?v="]')||{}).src || ""; setTimeout(check, 3000); });
})();

async function apiRpc(fn, body){

  const res = await fetch(url, {method:"POST", headers:{apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${SUPABASE_ANON_KEY}`, "Content-Type":"application/json"}, body:JSON.stringify(body||{})});
  const txt = await res.text();

  if(!res.ok){ const msg = (data && data.message) ? data.message : txt; throw new Error(msg||"שגיאה"); }

  if(!res.ok) throw new Error((data&&data.message)||txt);

}
async function apiUpsertSubmission(row){
  // upsert on worker_id+period_start
  const url = `${SUPABASE_URL}/rest/v1/constraint_submissions?on_conflict=worker_id,period_start`;
  const res = await fetch(url, {method:"POST", headers:{apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${SUPABASE_ANON_KEY}`, "Content-Type":"application/json", Prefer:"return=representation,resolution=merge-duplicates"}, body:JSON.stringify(row)});

}

/* ============== DATE HELPERS ============== */
function parseDate(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function fmtDate(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0"); return `${y}-${m}-${day}`; }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function sundayOnOrBefore(d){ const r=new Date(d); r.setDate(r.getDate()-r.getDay()); return r; }
const HEB_DOW = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
function fmtDateHeb(s){ const d=parseDate(s); return `${HEB_DOW[d.getDay()]} ${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`; }
function dayTypeForDate(s){ const wd=parseDate(s).getDay(); if(wd===6) return "saturday"; if(wd===5) return "friday"; return "weekday"; }
function periodLength(team){ return team.cadence==="biweekly" ? 14 : 7; }
const BIWEEK_ANCHOR = parseDate("2026-01-04"); // יום ראשון קבוע כעוגן לחישוב בלוקים דו-שבועיים
/* ברירת המחדל היא תמיד "התקופה הקרובה" (לא השבוע הנוכחי) - כי לפי ההגדרה חלון ההגשה נפתח
   וסגור *בשבוע שלפני* התקופה שמוגשים לה אילוצים. כלומר "עכשיו" תמיד אמור להיות בתוך השבוע
   שקודם לתקופת ברירת המחדל. ניתן עדיין לנווט עם ◀ ▶ לתקופות אחרות (כולל עבר). */
function currentPeriodStart(team, refDate){
  refDate = refDate || new Date();
  const sun = sundayOnOrBefore(refDate);
  if(team.cadence!=="biweekly") return fmtDate(addDays(sun,7));
  const diffDays = Math.round((sun-BIWEEK_ANCHOR)/86400000);
  const block = Math.floor(diffDays/14);
  return fmtDate(addDays(BIWEEK_ANCHOR, (block+1)*14));
}
function shiftPeriod(periodStart, team, dir){ return fmtDate(addDays(parseDate(periodStart), dir*periodLength(team))); }
function periodDates(periodStart, team){
  const n = periodLength(team); const out=[];
  for(let i=0;i<n;i++) out.push(fmtDate(addDays(parseDate(periodStart), i)));
  return out;
}
function timeToMinutes(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }
function rangesOverlaps(aStart,aEnd,bStart,bEnd){
  let as=timeToMinutes(aStart), ae=timeToMinutes(aEnd); if(ae<=as) ae+=1440;
  let bs=timeToMinutes(bStart), be=timeToMinutes(bEnd); if(be<=bs) be+=1440;
  return as<be && bs<ae;
}

/* ============== SHIFT TYPE DEFINITIONS ============== */
const SHIFT_LABELS = {
  morning:"בוקר", evening:"ערב", night:"לילה", coordinated:'מתואמת (11:00-23:00)',

  vacation:"חופשה", reserve:"מילואים", sick:"מחלה", unavailable:"לא יכול", other:"אחר (פירוט בהערה)"
};
/* סוגי "יום שלם" - חוסמים את כל המשמרות של אותו יום, ללא קשר לסוג המשמרת שנבדקת */
/* (2026-10-20) נוספו "לא יכול" ו"אחר" - מאבטח חייב לסמן כל יום בהגשה (ראו saveSubmission) */
const DAY_STATUS_TYPES = ["vacation","reserve","sick","unavailable","other"];
/* ארבע ה"ערים" הגיאוגרפיות שמשתתפות בבריכה המשותפת של "מאיר אזרואל" (דניאל כתב=ירושלים
   + אביחי קדוש=בית שמש/מודיעין עילית/ביתר עילית) - ראו computeWorkerCities ו-availableForSlot. */
const POOLED_CITY_SECTORS = ["ירושלים","בית שמש","מודיעין עילית","ביתר עילית"];
function isMokedTeam(team){ return !team.sectors || team.sectors.length===0; }
function submitOptionsForTeamDay(team, dateStr){
  const dt = dayTypeForDate(dateStr);
  if(dt==="weekday"){
    // חיפה: אין משמרת לילה בימים א'-ד', רק בלילה שבין חמישי לשישי (לבקשת סרגיי, 2026-10-20)
    const haifaNoNight = (team.sectors||[]).length===1 && team.sectors[0]==="חיפה" && parseDate(dateStr).getDay()!==4;
    const opts = haifaNoNight ? ["morning","evening"] : ["morning","evening","night"];
    if(team.has_coordinated_shift) opts.push("coordinated");
    return opts;
  }
  if(dt==="friday"){
    if(isMokedTeam(team)) return ["morning","evening","night"]; // המוקד עובד שישי כמו יום רגיל (עם התקנים מוקטנים בערב/לילה)
    const opts=["friday_morning"];
    if((team.sectors||[]).includes("חיפה")) opts.push("friday_night");
    return opts;
  }
  // מוקד בשבת: גם "ערב" (20:00-23:00, תקן אחמ"ש) - כדי שאפשר יהיה לחסום רק אותו בלי כל המוצ"ש (2026-10-07)
  if(isMokedTeam(team)) return ["evening","motzash"];
  return ["motzash"];
}
/* ================================================================
   שישי בוקר של המאבטחים (לא מוקד) - לבקשת סרגיי (2026-10-09): המשמרת מסתיימת שעתיים לפני כניסת
   השבת, בחצאי שעות - ראו fridayMorningEnd.
   זמן כניסת השבת מחושב כאן בכל פתיחה, לכל עיר בנפרד: שקיעה (חישוב אסטרונומי, NOAA) פחות דקות הדלקת
   נרות לפי המקובל בעיר (ירושלים 40, חיפה 30, שאר הערים 18 - כמו בלוחות השנה הנפוצים).
   ================================================================ */
/* כניסת שבת לפי Google (לבקשת סרגיי, 2026-10-11: "לפי מה שכתוב כשמזינים בגוגל כניסת שבת"):
   ירושלים 40 דק' לפני השקיעה, חיפה/בית שמש/ביתר עילית/מודיעין עילית 30, באר שבע 22 - כמו שמופיע בכרטיס של Google.
   Google מחשב שקיעה עם תיקון גובה; elev הוא "גובה אפקטיבי" שכויל מול Google ב-19 תאריכים
   (16/10/26, 18/12/26, 19/3/27, 18/6/27) - כולם יצאו זהים לדקה. adj = תיקון זעיר בדקות. */
const SHABBAT_CITIES = {
  "ירושלים":       {lat:31.778, lng:35.235, before:40, elev:500},
  "בית שמש":       {lat:31.747, lng:34.988, before:30, elev:100},
  "ביתר עילית":    {lat:31.696, lng:35.116, before:30, elev:500},
  "מודיעין עילית": {lat:31.932, lng:35.044, before:30, elev:200},
  "חיפה":          {lat:32.794, lng:34.989, before:30, elev:0, adj:-0.15},
  "באר שבע":       {lat:31.252, lng:34.791, before:22, elev:150}
};
function israelUtcOffsetMin(dateUtc){
  const parts = new Intl.DateTimeFormat("en-US", {timeZone:"Asia/Jerusalem", hour12:false, year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit"}).formatToParts(dateUtc);
  const g = t=>Number(parts.find(x=>x.type===t).value);
  const asUtc = Date.UTC(g("year"), g("month")-1, g("day"), g("hour")%24, g("minute"));
  return Math.round((asUtc - dateUtc.getTime())/60000);
}
/* שקיעה (שעון ישראל, בדקות מחצות, עם שבר) לתאריך "YYYY-MM-DD" - אלגוריתם NOAA המלא + תיקון גובה */
function sunsetLocalMinutes(dateStr, lat, lng, elev, altDeg){
  const [Y,M,D] = dateStr.split("-").map(Number);
  const rad = Math.PI/180;
  const alt = altDeg!=null ? altDeg : -0.8333 - 2.076*Math.sqrt(elev||0)/60;
  let t = 18*60 - lng*4; // דקות UTC, ניחוש התחלתי
  for(let it=0; it<3; it++){
    const jd = Date.UTC(Y, M-1, D)/86400000 + 2440587.5 + t/1440;
    const T = (jd - 2451545)/36525;
    const L0 = (280.46646 + T*(36000.76983 + T*0.0003032)) % 360;
    const Mm = 357.52911 + T*(35999.05029 - 0.0001537*T);
    const e = 0.016708634 - T*(0.000042037 + 0.0000001267*T);
    const C = Math.sin(Mm*rad)*(1.914602 - T*(0.004817 + 0.000014*T)) + Math.sin(2*Mm*rad)*(0.019993 - 0.000101*T) + Math.sin(3*Mm*rad)*0.000289;
    const om = 125.04 - 1934.136*T;
    const lam = L0 + C - 0.00569 - 0.00478*Math.sin(om*rad);
    const eps = 23 + (26 + (21.448 - T*(46.815 + T*(0.00059 - T*0.001813)))/60)/60 + 0.00256*Math.cos(om*rad);
    const decl = Math.asin(Math.sin(eps*rad)*Math.sin(lam*rad));
    const y = Math.tan(eps/2*rad)**2;
    const eqt = 4/rad*(y*Math.sin(2*L0*rad) - 2*e*Math.sin(Mm*rad) + 4*e*y*Math.sin(Mm*rad)*Math.cos(2*L0*rad) - 0.5*y*y*Math.sin(4*L0*rad) - 1.25*e*e*Math.sin(2*Mm*rad));
    const cosH = (Math.sin(alt*rad) - Math.sin(lat*rad)*Math.sin(decl)) / (Math.cos(lat*rad)*Math.cos(decl));
    t = 720 - 4*lng - eqt + 4*Math.acos(Math.max(-1, Math.min(1, cosH)))/rad;
  }
  const setUtc = new Date(Date.UTC(Y, M-1, D) + Math.floor(t)*60000); // דקה שלמה - כדי שחישוב הפרש השעון לא יאבד שניות
  return (t + israelUtcOffsetMin(setUtc) + 1440) % 1440;
}
function candleLightingMinutes(dateStr, sector){
  const c = SHABBAT_CITIES[sector]; if(!c) return null;
  return Math.round(sunsetLocalMinutes(dateStr, c.lat, c.lng, c.elev) + (c.adj||0)) - c.before;
}
/* צאת שבת (2026-10-20): השמש 8.5° מתחת לאופק - כמו בלוחות השנה הנפוצים. dateStr = יום שבת. */
function shabbatExitMinutes(dateStr, sector){
  const c = SHABBAT_CITIES[sector]; if(!c) return null;
  return Math.ceil(sunsetLocalMinutes(dateStr, c.lat, c.lng, 0, -8.5));
}
/* תחילת משמרת מוצ"ש של המאבטחים: שעה אחרי צאת שבת (לבקשת סרגיי, 2026-10-20) */
function motzashStart(dateStr, sector){
  const ex = shabbatExitMinutes(dateStr, sector); if(ex==null) return null;
  return fmtMinutes(Math.round((ex + 60)/30)*30); // מעוגל לחצי השעה הקרובה (סרגיי, 2026-10-20)
}
function fmtMinutes(m){ const h = Math.floor(m/60), mm = Math.round(m%60); return `${String(h).padStart(2,"0")}:${String(mm).padStart(2,"0")}`; }
/* סיום משמרת שישי בוקר: שעתיים לפני כניסת שבת, בחצאי שעות (לבקשת סרגיי, 2026-10-09):
   כניסה עד "ורבע" (17:15) → סיום בשעה העגולה שעתיים לפני (15:00);
   כניסה אחרי "ורבע" ועד "רבע ל" (18:17, 19:35, 20:28) → סיום בחצי (16:30, 17:30, 18:30);
   כניסה אחרי "רבע ל" (17:48, 18:51) → סיום בשעה העגולה שאחרי (16:00, 17:00). */
function fridayMorningEnd(dateStr, sector){
  const cl = candleLightingMinutes(dateStr, sector); if(cl==null) return null;
  const h = Math.floor(cl/60), m = cl % 60;
  const end = m <= 15 ? (h-2)*60 : m <= 45 ? (h-2)*60 + 30 : (h-1)*60;
  return fmtMinutes(end);
}
/* התקן בפועל לתאריך מסוים: כמו התקן הרגיל, חוץ משישי בוקר של המאבטחים שמתעדכן לפי כניסת השבת */
function effQuota(q, dateStr){
  if(q && q.shift_type==="motzash" && q.sector!=="מוקד" && dayTypeForDate(dateStr)==="saturday"){
    const st = motzashStart(dateStr, q.sector);
    if(!st || st===String(q.start_time).slice(0,5)) return q;
    return Object.assign({}, q, {start_time:st, label: String(q.label||"").replace(/\(\d{2}:\d{2}-(\d{2}:\d{2})\)/, `(${st}-$1)`), shabbat_adjusted:true});
  }
  if(!q || q.shift_type!=="friday_morning" || q.sector==="מוקד" || dayTypeForDate(dateStr)!=="friday") return q;
  const end = fridayMorningEnd(dateStr, q.sector);
  if(!end || end===String(q.end_time).slice(0,5)) return q;
  return Object.assign({}, q, {end_time:end, label: String(q.label||"").replace(/\(\d{2}:\d{2}-\d{2}:\d{2}\)/, `(${String(q.start_time).slice(0,5)}-${end})`), shabbat_adjusted:true});
}
/* כניסת שבת בתוך טבלת הסידור עצמה (2026-10-12, לבקשת סרגיי): בכותרת עמודת יום שישי, לכל עיר, רק השעה.
   מחושב לכל תאריך מחדש - מתעדכן אוטומטית מדי שבוע. שעות סיום שישי בוקר כבר מובנות במשבצות (effQuota). */
function shabbatThHtml(dateStr, sector){
  if(dayTypeForDate(dateStr)==="saturday" && SHABBAT_CITIES[sector]){
    const ex = shabbatExitMinutes(dateStr, sector); if(ex==null) return "";
    return `<div class="shabbat-th">✨ צאת שבת ${fmtMinutes(ex)}</div>${sector!=="מוקד"?`<div class="shabbat-th">מוצ"ש מ-${motzashStart(dateStr, sector)} (שעה אחרי צאת שבת)</div>`:""}`;
  }
  if(dayTypeForDate(dateStr)!=="friday" || !SHABBAT_CITIES[sector]) return "";
  const m = candleLightingMinutes(dateStr, sector);
  if(m==null) return "";
  const fe = sector!=="מוקד" ? fridayMorningEnd(dateStr, sector) : null;
  return `<div class="shabbat-th">🕯️ כניסת שבת ${fmtMinutes(m)}</div>${fe?`<div class="shabbat-th">סיום משמרת בוקר: ${fe} (שעתיים לפני כניסת שבת)</div>`:""}`;
}
/* (לא בשימוש מאז 2026-10-12 - הוחלף ב-shabbatThHtml) */

}
/* תווית לבחירת משמרת בטופס - בשבת "ערב" מציג את השעות מתוך התקן של המוקד */

/* "למי מגישים" במסך הגשת אילוצים - שמות אנשים ידידותיים במקום שמות קב"טים טכניים.
   כל נמען ממופה לצוות-בפועל אחד ב-DB (למשל "מאיר אזרואל" -> הצוות שנקרא בפועל "אביחי קדוש",
   כמו שכבר נהוג במסך הטבלה המרוכזת/קוד קב"ט - ראו sectorGroupForTeam/pickerTiles). */

function getAdminRecipients(){

/* צוות ה"קוד" בפועל לקבוצה ממוזגת - אותו repId שכבר נהוג ב-pickerTiles/sectorGroupForTeam
   (הצוות עם sort_order הנמוך ביותר מבין הצוותים בקבוצה - בפועל תמיד אביחי קדוש למאיר אזרואל). */
function adminCodeTeamId(teamIds){
  if(teamIds.length===1) return teamIds[0];
  const teams = S.teams.filter(t=>teamIds.includes(t.id)).sort((a,b)=>a.sort_order-b.sort_order);
  return teams[0].id;
}

/* גזרות/ערים לצוות, כולל איחוד ירושלים+סובב ירושלים (הפלט הולך למאיר אזרואל, לא לדניאל/אביחי) ואיחוד צוותים החולקים אותה עיר (כמו באר שבע) */
function sectorGroupForTeam(team){
  if((team.sectors||[]).includes("סובב ירושלים") || (team.sectors||[]).includes("ירושלים")){
    const jTeam = S.teams.find(t=>(t.sectors||[]).includes("ירושלים"));
    const svTeam = S.teams.find(t=>(t.sectors||[]).includes("סובב ירושלים"));
    const ids = [jTeam, svTeam].filter(Boolean).map(t=>t.id);
    return { citySectors:["ירושלים","בית שמש","מודיעין עילית","ביתר עילית"], teamIds: ids.length?ids:[team.id], label:"מאיר אזרואל", pooledNote:true };
  }
  if(isMokedTeam(team)){
    return { citySectors:["מוקד"], teamIds:[team.id], label:team.name, pooledNote:false };
  }
  const city = team.sectors[0];
  const siblingTeams = S.teams.filter(t=> (t.sectors||[]).includes(city));
  return { citySectors:[city], teamIds:siblingTeams.map(t=>t.id), label: siblingTeams.length>1? siblingTeams.map(t=>t.name).join(" / ") : team.name, pooledNote:siblingTeams.length>1 };
}

/* לאיזו עיר/ערים (מתוך POOLED_CITY_SECTORS) עובד ספציפי שייך בפועל, לצורך שיבוץ אוטומטי/ידני וטבלת
   הזמינות - כך שעובד המשויך למשל ל"בית שמש" לא ייחשב זמין למשמרת ב"מודיעין עילית" רק כי הוא סימן
   שהוא פנוי ביום/שעה הזו (הגשת האילוצים לא כוללת גזרה, ראו "מודל זמינות" בתיעוד).
   מקור הנתון: roster_workers.city_sectors (מוזן ידנית לעובדי "אביחי קדוש" - הם היחידים שהצוות
   הטכני שלהם ["סובב ירושלים"] אינו גזרה אמיתית ומתפרש ל-3 ערים). לעובדי "דניאל כתב" (=ירושלים)
   אין צורך למלא את העמודה - הגזרה שלהם נגזרת ישירות מהצוות. עובד ב"אביחי קדוש" שעדיין לא הוגדרה
   לו עיר (city_sectors ריק/null) מוחזר כ-null - כלומר ללא הגבלה (ברירת מחדל בטוחה, לא מסתיר עובד
   חדש בטעות עד שיוגדר לו שיוך). */
/* עדכון (2026-10-08, לבקשת סרגיי): עובד של "אביחי קדוש" (סובב ירושלים) שעדיין לא הוגדרה לו עיר - משובץ
   רק בערי סובב ירושלים (בית שמש / מודיעין עילית / ביתר עילית), לא בירושלים. עובדי "דניאל כתב" - רק ירושלים. */

   "עדיפות ראשונה/שנייה/שלישית/רביעית" מתוך 4 ערי האזור. עובד בלי העדפות ("ללא העדפה") = זמין לכל הערים.
   (כל העובדים הקיימים כבר מוגדרים במפורש, כך שאין שינוי בשיבוץ שלהם.) */

/* עיר שכבר נבחרה באחת העדיפויות לא ניתנת לבחירה בעדיפות אחרת (2026-10-12) */
function syncCityPrefs(prefix){
  const sels = CITY_PRIORITY_LABELS.map((_,i)=>document.getElementById(prefix+"_"+i)).filter(Boolean);
  const chosen = sels.map(x=>x.value);
  sels.forEach((sel,i)=>{
    Array.from(sel.options).forEach(o=>{ o.disabled = !!o.value && chosen.some((v,j)=>j!==i && v===o.value); });
  });
}
/* קורא את הבחירות לפי הסדר עד ה"ללא העדפה" הראשון - מה שאחריו לא נחשב. בלי בחירה בכלל = null (זמין לכל הערים) */
function readCityPrefs(prefix){
  const out = [];
  for(let i=0;i<CITY_PRIORITY_LABELS.length;i++){
    const el = document.getElementById(prefix+"_"+i);
    const v = el ? el.value : "";
    if(!v) break;
    if(out.includes(v)) return {error: `"${v}" נבחרה פעמיים בסדר העדיפויות`};
    out.push(v);
  }
  return {cities: out.length ? out : null};
}
function cityPrefsText(w){
  return (w.city_sectors && w.city_sectors.length) ? w.city_sectors.map((c,i)=>`${i+1}. ${c}`).join(" · ") : "ללא העדפה (כל הערים)";
}

/* כפתורי בחירת קב"ט למסכים שונים: מאחד קבוצות מאוגדות (כמו ירושלים+סובב ירושלים) לכפתור אחד */
function pickerTiles(){
  const seen = new Set();
  const tiles = [];
  S.teams.forEach(t=>{
    if(seen.has(t.id)) return;
    const group = sectorGroupForTeam(t);
    group.teamIds.forEach(id=>seen.add(id));
    tiles.push({ repId:t.id, label: group.pooledNote ? group.label : t.name });
  });
  return tiles;
}

/* ============== INIT ============== */
async function init(){
  try{
    const [teams, quotas] = await Promise.all([
      apiGet("constraint_teams","select=*&order=sort_order"),
      apiGet("shift_quotas","select=*&order=sector,sort_order")
    ]);
    S.teams = teams;
    S.quotas = quotas;
  }catch(e){
    document.getElementById("app").innerHTML = `<div class="card"><p class="shortage">שגיאה בטעינת הנתונים: ${escapeHtml(e.message)}</p></div>`;
    return;
  }
  render();
}
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
