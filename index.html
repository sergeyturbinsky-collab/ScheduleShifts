/* אותו רעיון כמו renderTemplateGrid, אך לגזרת המוקד: השורות הן לפי תפקיד (אחמ"ש/מוקדן), לא "סייר N",
   ומספר השורות לכל תפקיד נגזר מ-role_counts בפועל. עובד שהצטרף למשבצת בגלל חפיפה של שעות מותאמות
   (ראו tmplCustomRangeBuckets) יוצג יחד עם עובד אחר באותו תא/שורה, מופרדים ב-"\" (בדיוק כמו בטופס). */
function renderMokedTemplateGrid(group, dates, ui, mode){
  const quotas = S.quotas;
  const workersById = ui.allWorkersById || (()=>{ const m={}; (ui.workers||[]).forEach(w=>m[w.id]=w); return m; })();
  const assignmentsByDate = {};
  (ui.assignments||[]).forEach(a=>{ (assignmentsByDate[a.entry_date] = assignmentsByDate[a.entry_date]||[]).push(a); });
  const restViolations = computeRestViolations(ui.allAssignments || ui.assignments || []);
  const sectors = buildTemplateData(group, dates, quotas);

  function cellText(picked, q, sector, date){
    return picked.map(a=>{
      const w = workersById[a.worker_id];
      const restBad = restViolations.has(restKey(a));
      const restNote = restBad? `<span class="tmpl-restwarn-note">⚠ &lt;8 שעות מנוחה</span>` : "";
      return `<span class="${restBad?'tmpl-restwarn':''}">${escapeHtml(w?w.name:"?")}<br><span class="muted" style="font-size:.85em;">${tmplHoursTxt2(group,date,sector,q,a,assignmentsByDate)}</span>${restNote}</span>`;
    }).join(' \\ ');
  }

  const blocksHtml = sectors.map(secData=>{
    if(!secData.buckets.length) return "";
    const bucketsHtml = secData.buckets.map(bucket=>{
      if(!bucket.roles.length) return "";
      const rowsHtml = bucket.roles.map(role=>{
        const roleRowsCount = bucket.roleMax[role]||1;
        return Array.from({length:roleRowsCount}, (_,i)=>i+1).map(ridx=>{
          const cells = dates.map(d=>{
            const q = bucket.perDate[d];
            const roleReq = q && q.role_counts ? (q.role_counts[role]||0) : 0;
            if(!q || ridx>roleReq) return `<td class="tmpl-na"></td>`;
            const candidates = tmplRoleAssignedListWithOverride(assignmentsByDate, d, secData.sector, q.shift_type, role, workersById, q.role_counts);
            const picked = pickedForRoleCell(candidates, ridx, roleRowsCount);
            const anyRestBad = picked.some(a=>restViolations.has(restKey(a)));
            const anyRestTight = !anyRestBad && picked.some(a=>restViolations.tight.has(restKey(a)));
            // התא הראשון של המשבצת (התפקיד הראשון שנדרש באותו יום, שורה 1) - שם מוצגות חפיפות "יתומות"
            const firstRole = bucket.roles.find(r=> q.role_counts && (q.role_counts[r]||0)>0);
            const shadowHtml = tmplShadowHtml(tmplCellShadows(assignmentsByDate, d, secData.sector, q.shift_type, picked.map(a=>a.worker_id), role===firstRole && ridx===1), q, id=>{ const x=workersById[id]; return x?x.name:"?"; });
            if(mode==="manual"){
              const cls = "tmpl-cell" + (picked.length? (anyRestBad?" tmpl-restwarn":(anyRestTight?" tmpl-resttight":"")) : " tmpl-missing");
              const label = (picked.length ? cellText(picked, q, secData.sector, d) : "חוסר") + shadowHtml;
              return `<td class="${cls}" data-action="tmpl-cell" data-sector="${escapeHtml(secData.sector)}" data-date="${d}" data-type="${q.shift_type}" data-role="${escapeHtml(role)}" data-ridx="${ridx}">${label}</td>`;
            }
            if(picked.length) return `<td class="${anyRestTight?'tmpl-resttight':''}">${cellText(picked, q, secData.sector, d)}${shadowHtml}</td>`;
            return `<td class="tmpl-missing">חוסר${shadowHtml}</td>`;
          }).join("");
          return `<tr><td class="tmpl-pos">${escapeHtml(role)}${roleRowsCount>1?` ${ridx}`:""}</td>${cells}</tr>`;
        }).join("");
      }).join("");
      return `
      <div class="tmpl-bucket-head">${escapeHtml(bucket.label)}</div>
      <div style="overflow-x:auto;">
      <table class="tmpl-table">
        <thead><tr><th></th>${dates.map(d=>`<th>${fmtDateHeb(d)}</th>`).join("")}</tr></thead>
        <tbody>${rowsHtml || `<tr><td colspan="${dates.length+1}" class="muted">אין תקן</td></tr>`}</tbody>
      </table>
      </div>`;
    }).join("");
    return `<div class="tmpl-block"><div class="tmpl-sector-head">${escapeHtml(secData.sector)}</div>${bucketsHtml}</div>`;
  }).join("");

  return blocksHtml || `<p class="muted">אין תקן מוגדר למוקד.</p>`;
}

/* טופס מוקטן "הוסף עובד חדש", מוטמע בתוך overlay של תא שיבוץ (גיאוגרפי או מוקד) - כדי שאפשר יהיה
   להוסיף עובד חסר בלי לצאת ממסך השיבוץ הידני, לבקשת סרגיי (2026-09-28). ה-PIN כבר קיים (S.pin) כי
   נכנסים לכאן רק אחרי אימות קוד עריכה לשיבוץ ידני (ראו confirmPin, next==="manual").

    <div class="row" style="margin-top:8px;">

/* כפתור "חפיפה" במסך בחירת סוג המשמרת - רק לעובד שמסומן "חפיפה" בניהול העובדים, ורק כשבתא כבר משובץ
   עובד אחר (איתו נעשית החפיפה). */
function tmplShadowButton(c, w){
  if(!w || !w.shadow_trainee) return "";
  const host = tmplCellHost(c);
  if(!host || host.worker_id===w.id) return `<span class="muted" style="font-size:.85em;">חפיפה אפשרית רק בתא שכבר משובץ בו עובד אחר</span>`;

function renderTmplCellOverlay(){
  const ui = S.ui;
  const c = ui.tmplCell;
  if(!c) return "";
  const team = teamById(ui.teamId);
  const group = sectorGroupForTeam(team);
  const dates = periodDates(ui.periodStart, team);
  const slots = buildSlots(dates, group, S.quotas);
  const slot = slots.find(s=>s.sector===c.sector && s.date===c.date && s.shiftType===c.type);
  const assignmentsByDate = {};
  (ui.assignments||[]).forEach(a=>{ (assignmentsByDate[a.entry_date] = assignmentsByDate[a.entry_date]||[]).push(a); });
  const workers = ui.workers.filter(w=>!shabbatBlocked(w, c.date, c.type)); // שומרי שבת לא מוצגים בשישי ערב/לילה ושבת ערב
  const currentList = tmplAssignedList(assignmentsByDate, c.date, c.sector, c.type);
  const currentIds = new Set(currentList.map(a=>a.worker_id));
  const avail = slot ? availableForSlot(slot, workers, ui.entriesByWorker, assignmentsByDate, slotKey(c.sector,c.type)) : [];
  // --- מי שסימן/ה זמינות למשמרת הזו אך כבר משובץ/ת למשמרת אחרת היום - מוצג/ת בנפרד, עם הערה על
  // המשמרת שבה הוא/היא כבר עובד/ת, ואפשר לשבץ בכל זאת (למשל תגבור/משמרת כפולה מכוונת). לבקשת
  // סרגיי (2026-10-06). ---
  const availIncludingBusy = slot ? availableForSlot(slot, workers, ui.entriesByWorker, assignmentsByDate, slotKey(c.sector,c.type), false, true) : [];
  const currentWorker = currentList[c.pos-1] ? (workers.find(w=>w.id===currentList[c.pos-1].worker_id) || (ui.allWorkersById||{})[currentList[c.pos-1].worker_id]) : null;

  // --- "הצג זמינים מגזרות אחרות": רק עובדים שסימנו בעצמם זמינות ליום/משמרת הזו, מכל גזרה אחרת - לבקשת סרגיי (2026-09-28) ---
  const otherWorkers = (ui.otherWorkers || []).filter(w=>!shabbatBlocked(w, c.date, c.type));
  const allAssignmentsByDate = {};
  (ui.allAssignments||[]).forEach(a=>{ (allAssignmentsByDate[a.entry_date] = allAssignmentsByDate[a.entry_date]||[]).push(a); });
  const otherAvail = slot ? availableForSlot(slot, otherWorkers, ui.otherEntriesByWorker||{}, allAssignmentsByDate, slotKey(c.sector,c.type)) : [];
  const otherOptions = otherAvail.filter(w=>!currentIds.has(w.id));

  // שלב 2: נבחר עובד - לבחור משמרת סטנדרטית או שעות מותאמות
  if(ui.tmplPickedWorker){
    const w = workers.find(x=>x.id===ui.tmplPickedWorker) || (ui.allWorkersById||{})[ui.tmplPickedWorker];
    return `
    <div class="overlay" data-action="tmpl-cell-bg">
      <div class="card" data-action="noop">
        <h3>${escapeHtml(w?w.name:"")} · ${escapeHtml(c.sector)} · ${fmtDateHeb(c.date)}</h3>
        ${streakNoticeHtml(ui.tmplPickedWorker, c.date, c.type)}
        ${partialNoticeHtml(w, slot)}
        ${ui.tmplHoursMode!=="custom" ? `
          <div class="row">
            <button class="btn" data-action="tmpl-hours-standard">משמרת סטנדרטית</button>
            <button class="btn secondary" data-action="tmpl-hours-custom">שעות מותאמות</button>

            <button class="btn" data-action="tmpl-hours-confirm">אישור</button>
            <button class="btn secondary" data-action="tmpl-hours-back">חזרה</button>
          </div>
        `}

          <button class="btn secondary" data-action="tmpl-cell-close">ביטול</button>
        </div>
        ${ui.tmplCellMsg? `<p class="shortage">${escapeHtml(ui.tmplCellMsg)}</p>`:""}
      </div>
    </div>`;
  }

  const options = workers.filter(w=> !currentIds.has(w.id) || w.id===(currentWorker&&currentWorker.id));
  // --- מיון התצוגה: קודם זמינים (ופנויים), אח"כ זמינים-אך-כבר-משובצים-היום-במשמרת-אחרת (עם הערה),
  // אח"כ לא-זמינים (שיבוץ ידני בכל זאת) - ואז (למטה) האפשרות הרביעית - זמינים מגזרה אחרת.
  // לבקשת סרגיי (2026-10-05, הורחב 2026-10-06). ---
  const availOptions = options.filter(w=>avail.some(a=>a.id===w.id));
  const busyOptions = options.filter(w=> !avail.some(a=>a.id===w.id) && availIncludingBusy.some(a=>a.id===w.id));
  const unavailOptions = options.filter(w=>!availIncludingBusy.some(a=>a.id===w.id));
  const pickBtn = w => `<button class="btn small ${w.id===(currentWorker&&currentWorker.id)?"":"secondary"}" data-action="tmpl-pick" data-worker="${w.id}">${escapeHtml(w.name)}${streakTag(w.id, c.date, c.type)}${partialTag(w, slot)}</button>`;
  const busyNote = w => {
    const already = (assignmentsByDate[c.date]||[]).filter(a=>a.worker_id===w.id);
    const labels = Array.from(new Set(already.map(a=>SHIFT_LABELS[a.shift_type]||a.shift_type)));
    return labels.join("/") || "משמרת אחרת";
  };
  const busyBtn = w => `<button class="btn small secondary" data-action="tmpl-pick" data-worker="${w.id}">${escapeHtml(w.name)}${streakTag(w.id, c.date, c.type)}${partialTag(w, slot)} <span class="muted">(כבר משובץ/ת: ${escapeHtml(busyNote(w))})</span></button>`;
  return `
  <div class="overlay" data-action="tmpl-cell-bg">
    <div class="card" data-action="noop">
      <h3>${escapeHtml(c.sector)} · ${fmtDateHeb(c.date)} · סייר ${c.pos}</h3>
      ${currentWorker? `<p class="muted">משובץ כרגע: ${escapeHtml(currentWorker.name)}</p>`:""}
      ${tmplShadowInfoHtml(c)}
      <div class="avail-list">
        <button class="btn small ${!currentWorker?"secondary":""}" data-action="tmpl-pick" data-worker="">חוסר / נקה</button>
      </div>
      <p class="muted" style="margin:8px 0 2px;font-weight:600;">זמינים</p>
      <div class="avail-list">
        ${availOptions.length? availOptions.map(pickBtn).join("") : '<span class="muted">אין עובדים זמינים</span>'}
      </div>
      ${busyOptions.length? `
      <p class="muted" style="margin:8px 0 2px;font-weight:600;">זמינים, אך כבר משובצים היום במשמרת אחרת</p>
      <div class="avail-list">
        ${busyOptions.map(busyBtn).join("")}
      </div>` : ""}
      ${unavailOptions.length? `
      <p class="muted" style="margin:8px 0 2px;font-weight:600;">לא זמינים (שיבוץ ידני בכל זאת)</p>
      <div class="avail-list">
        ${unavailOptions.map(pickBtn).join("")}
      </div>` : ""}
      <div class="row" style="margin-top:8px;">
        <button class="btn small secondary" data-action="tmpl-other-sectors-toggle">${ui.tmplShowOtherSectors?"הסתר זמינים מגזרות אחרות":"הצג זמינים מגזרות אחרות"}</button>
      </div>
      ${ui.tmplShowOtherSectors? `
      <div class="avail-list" style="margin-top:4px;">
        ${otherOptions.length? otherOptions.map(w=>{
          const t = teamById(w.team_id);
          return `<button class="btn small secondary" data-action="tmpl-pick" data-worker="${w.id}">${escapeHtml(w.name)}${streakTag(w.id, c.date, c.type)}${partialTag(w, slot)} <span class="muted">(${escapeHtml(t?t.name:"")})</span></button>`;
        }).join("") : '<span class="muted">אין עובדים זמינים מגזרות אחרות</span>'}
      </div>` : ""}
      <div class="row" style="margin-top:8px;">
        <button class="btn small secondary" data-action="tmpl-add-worker-toggle">➕ הוסף עובד חדש</button>
      </div>
      ${ui.tmplAddWorkerOpen? renderAddWorkerForm(c.sector, group, null) : ""}
      <div class="row" style="margin-top:10px;">
        <button class="btn secondary" data-action="tmpl-cell-close">סגור/י</button>
      </div>
      ${ui.tmplCellMsg? `<p class="shortage">${escapeHtml(ui.tmplCellMsg)}</p>`:""}
    </div>
  </div>`;
}

/* אותו overlay, לתא לפי תפקיד (מוקד): מציג/בוחר רק עובדים מהתפקיד המתאים (אחמ"ש/מוקדן) */
function renderMokedCellOverlay(){
  const ui = S.ui;

  const assignmentsByDate = {};
  (ui.assignments||[]).forEach(a=>{ (assignmentsByDate[a.entry_date] = assignmentsByDate[a.entry_date]||[]).push(a); });
  const workers = ui.workers.filter(w=>!shabbatBlocked(w, c.date, c.type)); // שומרי שבת לא מוצגים בשישי ערב/לילה ושבת ערב
  const workersById = ui.allWorkersById && Object.keys(ui.allWorkersById).length ? ui.allWorkersById : (()=>{ const m={}; ui.workers.forEach(w=>m[w.id]=w); return m; })();
  const candidates = tmplRoleAssignedListWithOverride(assignmentsByDate, c.date, c.sector, c.type, c.role, workersById, slot?slot.roleCounts:null);
  const currentIds = new Set(candidates.map(a=>a.worker_id));
  const avail = slot ? availableForSlot(slot, workers, ui.entriesByWorker, assignmentsByDate, slotKey(c.sector,c.type)) : [];
  // --- מי שסימן/ה זמינות למשמרת הזו אך כבר משובץ/ת למשמרת אחרת היום - מוצג/ת בנפרד, עם הערה על
  // המשמרת שבה הוא/היא כבר עובד/ת, ואפשר לשבץ בכל זאת. לבקשת סרגיי (2026-10-06). ---
  const availIncludingBusy = slot ? availableForSlot(slot, workers, ui.entriesByWorker, assignmentsByDate, slotKey(c.sector,c.type), false, true) : [];
  const currentNames = candidates.map(a=>{ const w=workersById[a.worker_id]; return w?w.name:"?"; }).join(", ");

  // --- אחמ"ש יכול למלא גם תקן מוקדן בשיבוץ ידני (כיוון אחד בלבד - בדיוק כמו ה-fallback הקיים
  // בשיבוץ האוטומטי, ראו runAutoAssign/section ז; אין כיוון הפוך, מוקדן אף פעם לא ממלא תקן אחמ"ש).
  // לבקשת סרגיי (2026-10-06). מציג אחמ"שים זמינים (ignoreRole=true, מסונן לתפקיד אחמ"ש) שלא כבר
  // משובצים לאותה משבצת בדיוק (בכל תפקיד). השיבוץ בפועל (assignRoleOverrideWorker) מוסיף אותם
  // לרשימת השיבוץ הכוללת של המשבצת בלי לנסות "להתחזות" למוקדן - הם יוצגו בתצוגה תחת השורה של
  // התפקיד האמיתי שלהם (אחמ"ש), בדיוק כמו שקורה כבר היום בשיבוץ האוטומטי. ---
  const slotAssignedIds = new Set(tmplAssignedList(assignmentsByDate, c.date, c.sector, c.type).map(a=>a.worker_id));
  const roleOverrideAvail = (c.role==="מוקדן" && slot) ? availableForSlot(slot, workers, ui.entriesByWorker, assignmentsByDate, slotKey(c.sector,c.type), true) : [];
  const roleOverrideOptions = roleOverrideAvail.filter(w=> w.role==='אחמ"ש' && !slotAssignedIds.has(w.id));
  // אחמ"שים שזמינים למשמרת הזו אך כבר משובצים היום במשמרת אחרת - מוצגים באותו מדור עם הערה, ואפשר לשבץ

  const roleOverrideBusy = (c.role==="מוקדן" && slot)
    ? availableForSlot(slot, workers, ui.entriesByWorker, assignmentsByDate, slotKey(c.sector,c.type), true, true)

    : [];
  // וגם אחמ"שים שלא זמינים לפי ההגשה - מוצגים (לא מוסתרים), לשיבוץ ידני בכל זאת. לבקשת סרגיי (2026-10-07)
  const roleOverrideUnavail = (c.role==="מוקדן")

  const otherWorkers = (ui.otherWorkers||[]).filter(w=>w.role===c.role && !shabbatBlocked(w, c.date, c.type));
  const allAssignmentsByDate = {};

          </div>
          <p class="muted">אם הטווח חופף משמרת סמוכה ביותר מ-3 שעות, העובד יופיע גם שם עם הערת שעה (חפיפה). חפיפה של 3 שעות או פחות — הוא ישובץ רק למשמרת השנייה.</p>
          <div class="row" style="margin-top:8px;">
            <button class="btn" data-action="tmpl-hours-confirm">אישור</button>
            <button class="btn secondary" data-action="tmpl-hours-back">חזרה</button>
          </div>
        `}
        <div class="row" style="margin-top:10px;">
          <button class="btn secondary" data-action="tmpl-cell-close">ביטול</button>
        </div>
        ${ui.tmplCellMsg? `<p class="shortage">${escapeHtml(ui.tmplCellMsg)}</p>`:""}
      </div>
    </div>`;

  // לא-זמינים (שיבוץ ידני בכל זאת) - ואז (למטה) האפשרות הרביעית - זמינים מגזרה אחרת. לבקשת סרגיי

  const pickBtn = w => `<button class="btn small secondary" data-action="tmpl-pick" data-worker="${w.id}">${escapeHtml(w.name)}${streakTag(w.id, c.date, c.type)}${partialTag(w, slot)}</button>`;

/* מגדיר מחדש את כל רשימת העובדים למשמרת נתונה (sector,date,shiftType) - תוך שימור שעות מותאמות
   שהיו לעובדים אחרים שנשארים ברשימה. נחוץ כי rpc_assignment_set מוחק ומכניס מחדש את כל השורות של
   אותה משמרת, ולכן בלי השחזור הזה כל עריכה של משבצת אחת הייתה מוחקת "חפיפות"/שעות מותאמות של
   עובדים אחרים שכבר משובצים לאותה משמרת (למשל: קארינה עם שעות מותאמות במשמרת ערב, ואז שיבוץ עובד
   נוסף לאותה משמרת - היה מאפס את השעות המותאמות של קארינה). */
async function setAssignmentListPreservingHours(sector, date, shiftType, list, method, justSetWorkerId, justSetStart, justSetEnd, opts){
  // opts.addShadow = {workerId, hostId, cs, ce} - מוסיף שיבוץ "חפיפה"; opts.dropShadowIds - מסיר חפיפות.
  // חפיפות קיימות במשבצת נשמרות (rpc_assignment_set מוחק את כל שורות המשבצת), אלא אם העובד עבר לשיבוץ רגיל.
  opts = opts || {};
  const ui = S.ui;
  const slotRows = (ui.assignments||[]).filter(a=>a.entry_date===date && a.sector===sector && a.shift_type===shiftType);
  const prevHours = {}, prevRole = {};
  slotRows.forEach(a=>{ if(a.custom_start || a.custom_end) prevHours[a.worker_id] = {cs:a.custom_start, ce:a.custom_end}; if(a.filled_role) prevRole[a.worker_id] = a.filled_role; });
  // opts.setRole = {workerId, role} - קובע איזה תקן העובד ממלא (null = התפקיד שלו)
  if(opts.setRole) prevRole[opts.setRole.workerId] = opts.setRole.role || null;
  const drop = opts.dropShadowIds || [];
  const addId = opts.addShadow ? opts.addShadow.workerId : null;
  const shadowEntries = slotRows.filter(a=>a.shadow_of && !list.includes(a.worker_id) && !drop.includes(a.worker_id) && a.worker_id!==addId)
    .map(a=>({workerId:a.worker_id, hostId:a.shadow_of, cs:a.custom_start, ce:a.custom_end}));
  if(opts.addShadow) shadowEntries.push(opts.addShadow);
  const fullList = list.concat(shadowEntries.map(x=>x.workerId).filter(id=>!list.includes(id)));
  await apiRpc("rpc_assignment_set", {p_pin:S.pin, p_sector:sector, p_entry_date:date, p_shift_type:shiftType, p_worker_ids:fullList, p_method:method});
  if(justSetWorkerId && (justSetStart||justSetEnd)){
    await apiRpc("rpc_assignment_set_hours", {p_pin:S.pin, p_sector:sector, p_entry_date:date, p_shift_type:shiftType, p_worker_id:justSetWorkerId, p_custom_start:justSetStart||null, p_custom_end:justSetEnd||null});
  }
  for(const wid of list){
    if(wid===justSetWorkerId) continue;
    if(prevHours[wid]) await apiRpc("rpc_assignment_set_hours", {p_pin:S.pin, p_sector:sector, p_entry_date:date, p_shift_type:shiftType, p_worker_id:wid, p_custom_start:prevHours[wid].cs, p_custom_end:prevHours[wid].ce});
  }
  for(const wid of list){
    if(prevRole[wid]) await apiRpc("rpc_assignment_set_role", {p_pin:S.pin, p_sector:sector, p_entry_date:date, p_shift_type:shiftType, p_worker_id:wid, p_role:prevRole[wid]});
  }
  for(const sh of shadowEntries){
    await apiRpc("rpc_assignment_set_shadow", {p_pin:S.pin, p_sector:sector, p_entry_date:date, p_shift_type:shiftType, p_worker_id:sh.workerId, p_shadow_of:sh.hostId});
    if(sh.cs || sh.ce) await apiRpc("rpc_assignment_set_hours", {p_pin:S.pin, p_sector:sector, p_entry_date:date, p_shift_type:shiftType, p_worker_id:sh.workerId, p_custom_start:sh.cs||null, p_custom_end:sh.ce||null});
  }
}

/* העובד שכבר משובץ בתא שנלחץ (אם יש) - איתו נעשית "חפיפה" */
function tmplCellHost(c){

/* כמו assignAtPosition, אך למוקד: העריכה מתבצעת בתוך תת-הרשימה של התפקיד (c.role) בלבד, בלי לגעת
   בעובדים מהתפקיד השני שכבר משובצים לאותה משמרת. השורה האחרונה של התפקיד (אם יש חפיפה - שני עובדים
   באותה שורה) מתאפסת לעובד יחיד (או מתרוקנת) בעריכה ידנית - זה הגיוני כי עריכה ידנית של תא היא בחירה
   מפורשת, וחפיפה נוצרת מחדש דרך "שעות מותאמות" בדיוק כמו בתחילה. */
async function assignRoleAtPosition(sector, date, shiftType, role, ridx, workerId, customStart, customEnd){
  // עובד שתפקידו שונה מהשורה (אחמ"ש בשורת מוקדן) נשמר עם filled_role = תפקיד השורה, כדי שיוצג וייספר
  // שם ולא "יקפוץ" לשורת האחמ"ש. לבקשת סרגיי (2026-10-07).
  const ui = S.ui;
  const team = teamById(ui.teamId);
  const group = sectorGroupForTeam(team);
  const secData = buildTemplateData(group, [date], S.quotas).find(s=>s.sector===sector);
  const bucket = secData ? secData.buckets.find(b=> b.perDate[date] && b.perDate[date].shift_type===shiftType) : null;
  const roleRowsCount = (bucket && bucket.roleMax[role]) || 1;

  const workersById = ui.allWorkersById && Object.keys(ui.allWorkersById).length ? ui.allWorkersById : (()=>{ const m={}; ui.workers.forEach(w=>m[w.id]=w); return m; })();
  const assignmentsByDate = {};
  (ui.assignments||[]).forEach(a=>{ (assignmentsByDate[a.entry_date] = assignmentsByDate[a.entry_date]||[]).push(a); });
  const fullList = tmplAssignedList(assignmentsByDate, date, sector, shiftType).map(a=>a.worker_id);
  // רשימת התפקיד = בדיוק מה שמוצג בשורה (כולל אחמ"ש שממלא תקן מוקדן ביום שאין בו תקן אחמ"ש - ראו
  // tmplRoleAssignedListWithOverride). קודם נלקחו רק עובדים שהתפקיד שלהם הוא בדיוק התפקיד של השורה, ולכן
  // אי אפשר היה להוריד אחמ"ש כזה מהמשבצת ("חוסר/נקה" לא עשה כלום). תוקן 2026-10-07 (דוד קורן, 14/10 לילה).
  const qDay = bucket ? bucket.perDate[date] : null;
  let roleIds = tmplRoleAssignedListWithOverride(assignmentsByDate, date, sector, shiftType, role, workersById, qDay ? qDay.role_counts : null).map(a=>a.worker_id);
  const otherRoleIds = fullList.filter(id=>!roleIds.includes(id) && id!==workerId);
  if(workerId) roleIds = roleIds.filter(id=>id!==workerId);

  if(ridx>=roleRowsCount){
    // השורה האחרונה של התפקיד - עריכה ידנית מאפסת אותה לעובד יחיד (או ריקה), גם אם הייתה בה חפיפה
    roleIds = roleIds.slice(0, ridx-1);
    if(workerId) roleIds.push(workerId);
  } else if(!workerId){
    roleIds.splice(ridx-1, 1);
  } else if(ridx-1 < roleIds.length){
    roleIds.splice(ridx-1, 1, workerId);
  } else {
    roleIds.push(workerId);
  }
  const list = otherRoleIds.concat(roleIds);
  const pickedW = workerId ? workersById[workerId] : null;
  const setRole = workerId ? {workerId, role: (pickedW && pickedW.role===role) ? null : role} : null;
  try{
    await setAssignmentListPreservingHours(sector, date, shiftType, list, "manual", workerId, customStart, customEnd, setRole?{setRole}:{});
    ui.tmplCell = null; ui.tmplPickedWorker=null; ui.tmplHoursMode=null; ui.tmplCustomStart=null; ui.tmplCustomEnd=null; ui.tmplCellMsg = null; ui.tmplShowOtherSectors=false; ui.tmplRoleOverride=null;
    ui.loaded = false;
    await loadAggregateData(team);
  }catch(e){
    ui.tmplCellMsg = "שגיאה בשמירה: " + e.message; render();
  }
}

/* משבץ אחמ"ש כ"מילוי" לתקן מוקדן בשיבוץ ידני - כיוון אחד בלבד, ראו ההערה ליד roleOverrideOptions
   ב-renderMokedCellOverlay. בניגוד ל-assignRoleAtPosition, לא מנסים למקם את העובד בתוך תת-הרשימה
   של תפקיד "מוקדן" (הוא לא מוקדן בפועל) - פשוט מוסיפים אותו לרשימת השיבוץ הכוללת של המשבצת, בדיוק
   כמו שה-fallback הקיים עושה בשיבוץ האוטומטי (runAutoAssign). בתצוגה הוא יופיע תחת השורה של
   התפקיד האמיתי שלו (אחמ"ש) - זה הגיוני כי התפקיד מוצג לפי w.role בפועל, לא לפי "איזה תקן מילא". */

/* שיבוץ עם שעות מותאמות שעשוי לחצות בין "בלוקי משמרת": תמיד לכל היותר 2 בלוקים/שורות (גם אם הטווח
   נוגע ביותר מ-2 בלוקים בפועל) - הבלוק המוקדם ביותר שנחצה ("מוביל") והבלוק שאחריו ("עוגן"), ראו
   tmplHoursTxt2 להסבר התצוגה. לבקשת סרגיי (2026-10-04) - עד אז היה כאן סף של חפיפה מעל 3 שעות ומספר
   בלוקים לא מוגבל. */
async function confirmTmplCustomHours(){
  const ui = S.ui;
  const c = ui.tmplCell;
  const workerId = ui.tmplPickedWorker;
  const cs = document.getElementById("tmplCustomStart").value;
  const ce = document.getElementById("tmplCustomEnd").value;
  if(!cs || !ce){ ui.tmplCellMsg = "יש להזין שעת התחלה וסיום"; return render(); }
  const team = teamById(ui.teamId);
  const group = sectorGroupForTeam(team);
  const hits = tmplCustomRangeBuckets(group, c.date, c.sector, cs, ce).slice(0,2);
  if(!hits.length){ ui.tmplCellMsg = "הטווח לא חופף אף משמרת מוגדרת ביום זה"; return render(); }

  try{
    for(const hit of hits){
      const shiftType = hit.quota.shift_type;
      const assignmentsByDate = {};
      (ui.assignments||[]).forEach(a=>{ (assignmentsByDate[a.entry_date] = assignmentsByDate[a.entry_date]||[]).push(a); });
      const list = tmplAssignedList(assignmentsByDate, c.date, c.sector, shiftType).map(a=>a.worker_id).filter(id=>id!==workerId);
      const pos = (shiftType===c.type) ? c.pos : (list.length+1);
      if(pos-1 < list.length) list.splice(pos-1,1,workerId); else list.push(workerId);
      await setAssignmentListPreservingHours(c.sector, c.date, shiftType, list, "manual", workerId, cs, ce);
      // מרעננים את ui.assignments אחרי כל בלוק כדי שהחישוב הבא (אם יש בלוק נוסף) יראה את המצב העדכני
      ui.assignments = await apiGet("shift_assignments", `select=*&sector=eq.${c.sector}&entry_date=eq.${c.date}&order=created_at.asc`).catch(()=>ui.assignments);
    }
    ui.tmplCell = null; ui.tmplPickedWorker=null; ui.tmplHoursMode=null; ui.tmplCustomStart=null; ui.tmplCustomEnd=null; ui.tmplCellMsg = null; ui.tmplShowOtherSectors=false;
    ui.loaded = false;
    await loadAggregateData(team);
  }catch(e){
    ui.tmplCellMsg = "שגיאה בשמירה: " + e.message; render();
  }
}

/* כמו confirmTmplCustomHours, אך למוקד: בכל בלוק (לכל היותר 2 - ראו confirmTmplCustomHours), העובד
   מצטרף/מתמקם בתוך תת-הרשימה של התפקיד שלו בלבד (לא נוגע בתפקיד השני). בבלוק שבו נלחץ התא במקור -
   נכנס בדיוק לעמדה (ridx) שנבחרה, ובבלוק הסמוך - מצטרף כ"חפיפה" לסוף רשימת התפקיד שלו שם (בדיוק כמו
   "קארינה19\\סרגיי19" בטופס). */
async function confirmMokedCustomHours(){
  const ui = S.ui;
  const c = ui.tmplCell;
  const workerId = ui.tmplPickedWorker;
  const cs = document.getElementById("tmplCustomStart").value;
  const ce = document.getElementById("tmplCustomEnd").value;
  if(!cs || !ce){ ui.tmplCellMsg = "יש להזין שעת התחלה וסיום"; return render(); }
  const team = teamById(ui.teamId);
  const group = sectorGroupForTeam(team);
  const workersById = ui.allWorkersById && Object.keys(ui.allWorkersById).length ? ui.allWorkersById : (()=>{ const m={}; ui.workers.forEach(w=>m[w.id]=w); return m; })();
  const role = workersById[workerId] ? workersById[workerId].role : c.role;
  const hits = tmplCustomRangeBuckets(group, c.date, c.sector, cs, ce).slice(0,2);
  if(!hits.length){ ui.tmplCellMsg = "הטווח לא חופף אף משמרת מוגדרת ביום זה"; return render(); }

  try{
    for(const hit of hits){
      const shiftType = hit.quota.shift_type;
      const assignmentsByDate = {};
      (ui.assignments||[]).forEach(a=>{ (assignmentsByDate[a.entry_date] = assignmentsByDate[a.entry_date]||[]).push(a); });
      const fullList = tmplAssignedList(assignmentsByDate, c.date, c.sector, shiftType).map(a=>a.worker_id);
      const slotRowsHere = tmplAssignedList(assignmentsByDate, c.date, c.sector, shiftType);
      const effRoleOf = id=>{ const a = slotRowsHere.find(x=>x.worker_id===id); return a ? assignmentRole(a, workersById) : (workersById[id]||{}).role; };
      const otherRoleIds = fullList.filter(id=> id!==workerId && effRoleOf(id)!==role);
      let roleIds = fullList.filter(id=> id!==workerId && effRoleOf(id)===role);
      if(shiftType===c.type){
        const roleRowsCount = hit.bucket.roleMax[role]||1;
        if(c.ridx>=roleRowsCount) roleIds = roleIds.slice(0, c.ridx-1);
        else if(c.ridx-1 < roleIds.length) roleIds.splice(c.ridx-1, 1);
        roleIds.splice(Math.min(c.ridx-1, roleIds.length), 0, workerId);
      } else {
        roleIds.push(workerId); // בבלוק הסמוך - מצטרף כחפיפה לסוף רשימת התפקיד
      }
      const list = otherRoleIds.concat(roleIds);
      await setAssignmentListPreservingHours(c.sector, c.date, shiftType, list, "manual", workerId, cs, ce);
      ui.assignments = await apiGet("shift_assignments", `select=*&sector=eq.${c.sector}&entry_date=eq.${c.date}&order=created_at.asc`).catch(()=>ui.assignments);
    }
    ui.tmplCell = null; ui.tmplPickedWorker=null; ui.tmplHoursMode=null; ui.tmplCustomStart=null; ui.tmplCustomEnd=null; ui.tmplCellMsg = null; ui.tmplShowOtherSectors=false;
    ui.loaded = false;
    await loadAggregateData(team);
  }catch(e){
    ui.tmplCellMsg = "שגיאה בשמירה: " + e.message; render();
  }
}

/* --------- שיבוץ אוטומטי --------- */
async function runAutoAssign(){
  const ui = S.ui;
  const team = teamById(ui.teamId);
  const group = sectorGroupForTeam(team);
  const dates = periodDates(ui.periodStart, team);
  const slots = buildSlots(dates, group, S.quotas);
  const workers = ui.workers;

  // מונה הוגנות יחסית (לבקשת סרגיי, 2026-09-28): לא ממיינים לפי מספר משבצות גולמי שכבר שובצו,
  // אלא לפי היחס בין מה ששובץ למה שהעובד הגיש/סימן כזמין לכל התקופה (availCount) - כך שמי שהגיש
  // הרבה זמינות ושובץ יחסית מעט מקבל עדיפות על פני מי שהגיש מעט וכבר "מוצה". availCount נספר פעם
  // אחת מראש, בלי הדרתי-כפילות (מעביר assignmentsByDate ריק ל-availableForSlot) - כי זה אמור לשקף
  // את מה שהעובד הציע, לא את מה שעדיין פנוי לו אחרי ששובץ למקום אחר.
  const availCount = {}; workers.forEach(w=>availCount[w.id]=0);
  slots.forEach(slot=>{
    availableForSlot(slot, workers, ui.entriesByWorker, {}, null).forEach(w=>{ availCount[w.id]++; });
  });

  const assignCount = {}; workers.forEach(w=>assignCount[w.id]=0);
  const assignmentsByDate = {};
  (ui.assignments||[]).forEach(a=>{
    (assignmentsByDate[a.entry_date] = assignmentsByDate[a.entry_date]||[]).push(a);
    assignCount[a.worker_id] = (assignCount[a.worker_id]||0) + 1;
  });
  // כמה משמרות המשבץ רוצה לתת לעובד בשבוע (roster_workers.target_shifts, "ניהול עובדים") - 2026-10-20.
  // השיבוץ האוטומטי לא עובר את המספר הזה; שיבוץ ידני יכול לעבור אותו.
  const weekOf = d => Math.max(0, Math.floor(dates.indexOf(d)/7));
  const tgtCount = {};
  (ui.assignments||[]).forEach(a=>{ if(a.shadow_of) return; const k = a.worker_id+"|"+weekOf(a.entry_date); tgtCount[k] = (tgtCount[k]||0) + 1; });
  const underTarget = (w, d)=> w.target_shifts==null || (tgtCount[w.id+"|"+weekOf(d)]||0) < w.target_shifts;
  const fairnessRatio = w => availCount[w.id]>0 ? (assignCount[w.id]/availCount[w.id]) : Infinity;
  const byFairness = (a,b)=> (fairnessRatio(a)-fairnessRatio(b)) || (assignCount[a.id]-assignCount[b.id]) || a.name.localeCompare(b.name,"he");
  // מוקד (2026-10-20): עובד שזמין רק לחלק מהמשמרת (שעות מותאמות = "כן יכול") משתתף בהוגנות הרגילה אם את
  // השעות החסרות בתחילת המשמרת יכול להשלים עובד שכבר שובץ במשמרת הקודמת (למשל עובד הבוקר נשאר עד 16:00).
  // אחרת (אין מי שישלים, או שחסרות שעות בסוף המשמרת) - הוא נבחר רק אחרי כל מי שזמין לכל המשמרת.
  const partialRecs = [];
  const roleOfW = id=>{ const x = workers.find(y=>y.id===id); return x && x.role; };
  function gapCoverableNow(w, slot){
    const ph = mokedPartialHours(w, slot, ui.entriesByWorker); if(!ph) return true;
    const [bs, be] = rangeMin(slot.start, slot.end); let [cs, ce] = rangeMin(ph[0], ph[1]); if(cs < bs){ cs += 1440; ce += 1440; }
    if(ce < be) return false;
    const prevD = fmtDate(addDays(parseDate(slot.date), -1));
    const prevSlots = slots.filter(x=>x.sector===slot.sector && x!==slot && (x.date===slot.date || x.date===prevD)).filter(x=>{ const [, xe] = rangeMin(x.start, x.end); return xe + (x.date===slot.date?0:-1440) === bs; });
    const gapS = fmtMinutes(bs%1440), gapE = fmtMinutes(cs%1440);
    return prevSlots.some(x=>(assignmentsByDate[x.date]||[]).some(a=>{
      if(a.sector!==x.sector || a.shift_type!==x.shiftType || a.shadow_of || a.worker_id===w.id || a.custom_end) return false;
      const ro = a.filled_role || roleOfW(a.worker_id); if(!(ro===w.role || (w.role==="מוקדן" && ro==='אחמ"ש'))) return false;
      const ow = workers.find(y=>y.id===a.worker_id); if(!ow) return false;
      if(!availableForSlot(slot, [ow], ui.entriesByWorker, {}, null, true, true).length) return false;
      const wins = mokedWindows(ow, slot.date, ui.entriesByWorker);
      if(wins){ const f = windowFit(wins, gapS, gapE); if(!f || !f.full) return false; }
      return true;
    }));
  }
  const fullFirst = slot => (a,b)=> ((gapCoverableNow(a, slot)?0:1) - (gapCoverableNow(b, slot)?0:1)) || byFairness(a,b);

  // מניעת ברירת-מחדל של שיבוץ עם פחות מ-8 שעות מנוחה (לבקשת סרגיי, 2026-09-28) - ראו הערה מפורטת
  // ליד wouldViolateRest/buildWorkerIntervals למעלה. נבנה מ-ui.allAssignments (כל הגזרות) כדי לתפוס
  // גם משמרת קודמת של אותו עובד בגזרה אחרת (למשל עובד "מושאל" דרך "הצג זמינים מגזרות אחרות").
  const workerIntervals = buildWorkerIntervals(ui.allAssignments || ui.assignments || []);
  // מפצלת רשימת מועמדים ל"נקיים" (≥8 שעות מנוחה) ו"פוגעים במנוחה" (<8 שעות) - האחרונים משמשים
  // רק כעדיפות אחרונה, כשאין ברירה אחרת למלא את המשבצת.
  function splitByRest(candidates, slot){
    const newInterval = shiftInterval({sector:slot.sector, shift_type:slot.shiftType, entry_date:slot.date, custom_start:null, custom_end:null});
    const ok = [], bad = [];
    candidates.forEach(w=>{
      if(newInterval && wouldViolateRest(w.id, newInterval, workerIntervals)) bad.push(w); else ok.push(w);
    });
    return {ok, bad, newInterval};
  }
  function recordChosenInterval(workerId, newInterval){
    if(!newInterval) return;
    (workerIntervals[workerId] = workerIntervals[workerId]||[]).push(newInterval);
  }
  // 7 ימים ברצף / שבת רביעית ברצף (2026-10-11): מודרים לגמרי מהשיבוץ האוטומטי - ראו streakIssues למעלה
  const streakIdx = buildStreakIndex(ui.streakAssignments || ui.allAssignments || ui.assignments || []);
  const streakCut = new Set(); let streakShort = 0;
  function streakFilter(list, slot){
    const out = list.filter(w=>!streakIssues(streakIdx, w.id, slot.date, slot.shiftType).length);
    if(out.length < list.length) streakCut.add(slot);
    return out;
  }

  /* עדיפות ערים אצל "מאיר אזרואל" (לבקשת סרגיי, 2026-10-08): לכל עובד רשימת ערים לפי סדר עדיפות
     (roster_workers.city_sectors, ראו computeWorkerCities). משבצות של אותו תאריך ואותו סוג משמרת בכל
     הערים משובצות יחד, בסבבים: קודם מי שרשום לעיר אחת בלבד (בעיר שלו), אחר כך כל אחד בעיר הראשונה
     ברשימה שלו, אחר כך בשנייה וכן הלאה - כך שעובד "בית שמש/ירושלים" ישובץ בבית שמש אם יש שם מקום,
     ורק אם אין - בירושלים. בכל סבב - לפי ההוגנות הרגילה (byFairness), ומי שפוגע במנוחה רק בסוף. */
  function cityRank(w, sector){
    const c = w.cities!==undefined ? w.cities : computeWorkerCities(w);
    if(!c || !c.length) return 99;
    if(c.length===1) return c[0]===sector ? 0 : 99;
    const i = c.indexOf(sector);
    return i<0 ? 99 : i+1;
  }
  const units = []; const unitByKey = new Map();
  slots.forEach(slot=>{
    if(POOLED_CITY_SECTORS.includes(slot.sector) && !slot.roleCounts){
      const k = slot.date+"|"+slot.shiftType;
      if(unitByKey.has(k)){ unitByKey.get(k).push(slot); return; }
      const u = [slot]; unitByKey.set(k, u); units.push(u);
    } else units.push([slot]);
  });
  const plannedBySlot = new Map(); // slot -> {chosen, newInterval}
  function planPooledUnit(unit){
    const st = unit.map(slot=>{
      const alreadyAll = (assignmentsByDate[slot.date]||[]).filter(a=>a.sector===slot.sector && a.shift_type===slot.shiftType);
      const need = slot.required - alreadyAll.filter(a=>!a.shadow_of).length;
      const avail = streakFilter(availableForSlot(slot, workers, ui.entriesByWorker, assignmentsByDate, slotKey(slot.sector,slot.shiftType)).filter(w=>!w.auto_assign_exempt && underTarget(w, slot.date)), slot);
      const {ok, bad, newInterval} = splitByRest(avail, slot);
      return {slot, need, ok, bad, newInterval, chosen:[]};
    });
    const taken = new Set();
    const ranks = Array.from(new Set(st.flatMap(x=>x.ok.concat(x.bad).map(w=>cityRank(w, x.slot.sector))))).sort((a,b)=>a-b);
    ["ok","bad"].forEach(phase=>{
      ranks.forEach(r=>{
        st.forEach(x=>{
          const room = x.need - x.chosen.length;
          if(room<=0) return;
          const picks = x[phase].filter(w=>!taken.has(w.id) && cityRank(w, x.slot.sector)===r).slice().sort(byFairness).slice(0, room);
          picks.forEach(w=>{ taken.add(w.id); x.chosen.push(w); });
          if(phase==="bad") restForced += picks.length;
        });
      });
    });
    st.forEach(x=>plannedBySlot.set(x.slot, {chosen:x.chosen, newInterval:x.newInterval}));
  }

  /* מוקד במוצ"ש (2026-10-18, לבקשת סרגיי):
     - האחמ"ש של המוצ"ש צריך להתחיל ב-20:00. עדיפות לאחמ"ש שלא שומר שבת וזמין גם ל"ערב מוצ"ש" (20:00-23:00) -
       הוא משובץ לשתי המשבצות (20:00-07:00 ברצף).
     - אם אין אחמ"ש כזה: אחמ"ש שומר שבת משובץ למוצ"ש משעה 23:00 (שעות מותאמות 23:00-07:00),
       ואת "ערב מוצ"ש" 20:00-23:00 מקבל סרגיי (גם שהוא מוחרג משיבוץ אוטומטי - זה הכלל שביקש).
     - מוקדן במוצ"ש עובד תמיד 23:00-07:00 - בין 20:00 ל-23:00 אין מוקדן כברירת מחדל (סרגיי, 2026-10-18),
       ולכן כל מוקדן שמשובץ למוצ"ש (גם אחמ"ש שממלא תקן מוקדן) מקבל שעות 23:00-07:00, בלי עדיפות לפי שמירת שבת.
     התכנון נעשה מראש לכל שבת, ולפיו ממלאים את שתי המשבצות בלולאה הראשית. */
  const SAT_LATE = ["23:00","07:00"];
  const sergeyW = workers.find(w=>w.name==="סרגיי");
  const mokedSat = new Map();
  let satSergey = 0, satLateAch = 0, satEveShort = 0;
  const restSorted = (list, slot)=>{ const r = splitByRest(list, slot); return r.ok.slice().sort(byFairness).concat(r.bad.slice().sort(byFairness)); };
  dates.filter(d=>dayTypeForDate(d)==="saturday").forEach(d=>{
    const eve = slots.find(x=>x.sector==="מוקד" && x.date===d && x.shiftType==="evening");
    const mot = slots.find(x=>x.sector==="מוקד" && x.date===d && x.shiftType==="motzash");
    if(!mot) return;
    const plan = {evening:null, achmash:null, lateIds:new Set()};
    const existing = t=>(assignmentsByDate[d]||[]).filter(a=>a.sector==="מוקד" && a.shift_type===t && !a.shadow_of);
    const roleOf = a=>{ const w = workers.find(x=>x.id===a.worker_id); return a.filled_role || (w && w.role); };
    const eveNeed = eve ? eve.required - existing("evening").length : 0;
    const motAch = existing("motzash").filter(a=>roleOf(a)==='אחמ"ש');
    const motAchNeed = ((mot.roleCounts||{})['אחמ"ש']||0) - motAch.length;
    const avMot = streakFilter(availableForSlot(mot, workers, ui.entriesByWorker, assignmentsByDate, slotKey(mot.sector, mot.shiftType)).filter(w=>w.role==='אחמ"ש' && !w.auto_assign_exempt && underTarget(w, mot.date)), mot);
    const avEve = eve ? availableForSlot(eve, workers, ui.entriesByWorker, assignmentsByDate, slotKey(eve.sector, eve.shiftType)) : [];
    const eveFallback = ()=>{
      if(sergeyW && avEve.some(x=>x.id===sergeyW.id)){ satSergey++; return sergeyW; }
      return restSorted(avEve.filter(w=>!w.auto_assign_exempt && w.id!==(plan.achmash&&plan.achmash.id)), eve)[0] || null;
    };
    if(motAchNeed>0){
      const full = restSorted(avMot.filter(w=>!w.shabbat_observer && avEve.some(x=>x.id===w.id) && !mokedPartialHours(w, mot, ui.entriesByWorker) && !(eve && mokedPartialHours(w, eve, ui.entriesByWorker))), mot);
      if(full.length){ plan.achmash = full[0]; if(eveNeed>0) plan.evening = full[0]; }
      else {
        plan.achmash = restSorted(avMot, mot)[0] || null;
        if(plan.achmash){ plan.lateIds.add(plan.achmash.id); satLateAch++; }
        if(eveNeed>0) plan.evening = eveFallback();
      }
    } else if(eveNeed>0){
      const m = motAch[0], mw = m && workers.find(x=>x.id===m.worker_id);
      const startsAt20 = mw && !mw.shabbat_observer && !(m.custom_start && String(m.custom_start).slice(0,5)!=="20:00");
      plan.evening = (startsAt20 && avEve.some(x=>x.id===mw.id)) ? mw : eveFallback();
    }
    if(eveNeed>0 && !plan.evening) satEveShort++;
    mokedSat.set(d, plan);
  });

  ui.buildMsg = "מבצע שיבוץ אוטומטי...";
  let filled=0, short=0, restForced=0;
  for(const unit of units){
  if(unit.length>1 || (POOLED_CITY_SECTORS.includes(unit[0].sector) && !unit[0].roleCounts)) planPooledUnit(unit);
  for(const slot of unit){
    const alreadyAll = (assignmentsByDate[slot.date]||[]).filter(a=>a.sector===slot.sector && a.shift_type===slot.shiftType);
    let fallbackFillers = [];
    const already = alreadyAll.filter(a=>!a.shadow_of); // חפיפות לא נספרות כמילוי תקן
    const need = slot.required - already.length;
    if(need<=0) continue;
    // עובד עם auto_assign_exempt=true (למשל סרגיי, לבקשתו 2026-10-06: "אל תשבץ אותי בשיבוצים אוטומטי")
    // מודר כאן בלבד - מהמועמדים לשיבוץ אוטומטי. הוא עדיין מוצג כזמין/לא-זמין רגיל בכל מסך אחר
    // (כולל בורר השיבוץ הידני, ששם אפשר עדיין לבחור בו ידנית בכוונה).
    const avail = streakFilter(availableForSlot(slot, workers, ui.entriesByWorker, assignmentsByDate, slotKey(slot.sector,slot.shiftType)).filter(w=>!w.auto_assign_exempt && underTarget(w, slot.date)), slot);
    let chosen = [];
    const planned = plannedBySlot.get(slot);
    const {ok: restOk, bad: restBad, newInterval} = planned ? {ok:[], bad:[], newInterval:planned.newInterval} : splitByRest(avail, slot);
    // מוקד במוצ"ש - ראו mokedSat למעלה. customFor: עובד -> שעות מותאמות (23:00-07:00 לשומרי שבת)
    const satPlan = (slot.sector==="מוקד" && dayTypeForDate(slot.date)==="saturday") ? mokedSat.get(slot.date) : null;
    const customFor = {};
    const satMotzash = !!(satPlan && slot.shiftType==="motzash");
    // במוצ"ש: המוקדן (וגם אחמ"ש שממלא תקן מוקדן) עובד 23:00-07:00
    const obsLast = (okL, badL)=> okL.concat(badL);
    if(satPlan && slot.shiftType==="evening"){
      chosen = satPlan.evening ? [satPlan.evening].slice(0, need) : [];
    } else if(planned){
      chosen = planned.chosen.slice(0, need);
    } else if(slot.roleCounts){
      // משבצת עם דרישת תפקידים (כמו במוקד: אחמ"ש/מוקדן) - ממלאים כל תפקיד בנפרד, לפי מה שכבר משובץ מאותו תפקיד.
      // סדר עיבוד התפקידים קבוע לפי MOKED_ROLE_ORDER (אחמ"ש לפני מוקדן) - לבקשת סרגיי (2026-10-05):
      // 1) אחמ"שים ממלאים קודם את תקני האחמ"ש שלהם, 2) מוקדנים ממלאים את תקני המוקדן, 3) אם נשאר חוסר
      // בתקן מוקדן אחרי שמוצו כל המוקדנים הזמינים (כולל פוגעי-מנוחה) - אחמ"שים שפתחו זמינות למשבצת הזו
      // (גם אם המשבצת לא דורשת מהם תפקיד אחמ"ש בעצמה) אך לא שובצו בה (לא נדרשו/לא נשארו בתקן האחמ"ש
      // שלהם) יכולים למלא את החוסר, כעדיפות אחרונה לפני "חוסר" מלא. אין כיוון הפוך (מוקדן לא ממלא תקן
      // אחמ"ש). גם כאן שומרים על החלוקה ההוגנת (byFairness, אותו מנגנון כמו שאר השיבוץ) כך שכיסוי מוקדן
      // ע"י אחמ"ש יתחלק הוגן בין האחמ"שים הפנויים, ולא יפול תמיד על אותו אדם.
      const alreadyByRole = {};
      already.forEach(a=>{ const w=workers.find(x=>x.id===a.worker_id); const r = a.filled_role || (w&&w.role); if(r) alreadyByRole[r]=(alreadyByRole[r]||0)+1; });
      const roleKeysOrdered = MOKED_ROLE_ORDER.filter(r=>slot.roleCounts[r]!=null)
        .concat(Object.keys(slot.roleCounts).filter(r=>!MOKED_ROLE_ORDER.includes(r)));
      let availAnyRole = null;
      fallbackFillers = []; // availableForSlot בלי סינון תפקיד - מחושב לכל היותר פעם אחת לכל משבצת, רק אם צריך fallback
      roleKeysOrdered.forEach(role=>{
        const needRole = slot.roleCounts[role] - (alreadyByRole[role]||0);
        if(needRole<=0) return;
        if(satMotzash && role==='אחמ"ש'){
          const p = satPlan.achmash ? [satPlan.achmash] : [];
          p.forEach(w=>{ if(satPlan.lateIds.has(w.id)) customFor[w.id] = SAT_LATE; });
          chosen = chosen.concat(p.slice(0, needRole));
          return;
        }
        const okRole = restOk.filter(w=>w.role===role && !chosen.some(c=>c.id===w.id)).slice().sort(fullFirst(slot));
        let pickedRole = okRole.slice(0, needRole);
        if(satMotzash){
          const badRoleS = restBad.filter(w=>w.role===role && !chosen.some(c=>c.id===w.id)).slice().sort(fullFirst(slot));
          const order = obsLast(okRole, badRoleS);
          pickedRole = order.slice(0, needRole);
          restForced += pickedRole.filter(w=>badRoleS.includes(w)).length;
          pickedRole.forEach(w=>{ customFor[w.id] = SAT_LATE; });
        }
        if(pickedRole.length < needRole && !satMotzash){
          const badRole = restBad.filter(w=>w.role===role && !chosen.some(c=>c.id===w.id)).slice().sort(fullFirst(slot));
          const more = badRole.slice(0, needRole - pickedRole.length);
          restForced += more.length;
          pickedRole = pickedRole.concat(more);
        }
        if(pickedRole.length < needRole && role==="מוקדן"){
          // fallback: אחמ"שים זמינים (ללא סינון תפקיד) למשבצת זו, שלא נבחרו כבר לתקן האחמ"ש שלה
          if(availAnyRole===null){
            availAnyRole = streakFilter(availableForSlot(slot, workers, ui.entriesByWorker, assignmentsByDate, slotKey(slot.sector,slot.shiftType), true).filter(w=>!w.auto_assign_exempt && underTarget(w, slot.date)), slot);
          }
          const fallbackPool = availAnyRole.filter(w=>w.role==='אחמ"ש' && !chosen.some(c=>c.id===w.id) && !pickedRole.some(c=>c.id===w.id));
          const {ok: fbOk, bad: fbBad} = splitByRest(fallbackPool, slot);
          const stillNeed = needRole - pickedRole.length;
          let pickedFallback = fbOk.slice().sort(fullFirst(slot)).slice(0, stillNeed);
          if(satMotzash){
            pickedFallback = obsLast(fbOk.slice().sort(fullFirst(slot)), fbBad.slice().sort(fullFirst(slot))).slice(0, stillNeed);
            restForced += pickedFallback.filter(w=>fbBad.includes(w)).length;
            pickedFallback.forEach(w=>{ customFor[w.id] = SAT_LATE; });
          }
          if(pickedFallback.length < stillNeed && !satMotzash){
            const fbMore = fbBad.slice().sort(fullFirst(slot)).slice(0, stillNeed - pickedFallback.length);
            restForced += fbMore.length;
            pickedFallback = pickedFallback.concat(fbMore);
          }
          pickedRole = pickedRole.concat(pickedFallback);
          pickedFallback.forEach(w=>fallbackFillers.push(w.id)); // יסומנו filled_role="מוקדן" אחרי השמירה
        }
        chosen = chosen.concat(pickedRole);
      });
    } else {
      chosen = restOk.slice().sort(byFairness).slice(0, need);
      if(chosen.length < need){
        const more = restBad.slice().sort(byFairness).slice(0, need - chosen.length);
        restForced += more.length;
        chosen = chosen.concat(more);
      }
    }
    // מוקד: עובד שזמין רק לחלק מהמשמרת - משובץ בשעות החפיפה בלבד; את השעות החסרות משלים fillPartialGaps
    chosen = chosen.filter(w=>{
      if(!workerIsMoked(w, slot.sector)) return true;
      const wins = mokedWindows(w, slot.date, ui.entriesByWorker); if(!wins) return true;
      const base = customFor[w.id] || [slot.start, slot.end];
      const f = windowFit(wins, base[0], base[1]);
      if(!f || (!f.full && f.minutes < MOKED_MIN_PARTIAL)) return false; // השעות שנקבעו לו (למשל 23:00-07:00 במוצ"ש) מחוץ לשעות שהוא יכול
      if(!f.full){ customFor[w.id] = [f.start, f.end]; partialRecs.push({sector:slot.sector, date:slot.date, shiftType:slot.shiftType, workerId:w.id, cs:f.start, ce:f.end, baseStart:String(base[0]).slice(0,5), baseEnd:String(base[1]).slice(0,5)}); }
      return true;
    });
    if(chosen.length < need){ short++; if(streakCut.has(slot)) streakShort++; }
    if(chosen.length===0) continue;
    const fullList = alreadyAll.map(a=>a.worker_id).concat(chosen.map(w=>w.id));
    try{
      await apiRpc("rpc_assignment_set", {p_pin:S.pin, p_sector:slot.sector, p_entry_date:slot.date, p_shift_type:slot.shiftType, p_worker_ids: fullList, p_method:"auto"});
      // rpc_assignment_set מוחק ומכניס מחדש את כל שורות המשבצת - משחזרים חפיפות ושעות מותאמות של שיבוצים קיימים
      for(const a of alreadyAll.filter(x=>x.id)){
        if(a.shadow_of) await apiRpc("rpc_assignment_set_shadow", {p_pin:S.pin, p_sector:slot.sector, p_entry_date:slot.date, p_shift_type:slot.shiftType, p_worker_id:a.worker_id, p_shadow_of:a.shadow_of});
        if(a.custom_start || a.custom_end) await apiRpc("rpc_assignment_set_hours", {p_pin:S.pin, p_sector:slot.sector, p_entry_date:slot.date, p_shift_type:slot.shiftType, p_worker_id:a.worker_id, p_custom_start:a.custom_start, p_custom_end:a.custom_end});
        if(a.filled_role) await apiRpc("rpc_assignment_set_role", {p_pin:S.pin, p_sector:slot.sector, p_entry_date:slot.date, p_shift_type:slot.shiftType, p_worker_id:a.worker_id, p_role:a.filled_role});
      }
      for(const wid of fallbackFillers){
        await apiRpc("rpc_assignment_set_role", {p_pin:S.pin, p_sector:slot.sector, p_entry_date:slot.date, p_shift_type:slot.shiftType, p_worker_id:wid, p_role:"מוקדן"});
      }
      for(const wid of Object.keys(customFor)){
        if(!chosen.some(c=>c.id===wid)) continue;
        await apiRpc("rpc_assignment_set_hours", {p_pin:S.pin, p_sector:slot.sector, p_entry_date:slot.date, p_shift_type:slot.shiftType, p_worker_id:wid, p_custom_start:customFor[wid][0], p_custom_end:customFor[wid][1]});
      }
      filled++;
      chosen.forEach(w=>{ assignCount[w.id]++; tgtCount[w.id+"|"+weekOf(slot.date)] = (tgtCount[w.id+"|"+weekOf(slot.date)]||0) + 1; recordChosenInterval(w.id, customFor[w.id] ? shiftInterval({sector:slot.sector, shift_type:slot.shiftType, entry_date:slot.date, custom_start:customFor[w.id][0], custom_end:customFor[w.id][1]}) : newInterval); streakAdd(streakIdx, w.id, slot.date, slot.shiftType); (assignmentsByDate[slot.date]=assignmentsByDate[slot.date]||[]).push({sector:slot.sector, shift_type:slot.shiftType, worker_id:w.id, entry_date:slot.date}); });
    }catch(e){ ui.buildMsg = "שגיאה בשמירת שיבוץ: " + e.message; render(); return; }
  }
  }
  ui.buildMsg = `השיבוץ האוטומטי הושלם: עודכנו ${filled} משבצות.${short?` שימו לב — ב-${short} משבצות אין מספיק עובדים זמינים כדי למלא את כל התקן (יופיעו כ"חוסר").`:""}${restForced?` שימו לב — ב-${restForced} שיבוצים לא נמצא עובד עם 8 שעות מנוחה, ושובץ עובד עם פחות (כעדיפות אחרונה, מסומן באדום בטבלה).`:""}${streakShort?` ב-${streakShort} משבצות נשאר חוסר כי העובדים הזמינים היו מגיעים ל-7 ימי עבודה ברצף או לשבת רביעית ברצף — אפשר לשבץ ידנית (תוצג אזהרה).`:""}${satLateAch?` מוצ"ש במוקד: ב-${satLateAch} שבתות לא היה אחמ"ש זמין מ-20:00 — שובץ אחמ"ש שומר שבת מ-23:00${satSergey?`, וסרגיי ל-20:00-23:00 (${satSergey})`:""}.`:""}${satEveShort?` ב-${satEveShort} שבתות לא נמצא מי שיכסה אחמ"ש 20:00-23:00.`:""}`;
  ui.loaded = false; // רענון מלא של נתוני השיבוצים
  await loadAggregateData(team);
  if(partialRecs.length){
    const g = await fillPartialGaps(partialRecs, slots, workers);
    const msg = ` שעות מותאמות במוקד: ${partialRecs.length} עובדים שובצו רק לשעות שהם יכולים${g.extended?`, ו-${g.extended} עובדים במשמרות הסמוכות הוארכו כדי לכסות את השעות החסרות`:""}.${g.uncovered.length?` לא נמצא מי שיכסה: ${g.uncovered.join(" · ")} — אפשר להשלים ידנית.`:""}`;
    if(g.extended){ ui.loaded = false; await loadAggregateData(team); }
    ui.buildMsg = (ui.buildMsg||"") + msg;
    render();
  }
}

/* מוקד (2026-10-20): אחרי שיבוץ אוטומטי - לכל עובד ששובץ רק לחלק מהמשמרת (שעות מותאמות = "כן יכול"),
   השעות החסרות נלקחות מעובד המשמרת הסמוכה: לפני (למשל עובד הבוקר נשאר עד 16:00) או אחרי (עובד הלילה
   מתחיל מוקדם). התנאים: אותו תפקיד (או אחמ"ש שמכסה מוקדן), העובד יכול לעבוד גם במשמרת הזו (לא חסם
   אותה, ואם הגיש שעות מותאמות - הן מכסות את השעות החסרות), וסך המשמרת שלו לא עובר 12 שעות. */
async function fillPartialGaps(partialRecs, slots, workers){
  const ui = S.ui; let extended = 0; const uncovered = [];
  const roleOf = a=>{ const w = workers.find(x=>x.id===a.worker_id); return a.filled_role || (w && w.role); };
  const prevDay = d=>fmtDate(addDays(parseDate(d), -1)), nextDay = d=>fmtDate(addDays(parseDate(d), 1));
  const touched = new Set();
  for(const r of partialRecs){
    const slot = slots.find(x=>x.sector===r.sector && x.date===r.date && x.shiftType===r.shiftType);
    if(!slot) continue;
    const mine = (ui.assignments||[]).find(a=>a.sector===r.sector && a.entry_date===r.date && a.shift_type===r.shiftType && a.worker_id===r.workerId && !a.shadow_of);
    const myRole = mine ? roleOf(mine) : ((workers.find(x=>x.id===r.workerId)||{}).role);
    const [bs, be] = rangeMin(r.baseStart, r.baseEnd);
    let [cs, ce] = rangeMin(r.cs, r.ce); if(cs < bs){ cs += 1440; ce += 1440; }
    const gaps = [];
    if(cs > bs) gaps.push({dir:"before", s:bs, e:cs});
    if(ce < be) gaps.push({dir:"after", s:ce, e:be});
    for(const gp of gaps){
      // משמרות סמוכות: נגמרת בדיוק בתחילת הפער (לפני) / מתחילה בדיוק בסוף הפער (אחרי). זמנים ביחס לחצות של r.date
      const neigh = slots.filter(x=>x.sector===r.sector && x!==slot && (x.date===r.date || x.date===prevDay(r.date) || x.date===nextDay(r.date))).filter(x=>{
        const off = x.date===r.date ? 0 : (x.date===prevDay(r.date) ? -1440 : 1440);
        const [xs, xe] = rangeMin(x.start, x.end);
        return gp.dir==="before" ? xe+off===bs : xs+off===be;
      });
      let done = false;
      for(const x of neigh){
        const off = x.date===r.date ? 0 : (x.date===prevDay(r.date) ? -1440 : 1440);
        const cands = (ui.assignments||[]).filter(a=>a.sector===x.sector && a.entry_date===x.date && a.shift_type===x.shiftType && !a.shadow_of && a.worker_id!==r.workerId && !touched.has(a.id))
          .filter(a=>{ const ro = roleOf(a); return ro===myRole || (myRole==="מוקדן" && ro==='אחמ"ש'); })
          .sort((a,b)=> (roleOf(a)===myRole?0:1) - (roleOf(b)===myRole?0:1));
        for(const a of cands){
          const w = workers.find(y=>y.id===a.worker_id); if(!w) continue;
          let [as, ae] = rangeMin(a.custom_start||x.start, a.custom_end||x.end); as += off; ae += off;
          if(gp.dir==="before" ? ae!==gp.s : as!==gp.e) continue; // כבר לא מסתיים/מתחיל בגבול (שעות מותאמות אחרות)
          if(!availableForSlot(slot, [w], ui.entriesByWorker, {}, null, true, true).length) continue;
          const wins = mokedWindows(w, r.date, ui.entriesByWorker);
          if(wins){ const f = windowFit(wins, fmtMinutes(((gp.s%1440)+1440)%1440), fmtMinutes(((gp.e%1440)+1440)%1440)); if(!f || !f.full) continue; }
          const ns = gp.dir==="before" ? as : gp.s, ne = gp.dir==="before" ? gp.e : ae;
          if(ne - ns > 12*60) continue;
          const t = m=>fmtMinutes(((m - off)%1440 + 1440)%1440);
          try{
            await apiRpc("rpc_assignment_set_hours", {p_pin:S.pin, p_sector:x.sector, p_entry_date:x.date, p_shift_type:x.shiftType, p_worker_id:a.worker_id, p_custom_start:t(ns), p_custom_end:t(ne)});
            touched.add(a.id); extended++; done = true;
          }catch(e){}
          break;
        }
        if(done) break;
      }
      if(!done) uncovered.push(`${fmtDateHeb(r.date)} ${SHIFT_LABELS[r.shiftType]||r.shiftType} ${fmtMinutes(((gp.s%1440)+1440)%1440)}-${fmtMinutes(((gp.e%1440)+1440)%1440)}`);
    }
  }
  return {extended, uncovered};
}

/* ============== ייצוא (הדבקה לאקסל) ============== */
function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(()=>fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}
function exportPivot(){
  const ui = S.ui; const team = teamById(ui.teamId);
  const dates = periodDates(ui.periodStart, team);
  const lines = [["עובד",...dates.map(fmtDateHeb)].join("\t")];
  ui.workers.forEach(w=>{
    const cells = dates.map(d=>{
      const es = (ui.entriesByWorker[w.id]||{})[d];
      if(!es||!es.length) return "-";
      return es.map(e=> e.shift_type==="custom" ? (workerIsMoked(w,"")?`יכול רק ${e.custom_start}-${e.custom_end}`:`${e.custom_start}-${e.custom_end}`) : SHIFT_LABELS[e.shift_type]).join(", ");
    });
    lines.push([w.name, ...cells].join("\t"));
  });
  copyToClipboard(lines.join("\n"));
  ui.buildMsg = "הטבלה הועתקה — ניתן להדביק באקסל.";
  render();
}
function exportAssignments(){
  const ui = S.ui; const team = teamById(ui.teamId);
  const group = sectorGroupForTeam(team);
  const dates = periodDates(ui.periodStart, team);

  if(group.citySectors[0]!=="מוקד"){
    const assignmentsByDate = {};
    (ui.assignments||[]).forEach(a=>{ (assignmentsByDate[a.entry_date] = assignmentsByDate[a.entry_date]||[]).push(a); });
    const sectors = buildTemplateData(group, dates, S.quotas);
    const lines = [];
    sectors.forEach(secData=>{
      if(!secData.buckets.length) return;
      lines.push([secData.sector].join("\t"));
      secData.buckets.forEach(bucket=>{
        lines.push([bucket.label].join("\t"));
        lines.push(["", ...dates.map(fmtDateHeb)].join("\t"));
        for(let pos=1; pos<=bucket.maxReq; pos++){
          const cells = dates.map(d=>{
            const q = bucket.perDate[d];
            if(!q || pos>q.required_count) return "";
            const list = tmplAssignedList(assignmentsByDate, d, secData.sector, q.shift_type);
            const a = list[pos-1];
            const w = a ? ui.workers.find(x=>x.id===a.worker_id) : null;
            const hoursTxt = a ? tmplHoursTxt2(group, d, secData.sector, q, a, assignmentsByDate) : `${tmplHourNum(q.start_time)}-${tmplHourNum(q.end_time)}`;
            const shTxt = tmplShadowText(tmplCellShadows(assignmentsByDate, d, secData.sector, q.shift_type, a?[a.worker_id]:[], pos===1), q, id=>{ const x=ui.workers.find(y=>y.id===id)||(ui.allWorkersById||{})[id]; return x?x.name:"?"; });
            return (w? `${w.name} ${hoursTxt}` : "חוסר") + shTxt;
          });
          lines.push([`סייר ${pos}`, ...cells].join("\t"));
        }
      });
      lines.push("");
    });
    copyToClipboard(lines.join("\n"));
    ui.manualMsg = "הסידור הועתק בפורמט התבנית — ניתן להדביק באקסל.";
    render();
    return;
  }

  // ייצוא בפורמט התבנית של המוקד - שורות לפי תפקיד (אחמ"ש/מוקדן), כמו בטופס הרשמי
  const assignmentsByDate = {};
  (ui.assignments||[]).forEach(a=>{ (assignmentsByDate[a.entry_date] = assignmentsByDate[a.entry_date]||[]).push(a); });
  const workersById = {}; ui.workers.forEach(w=>workersById[w.id]=w);
  const sectors = buildTemplateData(group, dates, S.quotas);
  const lines = [];
  sectors.forEach(secData=>{
    if(!secData.buckets.length) return;
    lines.push([secData.sector].join("\t"));
    secData.buckets.forEach(bucket=>{
      if(!bucket.roles.length) return;
      lines.push([bucket.label].join("\t"));
      lines.push(["", ...dates.map(fmtDateHeb)].join("\t"));
      bucket.roles.forEach(role=>{
        const roleRowsCount = bucket.roleMax[role]||1;
        for(let ridx=1; ridx<=roleRowsCount; ridx++){
          const cells = dates.map(d=>{
            const q = bucket.perDate[d];
            const roleReq = q && q.role_counts ? (q.role_counts[role]||0) : 0;
            if(!q || ridx>roleReq) return "";
            const candidates = tmplRoleAssignedListWithOverride(assignmentsByDate, d, secData.sector, q.shift_type, role, workersById, q.role_counts);
            const picked = pickedForRoleCell(candidates, ridx, roleRowsCount);
            const firstRole = bucket.roles.find(r=> q.role_counts && (q.role_counts[r]||0)>0);
            const shTxt = tmplShadowText(tmplCellShadows(assignmentsByDate, d, secData.sector, q.shift_type, picked.map(a=>a.worker_id), role===firstRole && ridx===1), q, id=>{ const x=workersById[id]||(ui.allWorkersById||{})[id]; return x?x.name:"?"; });
            if(!picked.length) return "חוסר" + shTxt;
            return picked.map(a=>{ const w=workersById[a.worker_id]; return `${w?w.name:"?"} ${tmplHoursTxt2(group,d,secData.sector,q,a,assignmentsByDate)}`; }).join(" \\ ") + shTxt;
          });
          lines.push([`${role}${roleRowsCount>1?` ${ridx}`:""}`, ...cells].join("\t"));
        }
      });
    });
    lines.push("");
  });
  copyToClipboard(lines.join("\n"));
  ui.manualMsg = "הסידור הועתק בפורמט התבנית — ניתן להדביק באקסל.";
  render();
}

      <p class="muted">"ללא העדפה" בכולן = זמין לכל הערים. אם נבחרו רק חלק מהעדיפויות (למשל ראשונה ושנייה), העובד ישובץ רק בערים שנבחרו, לפי הסדר. בעדכון עובד קיים בלי לבחור ערים - הסדר הקיים שלו נשמר; לשינוי הסדר יש כפתור "✏️ שינוי" בטבלה.</p>

    ${ui.adminMsg? `<p>${escapeHtml(ui.adminMsg)}</p>`:""}

async function loadAdminWorkers(){
  const ui = S.ui;
  try{
    const codeTeamId = adminCodeTeamId(ui.teamIds);
    const [workerLists, teamCode, teamLock] = await Promise.all([
      // admin_list_workers לא מחזיר team_id (מסונן כבר לפי הצוות שנשאל) - מתייגים כאן בצד הלקוח
      // כדי שתצוגת "גזרה" בטבלה הממוזגת תדע לאיזה צוות בסיס כל עובד שייך.
      Promise.all(ui.teamIds.map(tid=>apiRpc("admin_list_workers", {p_pin:S.pin, p_team_id: tid}).then(rows=>rows.map(w=>({...w, team_id:tid}))))),
      apiRpc("admin_get_team_code", {p_pin:S.pin, p_team_id: codeTeamId}),
      apiRpc("admin_get_team_lock_status", {p_pin:S.pin, p_team_id: codeTeamId})
    ]);
    ui.workers = workerLists.flat().sort((a,b)=>a.name.localeCompare(b.name,"he"));
    // סימון "חפיפה" נטען ישירות מהטבלה (admin_list_workers לא מחזירה אותו) - 2026-10-07
    try{
      const flags = await apiGet("roster_workers", `select=id,shadow_trainee,shabbat_observer,target_shifts&team_id=in.(${ui.teamIds.join(",")})`);
      const fm = {}; flags.forEach(r=>fm[r.id]=r);
      ui.workers.forEach(w=>{ w.shadow_trainee = !!(fm[w.id]&&fm[w.id].shadow_trainee); w.shabbat_observer = !!(fm[w.id]&&fm[w.id].shabbat_observer); w.target_shifts = fm[w.id] ? fm[w.id].target_shifts : null; });
    }catch(e){ ui.workers.forEach(w=>{ w.shadow_trainee = !!w.shadow_trainee; w.shabbat_observer = !!w.shabbat_observer; }); }
    ui.teamCode = teamCode;
    ui.codeTeamId = codeTeamId;
    ui.teamCodeLockedUntil = teamLock;
  }
  catch(e){ ui.workers = []; ui.adminMsg = "שגיאה: "+e.message; }
  render();
}
// נעילות (קוד אישי/קוד קב"ט) - 30 דקות אוטומטית אחרי 3 ניסיונות שגויים; כאן רק תצוגה+פתיחה ידנית
function isLockActive(lockedUntil){
  return !!lockedUntil && new Date(lockedUntil) > new Date();
}
function lockMinutesLeft(lockedUntil){
  return Math.max(1, Math.ceil((new Date(lockedUntil) - new Date())/60000));
}

/* ============== EVENT HANDLING ============== */
function attachHandlers(){
  const app = document.getElementById("app");
  app.onclick = onAppClick;
  app.onchange = e=>{ const act = e.target && e.target.dataset ? String(e.target.dataset.action||"") : ""; if(window.Portal && act.startsWith("portal-")) return window.Portal.onChange(App, e); return onAppChange(e); };
  app.oninput = e=>{ if(window.Portal) window.Portal.onInput(App, e); };
  app.onkeydown = e=>{ if(window.Portal) window.Portal.onKey(App, e); };
  ["dragover","dragleave","drop"].forEach(t=>app.addEventListener(t, e=>{ if(window.Portal && window.Portal.onDrag) window.Portal.onDrag(App, e); }));
  document.getElementById("headerActions").onclick = onAppClick;
}

function onAppChange(e){
  const t = e.target;
  if(t.dataset.action==="city-pref") return syncCityPrefs(t.dataset.prefix);
  if(t.dataset.action==="manual-check") return; // נקרא בזמן שמירה
  if(t.dataset.action==="admin-role-select"){
    const id = t.dataset.id, role = t.value || null;
    const ui = S.ui;
    (async()=>{
      try{ await apiRpc("admin_update_worker_role",{p_pin:S.pin,p_worker_id:id,p_role:role}); ui.adminMsg="התפקיד עודכן."; ui.workers=null; render(); }
      catch(err){ ui.adminMsg="שגיאה: "+err.message; render(); }
    })();
  }
  // "לא לשבץ אוטומטית" - לבקשת סרגיי (2026-10-06): תיבת סימון לכל עובד, נשמרת מיידית; רק מדירה
  // משיבוץ אוטומטי (runAutoAssign) - לא משפיעה על זמינות/שיבוץ ידני.
  // "חפיפה" - עובד בהכשרה שאפשר לשבץ באותה קוביה עם עובד שכבר משובץ (2026-10-07)
  // "שומר שבת" - לא מוצג/משובץ בשישי ערב, שישי לילה ושבת ערב (2026-10-07)
  if(t.dataset.action==="admin-toggle-shabbat"){
    const id = t.dataset.id, val = t.checked;
    const ui = S.ui;
    (async()=>{
      try{ await apiRpc("admin_update_worker_shabbat_observer",{p_pin:S.pin,p_worker_id:id,p_value:val}); ui.adminMsg="עודכן."; ui.workers=null; render(); }
      catch(err){ ui.adminMsg="שגיאה: "+err.message; render(); }
    })();
  }
  if(t.dataset.action==="admin-toggle-shadow"){
    const id = t.dataset.id, val = t.checked;
    const ui = S.ui;
    (async()=>{
      try{ await apiRpc("admin_update_worker_shadow_trainee",{p_pin:S.pin,p_worker_id:id,p_value:val}); ui.adminMsg="עודכן."; ui.workers=null; render(); }
      catch(err){ ui.adminMsg="שגיאה: "+err.message; render(); }
    })();
  }
  if(t.dataset.action==="admin-target-shifts"){
    const id = t.dataset.id, raw = String(t.value||"").trim();
    const val = raw==="" ? null : Math.max(0, Math.min(14, parseInt(raw,10)||0));
    const ui = S.ui;
    (async()=>{
      try{ await apiRpc("admin_update_worker_target_shifts",{p_pin:S.pin,p_worker_id:id,p_target:val}); ui.adminMsg = val==null ? "עודכן: ללא הגבלה." : `עודכן: ${val} משמרות בשבוע.`; const w = (ui.workers||[]).find(x=>x.id===id); if(w) w.target_shifts = val; render(); }
      catch(err){ ui.adminMsg="שגיאה: "+err.message; render(); }
    })();
  }
  if(t.dataset.action==="admin-toggle-auto-exempt"){
    const id = t.dataset.id, exempt = t.checked;
    const ui = S.ui;
    (async()=>{
      try{ await apiRpc("admin_update_worker_auto_assign_exempt",{p_pin:S.pin,p_worker_id:id,p_exempt:exempt}); ui.adminMsg="עודכן."; ui.workers=null; render(); }
      catch(err){ ui.adminMsg="שגיאה: "+err.message; render(); }
    })();
  }
}

function onAppClick(e){
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const a = el.dataset.action;
  const ui = S.ui;

  if(a==="go-home") return goHome();
  if(a.startsWith("portal-") && window.Portal){
    if(a==="portal-managers") S.managerMode = true;
    return window.Portal.onClick(App, a, el);
  }
  if(a==="go-mgrpw" && window.Portal){ window.Portal.resetPasswordsScreen(); S.view="mgrpw"; S.ui={}; return render(); }
  if(a==="mgrview-back"){ S.view = "home"; S.ui = {}; return render(); }
  if(a==="mgrview-original"){ ui.showOriginal = true; return render(); }
  if(a==="mgrview-current"){ ui.showOriginal = false; return render(); }
  if(a==="mgrview-prev" || a==="mgrview-next"){
    const t = teamById(ui.teamId);
    ui.periodStart = fmtDate(addDays(parseDate(ui.periodStart), (a==="mgrview-next"?1:-1) * periodLength(t)));
    ui.loaded = false; ui.origAssignments = undefined; ui.showOriginal = false; return render();
  }
  if(a==="managers-back"){ S.managerMode = false; S.view="home"; S.ui={}; return render(); }
  if(a==="go-submit"){ S.view="submit"; S.ui={}; return render(); }
  if(a==="go-aggregate"){ S.view="aggregate"; S.ui={}; return render(); }
  if(a==="go-admin"){ S.view="admin"; S.ui={}; return render(); }

  // ---- identify ----
  if(a==="do-identify"){
    const workerIdSel = document.getElementById("idName").value;
    const code = document.getElementById("idCode").value;
    ui.idNameValue = workerIdSel; ui.idCodeValue = code;
    if(!workerIdSel || !code){ ui.identifyError = "יש לבחור שם ולהזין קוד"; return render(); }
    const row = (ui.workers||[]).find(w=>w.id===workerIdSel);
    if(!row){ ui.identifyError = "שגיאה: העובד לא נמצא"; return render(); }
    return (async()=>{
      try{
        const workerId = await apiRpc("verify_worker_code", {p_team_id: row.team_id, p_name:row.name, p_code:code});
        if(!workerId){ ui.identifyError = "שם או קוד שגויים"; return render(); }
        S.ui = {step:"recipient", pendingIdentity:{workerId, name:row.name}};
        render();
      }catch(err){ ui.identifyError = "שגיאה: "+err.message; render(); }
    })();
  }
  if(a==="pick-recipient"){
    const pend = ui.pendingIdentity;
    if(!pend) return render();
    S.identity = {teamId: el.dataset.id, workerId: pend.workerId, name: pend.name, recipientLabel: el.dataset.label};
    saveJSON("cst_identity", S.identity);
    S.ui = {step:"period"};
    return render();
  }
  if(a==="reset-identity"){ S.identity=null; localStorage.removeItem("cst_identity"); S.ui={step:"identify"}; return render(); }

  // ---- submit period ----
  if(a==="period-prev" || a==="period-next"){
    const team = teamById(S.identity.teamId);
    ui.periodStart = shiftPeriod(ui.periodStart, team, a==="period-prev"?-1:1);
    ui.entries = null; return render();
  }
  if(a==="toggle-shift"){
    const d = el.dataset.date, ty = el.dataset.type;
    ui.entries[d] = ui.entries[d] || {types:[], customOn:false, customStart:"07:00", customEnd:"15:00", dayStatus:null};
    ui.entries[d].dayStatus = null;
    const arr = ui.entries[d].types;
    const i = arr.indexOf(ty);
    if(i>=0) arr.splice(i,1); else arr.push(ty);
    return render();
  }
  if(a==="toggle-custom"){
    const d = el.dataset.date;
    ui.entries[d] = ui.entries[d] || {types:[], customOn:false, customStart:"07:00", customEnd:"15:00", dayStatus:null};
    ui.entries[d].dayStatus = null;
    ui.entries[d].customOn = !ui.entries[d].customOn;
    return render();
  }
  if(a==="toggle-daystatus"){
    const d = el.dataset.date, ty = el.dataset.type;
    ui.entries[d] = ui.entries[d] || {types:[], customOn:false, customStart:"07:00", customEnd:"15:00", dayStatus:null};
    const cur = ui.entries[d];
    cur.dayStatus = (cur.dayStatus===ty) ? null : ty;
    if(cur.dayStatus){ cur.types = []; cur.customOn = false; }
    return render();
  }
  if(a==="save-submission") return saveSubmission();

  // ---- aggregate ----
  if(a==="agg-pick-team"){ ui.teamId = el.dataset.id; ui.loaded=false; return render(); }
  if(a==="agg-back"){ if(isSessionPin() && !(S.ui.mgrPick && S.ui.teamId)) return goHome(); S.ui = S.ui.mgrPick ? {mgrPick:true} : {}; return render(); }
  if(a==="agg-team-code-submit"){
    const code = document.getElementById("aggTeamCode").value;
    ui.teamCodeValue = code;
    if(!code){ ui.teamCodeError = "יש להזין קוד"; return render(); }
    return (async()=>{
      try{
        const ok = await apiRpc("verify_team_code", {p_team_id: ui.teamId, p_code: code});
        if(!ok){ ui.teamCodeError = "קוד שגוי"; return render(); }
        S.teamAccess[ui.teamId] = true;
        saveJSON("cst_team_access", S.teamAccess);
        ui.teamCodeError = null; ui.teamCodeValue = null;
        render();
      }catch(err){ ui.teamCodeError = "שגיאה: "+err.message; render(); }
    })();
  }
  if(a==="agg-period-prev" || a==="agg-period-next"){
    const team = teamById(ui.teamId);
    ui.periodStart = shiftPeriod(ui.periodStart, team, a==="agg-period-prev"?-1:1);
    ui.loaded = false; return render();
  }
  if(a==="agg-export") return exportPivot();
  if(a==="agg-export-assign") return exportAssignments();
  if(a==="open-print"){ ui.printOpen = true; return render(); }
  if(a==="close-print"){ ui.printOpen = false; return render(); }
  if(a==="do-print"){ window.print(); return; }
  if(a==="toggle-monthly"){
    ui.monthlyOpen = !ui.monthlyOpen;
    if(ui.monthlyOpen && !ui.monthlyValue){
      const now = new Date();
      ui.monthlyValue = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
    }
    return render();
  }
  if(a==="run-monthly") return runMonthlyReport();
  if(a==="open-pin"){ ui.pinPromptFor = el.dataset.next; ui.pinPromptWorkerId = el.dataset.worker||null; ui.pinPromptPeriod = el.dataset.period||null; ui.pinError=null; if(isSessionPin()) return confirmPin(); return render(); }
  if(a==="overlay-bg" || a==="cancel-pin"){ ui.pinPromptFor=null; return render(); }
  if(a==="confirm-pin") return confirmPin();

  // ---- תבנית שיבוץ: לחיצה על משבצת בודדת (data-role/data-ridx קיימים רק במוקד - שיבוץ לפי תפקיד) ----
  if(a==="tmpl-cell"){
    ui.tmplCell = {sector:el.dataset.sector, date:el.dataset.date, type:el.dataset.type, pos:Number(el.dataset.pos)||null, role:el.dataset.role||null, ridx:el.dataset.ridx?Number(el.dataset.ridx):null};
    ui.tmplCellMsg = null;
    ui.tmplShowOtherSectors = false;
    ui.tmplRoleOverride = null;
    return render();
  }
  if(a==="tmpl-cell-bg" || a==="tmpl-cell-close"){
    ui.tmplCell=null; ui.tmplPickedWorker=null; ui.tmplHoursMode=null; ui.tmplCustomStart=null; ui.tmplCustomEnd=null; ui.tmplCellMsg=null;
    ui.tmplAddWorkerOpen=false; ui.tmplAddWorkerMsg=null; ui.tmplShowOtherSectors=false; ui.tmplRoleOverride=null;
    return render();
  }
  if(a==="agg-reload"){ ui.loaded = false; ui.loadError = null; return render(); }
  if(a==="agg-publish-force"){ ui.pubConfirm = null; return setSchedulePublished(true, true); }
  if(a==="agg-publish-cancel"){ ui.pubConfirm = null; return render(); }
  if(a==="agg-avail-toggle"){ ui.showAvailByDay = !ui.showAvailByDay; return render(); }
  if(a==="tmpl-other-sectors-toggle"){ ui.tmplShowOtherSectors = !ui.tmplShowOtherSectors; return render(); }
  if(a==="tmpl-add-worker-toggle"){ ui.tmplAddWorkerOpen = !ui.tmplAddWorkerOpen; ui.tmplAddWorkerMsg=null; return render(); }
  if(a==="tmpl-add-worker-cancel"){ ui.tmplAddWorkerOpen = false; ui.tmplAddWorkerMsg=null; return render(); }
  if(a==="tmpl-add-worker-save"){
    const name = document.getElementById("tmplNewWorkerName").value;
    const code = document.getElementById("tmplNewWorkerCode").value;
    if(!name || !code){ ui.tmplAddWorkerMsg = "יש למלא שם וקוד"; return render(); }
    const sector = el.dataset.sector;
    const role = el.dataset.role || null;
    const team = teamById(ui.teamId);
    const group = sectorGroupForTeam(team);
    let targetTeamId, citySectors = null;
    if(group.teamIds.length>1){
      // "מאיר אזרואל": קובעים צוות בסיס (דניאל כתב/אביחי קדוש) לפי העיר של המשבצת שממנה נפתח הטופס
      if(sector==="ירושלים"){
        const jTeam = S.teams.find(t=>(t.sectors||[]).includes("ירושלים"));
        targetTeamId = jTeam ? jTeam.id : group.teamIds[0];
      } else {
        const svTeam = S.teams.find(t=>(t.sectors||[]).includes("סובב ירושלים"));
        targetTeamId = svTeam ? svTeam.id : group.teamIds[0];
      }
      const pr = readCityPrefs("tmplNewCity");
      if(pr.error){ ui.tmplAddWorkerMsg = pr.error; return render(); }
      citySectors = pr.cities;
    } else {
      targetTeamId = group.teamIds[0];
    }
    return (async()=>{
      try{
        await apiRpc("admin_upsert_worker", {p_pin:S.pin, p_team_id:targetTeamId, p_name:name, p_code:code, p_role:role, p_city_sectors:citySectors});
        ui.tmplAddWorkerOpen = false; ui.tmplAddWorkerMsg = null;
        await loadAggregateData(team);
      }catch(err){ ui.tmplAddWorkerMsg = "שגיאה: "+err.message; render(); }
    })();
  }
  if(a==="tmpl-pick"){
    const c = ui.tmplCell; if(!c) return;
    const workerId = el.dataset.worker||null;
    if(!workerId){ // חוסר/נקה - מיידי
      return c.role ? assignRoleAtPosition(c.sector, c.date, c.type, c.role, c.ridx, null) : assignAtPosition(c.sector, c.date, c.type, c.pos, null);
    }
    ui.tmplPickedWorker = workerId; ui.tmplHoursMode = null; ui.tmplCellMsg = null; ui.tmplRoleOverride = null; ui.tmplCustomStart = null; ui.tmplCustomEnd = null;

  // אחמ"ש שנבחר למלא תקן מוקדן (שיבוץ ידני) - ראו assignRoleOverrideWorker. שלב 1: בוחרים עובד,
  // ואז (כמו בכל בחירה אחרת) ממשיכים לבחירת שעות סטנדרטיות/מותאמות.
