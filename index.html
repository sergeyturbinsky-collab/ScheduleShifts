function computeWindowState(team, periodStart){
  const base = addDays(parseDate(periodStart), -7); // יום ראשון של השבוע שלפני התקופה
  const now = new Date();
  let openInstant = -Infinity, closeInstant = Infinity, opensAt=null, closesAt=null, closedSince=null;
  if(team.open_weekday!=null && team.open_time){
    const d = addDays(base, team.open_weekday);
    const [h,m] = team.open_time.split(":").map(Number);
    d.setHours(h,m,0,0); openInstant = d.getTime();
    opensAt = `יום ${HEB_DOW[team.open_weekday]} ${team.open_time}`;
  }
  if(team.close_weekday!=null && team.close_time){
    const d = addDays(base, team.close_weekday);
    const [h,m] = team.close_time.split(":").map(Number);
    d.setHours(h,m,0,0); closeInstant = d.getTime();
    closesAt = `יום ${HEB_DOW[team.close_weekday]} ${team.close_time}`;
    closedSince = closesAt;
  }
  const t = now.getTime();
  if(t < openInstant) return {state:"notyet", opensAt};
  if(t > closeInstant) return {state:"closed", closedSince};
  return {state:"open", closeAt: closesAt};
}

async function loadMySubmission(team){
  const ui = S.ui;
  try{
    const exc = await apiGet("constraint_exceptions", `select=id&worker_id=eq.${S.identity.workerId}&period_start=eq.${ui.periodStart}`);
    ui.hasException = exc && exc.length>0;
    const subs = await apiGet("constraint_submissions", `select=id,note&worker_id=eq.${S.identity.workerId}&period_start=eq.${ui.periodStart}`);
    ui.entries = {};
    ui.note = "";
    if(subs && subs[0]){
      ui.note = subs[0].note || "";
      const rows = await apiGet("constraint_entries", `select=entry_date,shift_type,custom_start,custom_end&submission_id=eq.${subs[0].id}`);
      rows.forEach(r=>{
        const e = ui.entries[r.entry_date] || {types:[], customOn:false, customStart:"07:00", customEnd:"15:00", dayStatus:null};
        if(r.shift_type==="custom"){ e.customOn=true; e.customStart=r.custom_start||"07:00"; e.customEnd=r.custom_end||"15:00"; }
        else if(DAY_STATUS_TYPES.includes(r.shift_type)){ e.dayStatus = r.shift_type; }
        else e.types.push(r.shift_type);
        ui.entries[r.entry_date] = e;
      });
    }
  }catch(e){ ui.entries = {}; ui.note=""; }
  render();
}

async function saveSubmission(){
  const ui = S.ui;
  const team = teamById(S.identity.teamId);
  const ws = computeWindowState(team, ui.periodStart);
  if(ws.state!=="open" && !ui.hasException){ ui.saveMsg = "הטופס נעול להגשה — לא ניתן לשמור."; ui.saveOk = false; return render(); }
  ui.saveMsg = null;
  // מאבטחים (לא מוקד): חובה להתייחס לכל יום בתקופה ולכתוב הערה (לבקשת סרגיי, 2026-10-20)
  if(!isMokedTeam(team)){
    const missing = periodDates(ui.periodStart, team).filter(d=>{ const e = ui.entries[d]; return !e || !(e.dayStatus || e.customOn || (e.types||[]).length); });
    const noteTxt = (document.getElementById("submitNote")||{}).value || "";
    if(missing.length){ ui.saveOk = false; ui.saveMsg = `צריך לסמן כל יום. חסר: ${missing.map(fmtDateHeb).join(", ")} — סמנו משמרות, או "לא יכול" / "אחר".`; ui.note = noteTxt; return render(); }
  }
  try{
    const sub = await apiUpsertSubmission({
      team_id: team.id, worker_id: S.identity.workerId, worker_name: S.identity.name,
      period_start: ui.periodStart, note: document.getElementById("submitNote").value || null,
      updated_at: new Date().toISOString()
    });
    await apiDelete("constraint_entries", `submission_id=eq.${sub.id}`);
    const rows = [];
    Object.keys(ui.entries).forEach(date=>{
      const e = ui.entries[date];
      // הערה: כל האובייקטים במערך rows חייבים לשתף בדיוק את אותן מפתחות (כולל כשהערך null) -
      // PostgREST דורש בהכנסה מרובה (POST עם מערך JSON) שכל האובייקטים יהיו הומוגניים במבנה,
      // אחרת מוחזרת שגיאה PGRST102 ("All object keys must match"). זו הייתה תקלה אמיתית:
      // יום עם שעות מותאמות (5 מפתחות) לצד יום אחר עם משמרת רגילה/יום שלם (3 מפתחות בלבד) גרם לשגיאה.
      if(e.dayStatus){ rows.push({submission_id:sub.id, entry_date:date, shift_type:e.dayStatus, custom_start:null, custom_end:null}); return; }
      (e.types||[]).forEach(t=> rows.push({submission_id:sub.id, entry_date:date, shift_type:t, custom_start:null, custom_end:null}));
      if(e.customOn) rows.push({submission_id:sub.id, entry_date:date, shift_type:"custom", custom_start:e.customStart, custom_end:e.customEnd});
    });
    if(rows.length){
      const url = `${SUPABASE_URL}/rest/v1/constraint_entries`;
      const res = await fetch(url,{method:"POST",headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(rows)});
      if(!res.ok) throw new Error(await res.text());
    }
    ui.saveOk = true; ui.saveMsg = "האילוצים נשמרו בהצלחה.";
  }catch(e){
    ui.saveOk = false; ui.saveMsg = "שגיאה בשמירה: " + e.message;
  }
  render();
}

/* ================================================================
   מסך 2: טבלה מרוכזת + בניית סידור
   ================================================================ */
function renderAggregate(){
  const ui = S.ui;
  if(!ui.teamId){
    return `<div class="card">
      <span class="backlink" data-action="go-home">◀ חזרה</span>
      <h2>בחר/י גזרה</h2>
      <div class="grid-teams">
        ${pickerTiles().map(t=>`<div class="team-tile" data-action="agg-pick-team" data-id="${t.repId}">${escapeHtml(t.label)}</div>`).join("")}
      </div>
    </div>`;
  }
  const team = teamById(ui.teamId);
  if(!S.teamAccess[team.id] && isSessionPin()){
    return `<div class="card"><span class="backlink" data-action="agg-back">◀ חזרה</span><p class="muted">אין לך הרשאה לגזרה הזו.</p></div>`;
  }
  if(!S.teamAccess[team.id]){
    return `<div class="card">
      <span class="backlink" data-action="agg-back">◀ צוות אחר</span>
      <h2>קוד קב"ט — ${escapeHtml(team.name)}</h2>
      <p class="muted">הזן/י את קוד הקב"ט כדי לצפות במה שהוגש עבור הצוות שלך.</p>
      <div class="field"><label>קוד</label><input type="password" id="aggTeamCode" placeholder="קוד" value="${escapeHtml(ui.teamCodeValue||"")}"></div>
      <button class="btn" data-action="agg-team-code-submit">כניסה</button>
      ${ui.teamCodeError? `<p class="shortage">${escapeHtml(ui.teamCodeError)}</p>`:""}
    </div>`;
  }
  if(!ui.periodStart) ui.periodStart = currentPeriodStart(team);
  if(!ui.loaded){ loadAggregateData(team); return `<div class="card"><p>טוען...</p></div>`; }
  // (2026-10-20) אם הטעינה נכשלה - מציגים את השגיאה ולחצן "נסה שוב" במקום מסך ריק/"טוען..." לנצח.
  if(ui.loadError || !ui.workers) return `<div class="card"><span class="backlink" data-action="go-home">◀ חזרה</span><h3>הטעינה נכשלה</h3><p class="shortage">${escapeHtml(ui.loadError||"שגיאה לא ידועה")}</p><button class="btn" data-action="agg-reload">🔄 נסה שוב</button></div>`;

  if(ui.printOpen) return `<div class="card">${renderPrintView(team)}</div>`;

  if(ui.mode==="manual") return renderManualBuild(team);

  const group = sectorGroupForTeam(team);
  const dates = periodDates(ui.periodStart, team);

  const workers = ui.workers;

  const isMoked = group.citySectors[0]==="מוקד";
  let quotaSection = "";
  if(group.citySectors.length){
    if(isMoked){
      quotaSection = renderMokedTemplateGrid(group, dates, ui, "view");
    } else {
      quotaSection = renderTemplateGrid(group, dates, ui, "agg"); // "agg" = תצוגה כמו view, אבל שורות המשימות תמיד מוצגות
    }
  } else {
    quotaSection = `<p class="muted">אין נתוני התקנים למוקד — מסך זה מציג ריכוז אילוצים בלבד, ללא בניית סידור.</p>`;
  }

  // "מי זמין לכל יום" - מתחת ללוח המשמרות (שתופס עכשיו את כל הרוחב), לבקשת סרגיי (2026-10-07).
  // (2026-10-20, סרגיי) לא מוצג כברירת מחדל - רק בלחיצה על לחצן נפרד, אם המשבץ רוצה לראות.
  const availCard = group.citySectors.length ? `
      <div class="card">
        <div class="flexbar" style="justify-content:space-between;">
          <h3 style="margin:0;">מי זמין לכל יום</h3>
          <button class="btn small secondary" data-action="agg-avail-toggle">${ui.showAvailByDay?"▲ הסתר":"👥 הצג מי זמין לכל יום"}</button>
        </div>
        ${ui.showAvailByDay ? `<p class="muted" style="margin-top:8px;">כולל גם עובדים שכבר שובצו לאותו יום — מציג זמינות אמיתית, לא רק חוסרים.</p>
        ${renderAvailabilityByDay(dates, group, ui)}` : ""}
      </div>`:"";

  return `
  <div class="card">
    <span class="backlink" data-action="agg-back">${(isSessionPin() && !ui.mgrPick) ? "◀ חזרה" : "◀ בחירת צוות אחר"}</span>
    <h2>טבלה מרוכזת — ${escapeHtml(group.label)}</h2>
    ${renderSwapHistoryBox(group, dates)}
    ${streakWarningsHtml(group, dates)}
    ${group.pooledNote? `<div class="note-box">שים לב: כמה תת-גזרות/קב"טים חולקים כאן את אותה בריכת עובדים זמינים (אין הפרדה בהגשת האילוצים ברמת תת-הגזרה), כך שהזמינות מחושבת עבור כל תת-הגזרות/הצוותים יחד.</div>`:""}
    <div class="flexbar">
      <button class="btn small secondary" data-action="agg-period-prev">◀ תקופה קודמת</button>
      <b>תקופה: ${fmtDateHeb(ui.periodStart)} — ${fmtDateHeb(dates[dates.length-1])}</b>
      <button class="btn small secondary" data-action="agg-period-next">תקופה הבאה ▶</button>
    </div>
    ${renderMissingSubmissions(workers, ui.submittedWorkerIds, ui.exceptionWorkerIds, isMoked, ui.periodStart)}
  </div>
  <div class="card">
      <h3>${isMoked?"זמינות מול התקנים":"שיבוץ"}</h3>
      ${quotaSection}
      <div class="row" style="margin-top:12px;">
        <button class="btn ok" data-action="open-pin" data-next="auto">שיבוץ אוטומטי</button>
        <button class="btn" data-action="open-pin" data-next="manual">שיבוץ ידני</button>
        <button class="btn secondary" data-action="toggle-monthly">פילוח חודשי (הגישו מול שובצו)</button>
        ${group.citySectors.length ? (isSchedulePublished(group, ui)
          ? `<button class="btn ok" data-action="open-pin" data-next="publish">📢 פרסם שוב (עם השינויים)</button>
             <button class="btn secondary" data-action="open-pin" data-next="unpublish">בטל פרסום</button>`
          : `<button class="btn ok" data-action="open-pin" data-next="publish">📢 פרסם סידור לעובדים</button>`) : ""}
        <button class="btn secondary" data-action="open-print">🖨️ הפקת פלט סידור (הדפסה/PDF)</button>
      </div>
      ${group.citySectors.length ? `<p class="muted" style="margin-top:8px;">${isSchedulePublished(group, ui) ? "✅ הסידור לתקופה הזו פורסם — העובדים רואים אותו ב\"המשמרות שלי\"." : "📝 טיוטה — העובדים עדיין לא רואים את הסידור לתקופה הזו."}</p>` : ""}
      ${publishInfoHtml(group, ui)}
      ${ui.pubConfirm ? `<div class="note-box" style="margin-top:10px;border-color:#e0a800;">
        <b>${escapeHtml(ui.pubConfirm)} פרסם כבר סידור. האם אתה בטוח שאתה רוצה לפרסם?</b>
        <p class="muted" style="margin:6px 0;">הפרסום שלך יחליף את הפרסום הקודם — העובדים יראו את הסידור כפי שהוא עכשיו.</p>
        <div class="row"><button class="btn ok" data-action="agg-publish-force">כן, פרסם</button><button class="btn secondary" data-action="agg-publish-cancel">ביטול</button></div>
      </div>` : ""}
      ${ui.buildMsg? `<p style="margin-top:8px;">${escapeHtml(ui.buildMsg)}</p>`:""}
      ${renderMonthlyPanel(ui, isMoked)}
  </div>
  ${availCard}
  ${renderBottomTables(team, group, dates, ui)}`;
}

/* --------- פלט סידור להדפסה/PDF: גרסה נקייה של טבלת השיבוץ (כולל שורות "מראה" של חיפה אם רלוונטי),
   בלי כפתורי עריכה, עם כפתור הדפסה (window.print) שמשתמש בכללי @media print כדי להעלים הכל חוץ
   מ-#printArea. נגישה הן ממסך "טבלה מרוכזת" והן ממסך "שיבוץ ידני". לבקשת סרגיי (2026-10-05). --------- */
function renderPrintView(team){
  const ui = S.ui;
  const group = sectorGroupForTeam(team);
  const dates = periodDates(ui.periodStart, team);
  const isMoked = group.citySectors[0]==="מוקד";
  // מוקד (תקופה דו-שבועית) - כל שבוע מוצג בנפרד, וכל שבוע מתחיל בעמוד חדש בהדפסה. לבקשת סרגיי (2026-10-07)
  const weeks = (isMoked && dates.length>7) ? [dates.slice(0,7), dates.slice(7)] : [dates];
  const grid = !group.citySectors.length ? `<p class="muted">אין נתוני התקנים להצגה.</p>`
    : weeks.map((wk,i)=>{
        const g = isMoked ? renderMokedTemplateGrid(group, wk, ui, "view") : renderTemplateGrid(group, wk, ui, "view");
        if(weeks.length===1) return g;
        return `<div class="print-week"${i>0?' style="break-before:page;page-break-before:always;margin-top:18px;"':''}>
          <h3 style="margin:0 0 8px;">שבוע ${i+1}: ${fmtDateHeb(wk[0])} — ${fmtDateHeb(wk[wk.length-1])}</h3>${g}</div>`;
      }).join("");
  return `
  <div class="row no-print" style="margin-bottom:10px;">
    <button class="btn ok" data-action="do-print">🖨️ הדפס / שמור כ-PDF</button>
    ${S.view==="mgrview" ? "" : `<button class="btn secondary" data-action="close-print">סגור</button>`}
  </div>
  <div id="printArea">
    <div class="print-header">
      ${logoStripHtml(48)}
      <h2 style="margin:0 0 4px;">${escapeHtml(group.label)} — סידור עבודה</h2>
      <p style="margin:0 0 10px;">תקופה: ${fmtDateHeb(ui.periodStart)} — ${fmtDateHeb(dates[dates.length-1])}</p>
    </div>
    ${grid}
  </div>`;
}

/* --------- "מי זמין לכל יום" (בנפרד מ"שיבוץ") - רשימה מאוחדת ליום, כולל מי שכבר שובץ ---------
   מבוססת על אותה availableForSlot כמו טבלת "זמינים" ב-renderQuotaPanel, אבל מאוחדת בין כל
   סוגי המשמרות של אותו יום, כדי לתת תמונה נוחה "מי בסביבה היום" בלי צורך לפתוח את התבנית. */
/* לכל יום: לכל עובד - באילו משמרות (לא רק "זמין" באופן גורף) הוא זמין, לפי כל המשמרות שקיימות
   בפועל לאותו תאריך (בכל הגזרות של הקבוצה, כמו קודם - ללא שינוי בהיקף). אם הוא זמין בכל המשמרות
   שקיימות לאותו יום - נכתב "כל היום" במקום לפרט כל משמרת בנפרד. הכל בתוך אותה שורת-יום הקיימת
   (לא רשימה נפרדת בסוף). לבקשת סרגיי (2026-10-06). */
function renderAvailabilityByDay(dates, group, ui){
  const workers = ui.workers;
  const assignmentsByDate = {};
  (ui.assignments||[]).forEach(a=>{ (assignmentsByDate[a.entry_date] = assignmentsByDate[a.entry_date]||[]).push(a); });
  const slots = buildSlots(dates, group, S.quotas);
  const rows = dates.map(d=>{
    const daySlots = slots.filter(s=>s.date===d);
    const shiftTypesForDay = Array.from(new Set(daySlots.map(s=>s.shiftType)));
    const byWorker = new Map(); // worker.id -> {worker, types:Set}
    daySlots.forEach(slot=>{
      availableForSlot(slot, workers, ui.entriesByWorker, assignmentsByDate, slotKey(slot.sector, slot.shiftType)).forEach(w=>{
        if(!byWorker.has(w.id)) byWorker.set(w.id, {worker:w, types:new Set()});
        byWorker.get(w.id).types.add(slot.shiftType);
      });
    });
    const items = Array.from(byWorker.values())
      .sort((a,b)=>a.worker.name.localeCompare(b.worker.name,"he"))
      .map(({worker:w, types})=>{
        const allDay = shiftTypesForDay.length>0 && shiftTypesForDay.every(st=>types.has(st));
        const typesTxt = allDay ? "כל היום" : shiftTypesForDay.filter(st=>types.has(st)).map(st=>SHIFT_LABELS[st]||st).join(", ");
        return `${escapeHtml(w.name)}${w.role?` [${escapeHtml(w.role)}]`:""} <span class="muted" style="font-size:.85em;">(${typesTxt})</span>`;
      });
    return `<tr><td>${fmtDateHeb(d)}</td><td style="text-align:right;">${items.length?items.join(", "):'<span class="muted">אין</span>'}</td></tr>`;
  }).join("");
  return `<div style="overflow-x:auto;"><table><thead><tr><th>תאריך</th><th>מי זמין</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* --------- סיכום משמרות ששובצו לכל עובד, לתקופה המוצגת ---------
   מוקד (תקופה דו-שבועית) מוצג בשתי עמודות נפרדות לפי שבוע, לפי בקשת סרגיי. */
function renderWorkloadSummary(team, dates, ui){
  const workers = ui.workers;
  /* כמה משמרות כל עובד יכול לעבוד בטווח (לפי ההגשה שלו), מוצג בסוגריים ליד מספר המשמרות ששובצו.
     נספר כל צירוף ייחודי של תאריך+סוג משמרת שבו העובד זמין (אותה בדיקת זמינות כמו בכל המערכת, בלי
     לסנן מי שכבר משובץ). אחמ"ש במוקד נחשב זמין גם למשמרת שיש בה רק תקן מוקדן, כי הוא יכול למלא אותו.
     לבקשת סרגיי (2026-10-07), בכל הגזרות. */
  const group = sectorGroupForTeam(team);
  const availInRange = (rangeDates)=>{
    const sets = {}; workers.forEach(w=>sets[w.id]=new Set());
    if(!group.citySectors.length) return null;
    buildSlots(rangeDates, group, S.quotas).forEach(slot=>{
      const key = slot.date+"|"+slot.shiftType;
      availableForSlot(slot, workers, ui.entriesByWorker||{}, {}, null, false, true).forEach(w=>sets[w.id].add(key));
      if(slot.roleCounts && slot.roleCounts["מוקדן"]){
        availableForSlot(slot, workers.filter(w=>w.role==='אחמ"ש'), ui.entriesByWorker||{}, {}, null, true, true).forEach(w=>sets[w.id].add(key));
      }
    });
    const out = {}; Object.keys(sets).forEach(id=>out[id]=sets[id].size);
    return out;
  };
  const tgtOf = {}; workers.forEach(w=>tgtOf[w.id]=w.target_shifts);
  const tgtTxt = id=> tgtOf[id]!=null ? ` <span style="color:#1d4ed8;font-size:.85em;">/ יעד ${tgtOf[id]}</span>` : "";
  const fmt = (assigned, avail, id, noTgt)=> (avail ? `${assigned} <span class="muted">(${avail[id]||0})</span>` : `${assigned}`) + (noTgt ? "" : tgtTxt(id));
  const countInRange = (rangeDates)=>{
    const set = new Set(rangeDates);
    const counts = {}; workers.forEach(w=>counts[w.id]=0);
    // משמרת בשעות מותאמות שחוצה 2 בלוקים נשמרת כ-2 שורות עם אותן שעות - נספרת כמשמרת אחת בלבד (2026-10-07)
    const seen = new Set();
    (ui.assignments||[]).forEach(a=>{
      if(!set.has(a.entry_date) || !counts.hasOwnProperty(a.worker_id)) return;
      const key = (a.custom_start && a.custom_end) ? `${a.worker_id}|${a.entry_date}|${a.custom_start}|${a.custom_end}` : null;
      if(key){ if(seen.has(key)) return; seen.add(key); }
      counts[a.worker_id]++;
    });
    return counts;
  };
  if(team.cadence==="biweekly"){
    const week1 = dates.slice(0,7), week2 = dates.slice(7,14);
    const c1 = countInRange(week1), c2 = countInRange(week2);
    const a1 = availInRange(week1), a2 = availInRange(week2);
    const aTot = a1 && a2 ? (()=>{ const o={}; workers.forEach(w=>o[w.id]=(a1[w.id]||0)+(a2[w.id]||0)); return o; })() : null;
    const rows = workers.map(w=>`<tr><td style="text-align:right;">${escapeHtml(w.name)}</td><td>${fmt(c1[w.id]||0,a1,w.id)}</td><td>${fmt(c2[w.id]||0,a2,w.id)}</td><td><b>${fmt((c1[w.id]||0)+(c2[w.id]||0),aTot,w.id,true)}</b></td></tr>`).join("");
    return `<div style="overflow-x:auto;"><table><thead><tr><th>עובד</th><th>שבוע 1</th><th>שבוע 2</th><th>סה"כ</th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="muted">אין עובדים</td></tr>'}</tbody></table></div>
    ${a1?'<p class="muted" style="font-size:.85em;">המספר בסוגריים = כמה משמרות העובד יכול לעבוד באותו שבוע לפי ההגשה שלו.</p>':''}`;
  }
  const c = countInRange(dates);
  const av = availInRange(dates);
  const rows = workers.map(w=>`<tr><td style="text-align:right;">${escapeHtml(w.name)}</td><td>${fmt(c[w.id]||0,av,w.id)}</td></tr>`).join("");
  return `<div style="overflow-x:auto;"><table><thead><tr><th>עובד</th><th>משמרות</th></tr></thead><tbody>${rows || '<tr><td colspan="2" class="muted">אין עובדים</td></tr>'}</tbody></table></div>
  ${av?'<p class="muted" style="font-size:.85em;">המספר בסוגריים = כמה משמרות העובד יכול לעבוד בשבוע לפי ההגשה שלו. "יעד" = כמה משמרות המשבץ רוצה לתת לו (נקבע בניהול עובדים).</p>':''}`;
}

/* --------- פילוח חודשי: הגישו מול שובצו, לכל עובד, לחודש קלנדרי נבחר (חוצה תקופות הגשה אם צריך) --------- */
function renderMonthlyPanel(ui, isMoked){
  if(!ui.monthlyOpen) return "";
  const rows = (ui.monthlyResult||[]).map(r=>{
    const ratio = r.submitted>0 ? Math.round(r.assigned/r.submitted*100)+"%" : "-";
    return `<tr><td style="text-align:right;">${escapeHtml(r.name)}</td><td>${r.submitted}</td><td>${r.assigned}</td><td>${ratio}</td></tr>`;
  }).join("");
  return `<div class="day-card" style="margin-top:12px;">
    <h3 style="margin-top:0;">פילוח חודשי — הגישו מול שובצו</h3>
    <div class="row">
      <div class="field"><label>חודש</label><input type="month" id="monthlyPicker" value="${escapeHtml(ui.monthlyValue||"")}"></div>
      <button class="btn" data-action="run-monthly">חשב</button>
    </div>
    ${isMoked?`<p class="muted">שימו לב: במוקד הסימון בטופס הוא "מה לא יכול לעבוד" (חסימה) — כך ש"הוגשו" כאן סופר את סימוני החסימה, לא הצעות זמינות כמו אצל המאבטחים.</p>`:""}
    ${ui.monthlyMsg? `<p>${escapeHtml(ui.monthlyMsg)}</p>`:""}
    ${ui.monthlyResult? `<div style="overflow-x:auto;"><table><thead><tr><th>עובד</th><th>משמרות שהוגשו</th><th>משמרות ששובצו</th><th>יחס</th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="muted">אין נתונים לחודש הזה</td></tr>'}</tbody></table></div>`:""}
  </div>`;
}

/* מחשב, לכל חודש קלנדרי (עשוי לחצות כמה תקופות הגשה), כמה משמרות כל עובד הגיש מול כמה שובץ בפועל.
   "הגיש" = מספר רשומות constraint_entries בטווח החודש שאינן חופשה/מילואים/מחלה (סימון משמרת/שעות
   מותאמות בפועל - אצל מוקד זה סימוני חסימה, לא הצעות זמינות, ראו הערה בתצוגה). "שובץ" = מספר
   שורות shift_assignments בטווח החודש עבור אותו עובד. שאילתה עצמאית, לא תלויה בתקופה המוצגת. */
async function runMonthlyReport(){
  const ui = S.ui;
  const picker = document.getElementById("monthlyPicker");
  if(picker && picker.value) ui.monthlyValue = picker.value;
  if(!ui.monthlyValue){ ui.monthlyMsg = "בחר/י חודש"; return render(); }
  const [y,m] = ui.monthlyValue.split("-").map(Number);
  const monthStart = fmtDate(new Date(y, m-1, 1));
  const monthEnd = fmtDate(new Date(y, m, 0));
  ui.monthlyMsg = "מחשב...";
  render();
  try{
    const workers = ui.workers;
    const workerIds = workers.map(w=>w.id);
    const submittedCount = {}; workers.forEach(w=>submittedCount[w.id]=0);
    const assignedCount = {}; workers.forEach(w=>assignedCount[w.id]=0);
    if(workerIds.length){
      const subs = await apiGet("constraint_submissions", `select=id,worker_id&worker_id=in.(${workerIds.join(",")})`);
      if(subs.length){
        const subIds = subs.map(s=>s.id);
        const subToWorker = {}; subs.forEach(s=>subToWorker[s.id]=s.worker_id);
        const entries = await apiGet("constraint_entries", `select=submission_id,entry_date,shift_type&submission_id=in.(${subIds.join(",")})&entry_date=gte.${monthStart}&entry_date=lte.${monthEnd}`);
        entries.forEach(e=>{
          if(DAY_STATUS_TYPES.includes(e.shift_type)) return;
          const wid = subToWorker[e.submission_id];
          if(submittedCount.hasOwnProperty(wid)) submittedCount[wid]++;
        });
      }
      const assigns = await apiGet("shift_assignments", `select=worker_id,entry_date&worker_id=in.(${workerIds.join(",")})&entry_date=gte.${monthStart}&entry_date=lte.${monthEnd}`);
      assigns.forEach(a=>{ if(assignedCount.hasOwnProperty(a.worker_id)) assignedCount[a.worker_id]++; });
    }
    ui.monthlyResult = workers.map(w=>({name:w.name, submitted:submittedCount[w.id]||0, assigned:assignedCount[w.id]||0}))
      .sort((a,b)=>a.name.localeCompare(b.name,"he"));
    ui.monthlyMsg = null;
  }catch(e){ ui.monthlyMsg = "שגיאה: "+e.message; }
  render();
}

async function loadAggregateData(team){
  const ui = S.ui;
  ui.loadError = null;
  const group = sectorGroupForTeam(team);
  try{
    const teamFilter = group.teamIds.length>1 ? `in.(${group.teamIds.join(",")})` : `eq.${group.teamIds[0]}`;
    // auto_assign_exempt נוסף כאן ב-2026-10-06 אחרי שה-SQL של migration_auto_assign_exempt רץ בהצלחה
    // (מוסיף את העמודה ל-roster_workers) - נדרש כדי ש-runAutoAssign יוכל לסנן עובדים מוחרגים.
    const workers = await apiGet("roster_workers", `select=id,team_id,name,role,city_sectors,auto_assign_exempt,shadow_trainee,shabbat_observer,target_shifts&team_id=${teamFilter}&order=name`);
    workers.forEach(w=>{ w.cities = computeWorkerCities(w); });
    ui.workers = workers;

    // --- כל העובדים במערכת (לא רק הקבוצה הנוכחית) - לפיצ'ר "הצג זמינים מגזרות אחרות" בשיבוץ ידני,
    // ולבדיקת 8 שעות מנוחה שיכולה לחצות גם לגזרה אחרת (ראו computeRestViolations). לא נוגע/מחליף
    // אף שדה קיים - ui.workers/ui.entriesByWorker/ui.assignments (למטה) נשארים בדיוק כמו קודם, כדי
    // שלא לשנות שום התנהגות קיימת (כולל הוגנות השיבוץ האוטומטי). לבקשת סרגיי, 2026-09-28. ---
    try{
      const allWorkersRaw = await apiGet("roster_workers", `select=id,team_id,name,role,city_sectors,shadow_trainee,shabbat_observer&order=name`);
      allWorkersRaw.forEach(w=>{ w.cities = computeWorkerCities(w); });
      ui.allWorkers = allWorkersRaw;
      ui.allWorkersById = {}; allWorkersRaw.forEach(w=>{ ui.allWorkersById[w.id]=w; });
      ui.otherWorkers = allWorkersRaw.filter(w=>!group.teamIds.includes(w.team_id));
    }catch(e){ ui.allWorkers=ui.allWorkers||[]; ui.allWorkersById=ui.allWorkersById||{}; ui.otherWorkers=ui.otherWorkers||[]; }

    const workerIds = workers.map(w=>w.id);
    ui.entriesByWorker = {}; ui.submittedWorkerIds = new Set(); ui.exceptionWorkerIds = new Set(); ui.workerNotes = {};
    if(workerIds.length){
      try{
        const exc = await apiGet("constraint_exceptions", `select=worker_id&period_start=eq.${ui.periodStart}&worker_id=in.(${workerIds.join(",")})`);
        exc.forEach(e=>ui.exceptionWorkerIds.add(e.worker_id));
      }catch(e){}
      // --- הערות חופשיות (אופציונלי) שהעובד כתב בעת ההגשה - מוצגות לרואה הטבלה המרוכזת, ראו renderPivot. לבקשת סרגיי (2026-10-06). ---
      const subs = await apiGet("constraint_submissions", `select=id,worker_id,note&period_start=eq.${ui.periodStart}&worker_id=in.(${workerIds.join(",")})`);
      subs.forEach(s=>{ ui.submittedWorkerIds.add(s.worker_id); if(s.note && s.note.trim()) ui.workerNotes[s.worker_id] = s.note; });
      if(subs.length){
        const subIds = subs.map(s=>s.id);
        const entries = await apiGet("constraint_entries", `select=submission_id,entry_date,shift_type,custom_start,custom_end&submission_id=in.(${subIds.join(",")})`);
        const subToWorker = {}; subs.forEach(s=>subToWorker[s.id]=s.worker_id);
        entries.forEach(e=>{
          const wid = subToWorker[e.submission_id];
          ui.entriesByWorker[wid] = ui.entriesByWorker[wid] || {};
          ui.entriesByWorker[wid][e.entry_date] = ui.entriesByWorker[wid][e.entry_date] || [];
          ui.entriesByWorker[wid][e.entry_date].push(e);
        });
      }
    }
    // שיבוצים קיימים לכל התקופה (לכל הגזרות בקבוצה)
    const dates = periodDates(ui.periodStart, team);
    ui.assignments = [];
    if(group.citySectors.length){
      const secFilter = `in.(${group.citySectors.map(s=>`"${s}"`).join(",")})`;
      ui.assignments = await apiGet("shift_assignments", `select=*&sector=${secFilter}&entry_date=in.(${dates.join(",")})&order=created_at.asc`);
    }
    // סטטוס פרסום הסידור לעובדים לתקופה המוצגת (2026-10-07)
    try{ ui.publications = await apiGet("schedule_publications", `select=sector,period_start,published_at,published_by&period_start=eq.${ui.periodStart}`); }
    catch(e){ ui.publications = []; }

    // --- זמינות עובדים מגזרות אחרות (לכפתור "הצג זמינים מגזרות אחרות") - לפי מה שהם עצמם הגישו,
    // לתאריכים המוצגים בלבד (לא לפי period_start, כי לצוות אחר יכול להיות קדנס/תקופה משלו) ---
    ui.otherEntriesByWorker = {};
    try{
      const otherIds = (ui.otherWorkers||[]).map(w=>w.id);
      if(otherIds.length && dates.length){
        const oSubs = await apiGet("constraint_submissions", `select=id,worker_id&worker_id=in.(${otherIds.join(",")})`);
        if(oSubs.length){
          const oSubIds = oSubs.map(s=>s.id);
          const oSubToWorker = {}; oSubs.forEach(s=>oSubToWorker[s.id]=s.worker_id);
          const oEntries = await apiGet("constraint_entries", `select=submission_id,entry_date,shift_type,custom_start,custom_end&submission_id=in.(${oSubIds.join(",")})&entry_date=in.(${dates.join(",")})`);
          oEntries.forEach(e=>{
            const wid = oSubToWorker[e.submission_id];
            ui.otherEntriesByWorker[wid] = ui.otherEntriesByWorker[wid] || {};
            ui.otherEntriesByWorker[wid][e.entry_date] = ui.otherEntriesByWorker[wid][e.entry_date] || [];
            ui.otherEntriesByWorker[wid][e.entry_date].push(e);
          });
        }
      }
    }catch(e){ ui.otherEntriesByWorker = ui.otherEntriesByWorker||{}; }

    // --- כל השיבוצים, בכל הגזרות, כולל יום לפני/אחרי התקופה - לבדיקת "כבר משובץ" נכונה לעובד
    // שמוצג מגזרה אחרת, ולבדיקת מנוחה של 8 שעות שיכולה לחצות את גבול התקופה המוצגת ---
    try{
      if(dates.length){
        const restDates = [fmtDate(addDays(parseDate(dates[0]),-1))].concat(dates, [fmtDate(addDays(parseDate(dates[dates.length-1]),1))]);
        ui.allAssignments = await apiGet("shift_assignments", `select=*&entry_date=in.(${restDates.join(",")})&order=created_at.asc`);
      } else {
        ui.allAssignments = [];
      }
    }catch(e){ ui.allAssignments = ui.assignments||[]; }

    // --- רצף ימי עבודה / שבתות: כל השיבוצים (בכל הגזרות) 4 שבועות לפני ואחרי התקופה (2026-10-11) ---
    try{
      if(dates.length){
        const from = fmtDate(addDays(parseDate(dates[0]),-27)), to = fmtDate(addDays(parseDate(dates[dates.length-1]),27));
        let rows = [], off = 0;
        for(;;){
          const page = await apiGet("shift_assignments", `select=worker_id,entry_date,shift_type,sector&entry_date=gte.${from}&entry_date=lte.${to}&order=entry_date.asc,id.asc&limit=1000&offset=${off}`);
          rows = rows.concat(page); if(page.length < 1000) break; off += 1000;
        }
        ui.streakAssignments = rows;
      } else ui.streakAssignments = [];
    }catch(e){ ui.streakAssignments = ui.allAssignments || []; }
    ui.streakIdx = buildStreakIndex(ui.streakAssignments);

    // משימות שאינן משמרת (3 שורות לכל יום בתחתית טבלת השיבוץ) - 2026-10-20
    try{
      const tdates = periodDates(ui.periodStart, team);
      ui.schedTasks = group.citySectors.length ? await apiRpc("sched_tasks_list", {p_sectors: group.citySectors, p_from: tdates[0], p_to: tdates[tdates.length-1]}) : [];
    }catch(e){ ui.schedTasks = []; }

    ui.loaded = true;
  }catch(e){
    ui.loaded = true; ui.loadError = e.message;
  }
  render();
}

function excButtonsHtml(workerId, submitted, hasExc, periodStart){
  if(hasExc) return ` <span class="pill">הגשה פתוחה ידנית</span> <button class="btn small secondary" data-action="open-pin" data-next="revoke-exception" data-worker="${workerId}" data-period="${periodStart}">בטל פתיחה</button>`;
  return ` <button class="btn small${submitted?" secondary":""}" data-action="open-pin" data-next="grant-exception" data-worker="${workerId}" data-period="${periodStart}">${submitted?"פתח הגשה מחדש":"פתח הגשה עבורו"}</button>`;
}
function renderPivot(dates, workers, entriesByWorker, submittedIds, exceptionIds, periodStart, workerNotes){
  exceptionIds = exceptionIds || new Set();
  workerNotes = workerNotes || {};
  return `
  <div style="overflow-x:auto;">
  <table>
    <thead><tr><th>עובד</th><th>הערה</th>${dates.map(d=>`<th>${fmtDateHeb(d)}</th>`).join("")}</tr></thead>
    <tbody>
      ${workers.map(w=>{
        const submitted = submittedIds.has(w.id);
        const hasExc = exceptionIds.has(w.id);
        let statusHtml = "";
        if(!submitted) statusHtml = ' <span class="pill">לא הגיש</span>';
        // פתיחת הגשה ידנית אחרי שהמערכת ננעלה - לכל עובד, גם למי שכבר הגיש (כדי שיוכל לעדכן). קודם
        // הכפתור הוצג רק למי שלא הגיש, ולכן "נעלם" כשכולם הגישו. לבקשת סרגיי (2026-10-07).
        statusHtml += excButtonsHtml(w.id, submitted, hasExc, periodStart);
        const cityTag = (w.cities && w.cities.length) ? ` <span class="muted" style="font-size:.85em;">(${escapeHtml(w.cities.join("/"))})</span>` : "";
        // --- הערה חופשית (אופציונלי) שהעובד כתב בעת ההגשה - עמודה נפרדת בצד, ליד שם העובד, לבקשת סרגיי (2026-10-06) ---
        const note = workerNotes[w.id];
        const noteCell = note ? `<td style="text-align:right;font-style:italic;">📝 ${escapeHtml(note)}</td>` : `<td class="muted">-</td>`;
        return `<tr>
          <td style="text-align:right;${submitted?"":"color:#8a8a8a;"}">${escapeHtml(w.name)}${cityTag}${statusHtml}</td>
          ${noteCell}
          ${dates.map(d=>{
            const es = (entriesByWorker[w.id]||{})[d];
            if(!es || !es.length) return `<td>-</td>`;
            // מוקד: שעות מותאמות = "רק בשעות האלה כן יכול" - מוצג בירוק בנפרד, כי שאר הסימונים במוקד הם חסימות
            const mk = workerIsMoked(w, "");
            return `<td>${es.map(e=> e.shift_type==="custom" ? (mk ? `<span style="color:var(--ok);font-weight:700;">✓ יכול רק ${e.custom_start}-${e.custom_end}</span>` : `${e.custom_start}-${e.custom_end}`) : SHIFT_LABELS[e.shift_type]).join(", ")}</td>`;
          }).join("")}
        </tr>`;
      }).join("")}
    </tbody>
  </table>
  </div>
  ${!workers.length? `<p class="muted">אין עובדים רשומים לצוות זה. ניתן להוסיף דרך "ניהול עובדים ומורשי גישה".</p>`:""}
  <p class="muted">"פתח הגשה עבורו" / "פתח הגשה מחדש" מאפשר לעובד ספציפי להגיש או לעדכן אילוצים לתקופה זו גם אחרי שהמועד הרגיל של הצוות חלף (למשל אם פספס את הדדליין). דורש קוד עריכה.</p>
  ${renderPinOverlay()}`;
}

/* --------- טבלה נפרדת ובולטת של "מי עוד לא הגיש" לתקופה המוצגת - לבקשת סרגיי (2026-10-05), כדי
   שמי שבונה את הסידור יראה בבירור (בלי לגלול בטבלה המרוכזת המלאה) אם עדיין חסרות הגשות לפני
   שמריצים שיבוץ אוטומטי/ידני. אותו מקור-אמת (submittedIds) כמו בטבלה המרוכזת (renderPivot). */
function renderMissingSubmissions(workers, submittedIds, exceptionIds, isMoked, periodStart){
  exceptionIds = exceptionIds || new Set();
  if(!workers.length) return "";
  const missing = workers.filter(w=>!submittedIds.has(w.id)).sort((a,b)=>a.name.localeCompare(b.name,"he"));
  const warnNote = isMoked
    ? 'מומלץ להמתין שכולם יגישו (או לפחות לבדוק את הרשימה כאן) לפני הרצת "שיבוץ אוטומטי" — במוקד עובד שלא הגיש נחשב זמין כברירת מחדל, ועלול להישבץ על בסיס זמינות שעוד תשתנה.'
    : 'מומלץ לבדוק את הרשימה כאן לפני הרצת "שיבוץ אוטומטי" — עובד שלא הגיש לא נחשב זמין לאף משמרת, כך שהחוסרים בשיבוץ עלולים לנבוע מהגשות חסרות ולא ממחסור אמיתי בכוח אדם.';
  return `<div class="card" style="${missing.length?"border-color:#d9822b;":""}">
    <h3>מי עוד לא הגיש (${missing.length}/${workers.length})</h3>
    ${!missing.length? `<p class="muted">כולם הגישו לתקופה זו ✅</p>` : `
    <table>
      <thead><tr><th>עובד</th><th></th></tr></thead>
      <tbody>
        ${missing.map(w=>`<tr><td style="text-align:right;">${escapeHtml(w.name)}</td><td>${periodStart? excButtonsHtml(w.id, false, exceptionIds.has(w.id), periodStart) : (exceptionIds.has(w.id)?'<span class="pill">הגשה פתוחה ידנית</span>':"")}</td></tr>`).join("")}
      </tbody>
    </table>
    <p class="muted">${warnNote}</p>`}
  </div>`;
}

/* בונה את כל "המשבצות" (slot) הנדרשות לתקופה: תאריך × שורת התקן, לפי day_type (ובמוקד גם לפי weekday ספציפי) של כל תאריך */
function buildSlots(dates, group, quotas){
  const slots = [];
  dates.forEach(d=>{
    const dt = dayTypeForDate(d);
    const wd = parseDate(d).getDay();
    group.citySectors.forEach(sector=>{
      quotas.filter(q=>q.sector===sector && q.day_type===dt && (q.weekday==null || q.weekday===wd)).forEach(q=>{
        q = effQuota(q, d);
        slots.push({date:d, sector, shiftType:q.shift_type, label:q.label, start:q.start_time, end:q.end_time, required:q.required_count, roleCounts:q.role_counts||null});
      });
    });
  });
  return slots;
}
function roleCountsText(rc){ if(!rc) return ""; return Object.keys(rc).map(r=>`${rc[r]} ${r}`).join(" + "); }

/* מי זמין למשבצת נתונה: מתוך workers, מי לא כבר משובץ למשבצת אחרת באותו תאריך, וכן:
   (אם למשבצת יש דרישת תפקידים - כמו במוקד: אחמ"ש/מוקדן - רק עובדים שהתפקיד שלהם נדרש בה נחשבים זמינים;
   ההתאמה המדויקת בין מספר האחמ"שים/מוקדנים בפועל היא באחריות מי שמשבץ, הרשימה כאן היא איחוד של כל מי שרלוונטי)
   מודל הסימון שונה בין מוקד לשאר הצוותים: במוקד מה שמסומן חוסם ("מה שלא יכול לעבוד" - ברירת המחדל היא
   זמין, אלא אם נחסם במפורש). בשאר הצוותים (מאבטחים) מה שמסומן הוא בדיוק ההפך - היתר הזמינות ("מה שכן
   יכול לעבוד") - משמרת שלא סומנה עבורה כלל, או עובד שלא הגיש בכלל, נחשבים כלא זמינים. בשני המקרים,
   חופשה/מילואים/מחלה חוסמים תמיד את כל היום, בכל משמרת.
   ignoreRole=true: מתעלם מהתאמת התפקיד (משמש בשיבוץ האוטומטי למוקד כדי לאתר אחמ"שים "פנויים"
   שפתחו זמינות למשבצת אך לא נדרשים/לא שובצו בתקן אחמ"ש שלה - ראו runAutoAssign).
   skipAlreadyCheck=true: לא מסנן מי שכבר משובץ למשמרת אחרת באותו יום (ברירת המחדל false משאירה
   את ההתנהגות הקיימת בכל מקום אחר ללא שינוי) - משמש רק בבורר השיבוץ הידני (תא בודד), כדי להציג
   גם מי שסימן זמינות אך כבר עובד משמרת אחרת היום, עם הערה, ולאפשר לשבץ אותו בכל זאת במכוון.
   לבקשת סרגיי (2026-10-06).
   תיקון באג (2026-10-06, לבקשת סרגיי: "בחלק מהמקומות... לא מופיעים לי כלל עובדי המוקד"): מודל
   הסימון (חוסם/היתר) נקבע כעת לפי הצוות של כל עובד בעצמו (w.team_id), ולא לפי גזרת המשבצת
   הנבדקת (slot.sector). קודם, כש-workers כולל עובדים מצוות אחר (כמו בתכונת "הצג זמינים מגזרות
   אחרות") - עובדי מוקד שנבדקו מול משבצת של צוות מאבטחים פורשו לפי המודל ההפוך (היתר, לא חסימה),
   וכמעט תמיד "נעלמו" כי אין להם סימון מפורש לרוב הימים/המשמרות (המודל שלהם הוא "ברירת מחדל זמין").
   בשימוש הרגיל (workers מאותו צוות כמו ה-slot) זה לא משנה שום התנהגות קיימת - התוצאה זהה. */
/* "שומר שבת" (roster_workers.shabbat_observer, מסומן בניהול עובדים) - לא זמין ולא מוצג כאפשרות לשיבוץ
   בשישי ערב, שישי לילה ושבת ערב. לבקשת סרגיי (2026-10-07). */
function isShabbatBlockedSlot(date, shiftType){
  const dt = dayTypeForDate(date);
  if(dt==="friday") return ["evening","night","friday_night"].includes(shiftType);
  if(dt==="saturday") return shiftType==="evening";
  return false;
}
function shabbatBlocked(w, date, shiftType){ return !!(w && w.shabbat_observer) && isShabbatBlockedSlot(date, shiftType); }
/* מוקד - "שעות מותאמות" = השעות שהעובד *כן* יכול לעבוד באותו יום (2026-10-20, לבקשת סרגיי).
   דוגמה: פאר מסמנת בראשון "לא יכולה בוקר" + שעות מותאמות 16:00-23:00 -> היא זמינה רק בין 16:00 ל-23:00 ביום הזה.
   כשיש ליום שעות מותאמות, הן קובעות את הזמינות של כל היום (גם אם סומנו בנוסף משמרות חסומות), וכל שאר
   השעות של היום נחשבות לא זמינות. משמרת שחופפת את החלון רק בחלקה (לפחות שעה) - העובד זמין לה בשעות
   החפיפה בלבד; בשיבוץ האוטומטי הוא משובץ בשעות האלה, והשעה/ות החסרות נלקחות מעובד המשמרת הסמוכה
   (למשל עובד הבוקר נשאר עד 16:00), אם הוא יכול לעבוד גם במשמרת הזו - ראו fillPartialGaps.
   אצל המאבטחים (לא מוקד) - ללא שינוי: שעות מותאמות הן סימון זמינות כמו קודם. */
const MOKED_MIN_PARTIAL = 60; // חפיפה מינימלית (בדקות) כדי שעובד ייחשב זמין חלקית למשמרת
function workerIsMoked(w, sector){
  const t = S.teams.find(x=>x.id===w.team_id);
  return t ? isMokedTeam(t) : sector==="מוקד";
}
function rangeMin(start, end){ let a=timeToMinutes(String(start).slice(0,5)), b=timeToMinutes(String(end).slice(0,5)); if(b<=a) b+=1440; return [a,b]; }
function mokedWindows(w, date, entriesByWorker){
  const es = ((entriesByWorker||{})[w.id]||{})[date] || [];
  const ws = es.filter(e=>e.shift_type==="custom" && e.custom_start && e.custom_end).map(e=>rangeMin(e.custom_start, e.custom_end));
  return ws.length ? ws : null;
}
// חיתוך בין משמרת [start,end] לחלונות הזמינות של העובד: {full:true} / {full:false, start, end, minutes} / null
function windowFit(windows, start, end){
  const [ss, se] = rangeMin(start, end);
  let best = null;
  windows.forEach(([ws, we])=>{
    const a = Math.max(ss, ws), b = Math.min(se, we);
    if(b - a > 0 && (!best || b - a > best[1] - best[0])) best = [a, b];
  });
  if(!best) return null;
  if(best[0]<=ss && best[1]>=se) return {full:true};
  return {full:false, start:fmtMinutes(best[0]%1440), end:fmtMinutes(best[1]%1440), minutes:best[1]-best[0]};
}
// לשיבוץ: שעות חלקיות לעובד מוקד במשמרת (או null אם הוא זמין לכל המשמרת / אין לו שעות מותאמות ביום הזה)
function mokedPartialHours(w, slot, entriesByWorker, start, end){
  if(!w || !workerIsMoked(w, slot.sector)) return null;
  const wins = mokedWindows(w, slot.date, entriesByWorker||S.ui.entriesByWorker);
  if(!wins) return null;
  const f = windowFit(wins, start||slot.start, end||slot.end);
  return (f && !f.full) ? [f.start, f.end] : null;
}
// שיבוץ ידני: תגית ליד עובד מוקד שזמין רק לחלק מהמשמרת, והודעה + כפתור לשיבוץ בשעות האלה
function partialTag(w, slot){
  const ph = slot && w && mokedPartialHours(w, slot);
  return ph ? ` <span style="color:var(--ok);font-size:.85em;">(יכול/ה רק ${ph[0]}-${ph[1]})</span>` : "";
}
function partialNoticeHtml(w, slot){
  const ph = slot && w && mokedPartialHours(w, slot);
  if(!ph) return "";
  return `<div class="note-box">⏰ ${escapeHtml(w.name)} הגיש/ה שהוא/היא יכול/ה לעבוד ביום הזה רק ${ph[0]}-${ph[1]} (המשמרת ${String(slot.start).slice(0,5)}-${String(slot.end).slice(0,5)}).
    <div class="row" style="margin-top:6px;"><button class="btn small ok" data-action="tmpl-hours-partial" data-cs="${ph[0]}" data-ce="${ph[1]}">שבץ ב-${ph[0]}-${ph[1]}</button></div>
    <span class="muted" style="font-size:.85em;">את השעות החסרות אפשר לכסות ע"י הארכת עובד במשמרת הסמוכה (שעות מותאמות). בשיבוץ האוטומטי זה נעשה לבד.</span></div>`;
}
function availableForSlot(slot, workers, entriesByWorker, assignmentsByDate, excludeSlotKey, ignoreRole, skipAlreadyCheck){
  // בשבת טופס ההגשה מציע רק "מוצ"ש" - סימון כזה חל גם על משמרות שבת אחרות (כמו ערב מוצ"ש 20:00-23:00
  // במוקד, נוסף 2026-10-07), כי כולן בתוך חלון המוצ"ש.
  const blocking = blockingEntryTypes(slot.shiftType).concat(dayTypeForDate(slot.date)==="saturday" && slot.shiftType!=="motzash" ? ["motzash"] : []);
  return workers.filter(w=>{
    if(shabbatBlocked(w, slot.date, slot.shiftType)) return false;
    if(!ignoreRole && slot.roleCounts && !(w.role && slot.roleCounts[w.role])) return false;
    // שיוך עיר (רלוונטי רק לארבע הערים בבריכה המשותפת של מאיר אזרואל - ראו computeWorkerCities)
    if(POOLED_CITY_SECTORS.includes(slot.sector)){
      const cities = w.cities!==undefined ? w.cities : computeWorkerCities(w);
      if(cities && cities.length && !cities.includes(slot.sector)) return false;
    }
    const dayEntries = (entriesByWorker[w.id]||{})[slot.date] || [];
    const hasDayOff = dayEntries.some(e=>DAY_STATUS_TYPES.includes(e.shift_type)); // חופשה/מילואים/מחלה חוסמים את כל היום, בכל משמרת
    if(hasDayOff) return false;
    const matches = dayEntries.some(e=>{
      if(e.shift_type==="custom") return rangesOverlaps(e.custom_start,e.custom_end, slot.start, slot.end);
      return blocking.includes(e.shift_type);
    });
    const workerTeam = S.teams.find(t=>t.id===w.team_id);
    const isMoked = workerTeam ? isMokedTeam(workerTeam) : (slot.sector==="מוקד");
    if(isMoked){
      // מוקד: שעות מותאמות = השעות שכן יכול (ראו mokedWindows) - הן קובעות את זמינות היום כולו
      const wins = mokedWindows(w, slot.date, entriesByWorker);
      if(wins){
        const f = windowFit(wins, slot.start, slot.end);
        if(!f || (!f.full && f.minutes < MOKED_MIN_PARTIAL)) return false;
      } else if(matches) return false; // מוקד: סימון = חסימה (המודל הקיים, ללא שינוי)
    } else {
      if(!matches) return false; // מאבטחים: רק סימון מפורש = זמינות; ברירת המחדל היא "לא זמין"
    }
    if(!skipAlreadyCheck){
      const already = (assignmentsByDate[slot.date]||[]).some(a => a.worker_id===w.id && slotKey(a.sector,a.shift_type) !== excludeSlotKey);
      if(already) return false;
    }
    return true;
  });
}
function slotKey(sector, shiftType){ return sector+"|"+shiftType; }

/* ================================================================
   בדיקת 8 שעות מנוחה בין משמרות עוקבות של אותו עובד - לבקשת סרגיי (2026-09-28).
   רצה על פני כל הגזרות יחד (לא רק הגזרה שבתצוגה) כי עובד שמושאל דרך "הצג זמינים מגזרות אחרות"
   עלול לסיים משמרת בגזרה אחת ולהתחיל הבאה בגזרה אחרת. משמשת גם בשיבוץ ידני וגם באוטומטי - הבדיקה
   היא ויזואלית בלבד (מסמנת באדום), לא חוסמת שיבוץ; הדרך לתקן היא "שעות מותאמות" על התא המסומן
   (אותו מנגנון קיים - לחיצה על התא -> אותו עובד -> שעות מותאמות -> שעת התחלה מאוחרת יותר).
   ================================================================ */
const REST_HOURS_REQUIRED = 8;
/* טווח הזמן בפועל של שיבוץ נתון: שעות מותאמות אם הוגדרו, אחרת שעות התקן הרגילות לפי S.quotas.
   משמרת שחוצה חצות (סיום <= התחלה) - הסיום מחושב ליום הבא. */
function shiftInterval(a){
  const q = effQuota(S.quotas.find(x=>x.sector===a.sector && x.shift_type===a.shift_type &&
    (x.weekday==null || x.weekday===parseDate(a.entry_date).getDay())), a.entry_date);
  if(!q) return null;
  const startStr = (a.custom_start || q.start_time).slice(0,5);
  const endStr = (a.custom_end || q.end_time).slice(0,5);
  if(!startStr || !endStr) return null;
  const start = parseDate(a.entry_date);
  const [sh,sm] = startStr.split(":").map(Number);
  start.setHours(sh, sm, 0, 0);
  const end = parseDate(a.entry_date);
  const [eh,em] = endStr.split(":").map(Number);
  end.setHours(eh, em, 0, 0);
  if(end <= start) end.setDate(end.getDate()+1); // חוצה חצות
  return {start, end};
}
function restKey(a){ return `${a.worker_id}|${a.entry_date}|${a.sector}|${a.shift_type}`; }
/* מחזיר Set של restKey עבור כל שיבוץ שיש לפניו (באותו עובד, בכל גזרה) פחות מ-8 שעות מנוחה */
function computeRestViolations(assignments){
  const byWorker = {};
  (assignments||[]).forEach(a=>{
    const iv = shiftInterval(a);
    if(!iv) return;
    (byWorker[a.worker_id] = byWorker[a.worker_id]||[]).push({a, iv});
  });
  const bad = new Set();
  // bad.tight: שיבוצים שלפניהם בדיוק 8 שעות מנוחה (לא פחות - זה כבר אדום) - מסומנים בצהוב במסך בלבד,
  // לא בפלט ההדפסה. לבקשת סרגיי (2026-10-07).
  bad.tight = new Set();
  Object.values(byWorker).forEach(list=>{
    list.sort((x,y)=> x.iv.start - y.iv.start);
    // משמרת בשעות מותאמות שחוצה 2 בלוקים נשמרת כ-2 שורות עם אותן שעות בדיוק - זו אותה משמרת, לא שתיים
    // (בלי זה היא סומנה בטעות כ"פחות מ-8 שעות מנוחה" מול עצמה). התיקון: מדלגים על מרווח זהה. (2026-10-07)
    const uniq = [];
    list.forEach(x=>{
      const prev = uniq[uniq.length-1];
      if(prev && +prev.iv.start===+x.iv.start && +prev.iv.end===+x.iv.end){ (prev.dups = prev.dups||[]).push(x.a); return; }
      uniq.push(x);
    });
    for(let i=1;i<uniq.length;i++){
      const gapHours = (uniq[i].iv.start - uniq[i-1].iv.end) / 3600000;
      const target = gapHours < REST_HOURS_REQUIRED ? bad : (Math.abs(gapHours-REST_HOURS_REQUIRED) < 0.01 ? bad.tight : null);
      if(target){ target.add(restKey(uniq[i].a)); (uniq[i].dups||[]).forEach(d=>target.add(restKey(d))); }
    }
  });
  return bad;
}

/* --------- מניעת שיבוץ אוטומטי עם פחות מ-8 שעות מנוחה, כברירת מחדל (לבקשת סרגיי, 2026-09-28) ---------
   בניגוד לסימון האדום שלמעלה (שרק מציג אזהרה ולא חוסם), כאן מדובר במניעה בפועל בתוך runAutoAssign:
   לכל עובד נבנה מראש (מ-ui.allAssignments, כל הגזרות) רשימת המשמרות הקיימות שלו; בכל משבצת, מועמדים
   שהצבתם היתה יוצרת פחות מ-8 שעות מנוחה (מול משמרת קיימת שלהם, בכל גזרה, כולל משמרות שכבר שובצו
   באותה הרצה) מודרים מהבחירה - אלא אם אין שום מועמד "נקי" כדי למלא את המשבצת, ואז הם משמשים
   כמוצא אחרון (עדיפות אחרונה), עדיין ממוינים לפי הוגנות כרגיל. */
function buildWorkerIntervals(assignments){
  const byWorker = {};
  (assignments||[]).forEach(a=>{
    const iv = shiftInterval(a);
    if(!iv) return;
    (byWorker[a.worker_id] = byWorker[a.worker_id]||[]).push(iv);
  });
  return byWorker;
}
function wouldViolateRest(workerId, newInterval, workerIntervals){
  const list = workerIntervals[workerId];
  if(!list || !list.length) return false;
  return list.some(iv=>{
    let gapHours;
    if(iv.end <= newInterval.start) gapHours = (newInterval.start - iv.end) / 3600000;
    else if(newInterval.end <= iv.start) gapHours = (iv.start - newInterval.end) / 3600000;
    else return true; // חפיפה ממש - לא אמור לקרות (availableForSlot כבר מדיר "כבר משובץ"), נזהרים בכל זאת
    return gapHours < REST_HOURS_REQUIRED;
  });
}

/* --------- 7 ימי עבודה ברצף / שבת רביעית ברצף (לבקשת סרגיי, 2026-10-11) ---------
   שיבוץ אוטומטי: עובד שהשיבוץ היה יוצר אצלו 7 ימי עבודה ברצף או שבת רביעית ברצף - לא משובץ (בלי
   "מוצא אחרון" כמו במנוחה; המשבצת תישאר בחוסר). שיבוץ ידני: מותר, אבל מוצגת אזהרה ⚠ ליד השם ובשלב
   השני, וריבוע אזהרות בראש הטבלה המרוכזת. הבדיקה בכל הגזרות, כולל השבועות שלפני/אחרי התקופה
   (ui.streakAssignments נטען בטווח של 4 שבועות לכל כיוון).
   שבת = משמרת ערב/לילה של יום שישי ועד משמרת מוצ"ש כולל (כל משמרת ביום שבת). */
const STREAK_MAX_DAYS = 6;      // היום השביעי ברצף = הפרה
const STREAK_MAX_SHABBATS = 3;  // השבת הרביעית ברצף = הפרה
function isShabbatShift(date, shiftType){
  const dow = parseDate(date).getDay();
  return dow===5 ? ["evening","night","friday_night"].includes(shiftType) : dow===6;
}
function shabbatKeyOf(date){ const d = parseDate(date); if(d.getDay()===6) d.setDate(d.getDate()-1); return fmtDate(d); }
function buildStreakIndex(assignments){
  const idx = {};
  (assignments||[]).forEach(a=>{
    const w = idx[a.worker_id] || (idx[a.worker_id] = {days:new Set(), shabbats:new Set()});
    w.days.add(a.entry_date);
    if(isShabbatShift(a.entry_date, a.shift_type)) w.shabbats.add(shabbatKeyOf(a.entry_date));
  });
  return idx;
}
function streakAdd(idx, workerId, date, shiftType){
  const w = idx[workerId] || (idx[workerId] = {days:new Set(), shabbats:new Set()});
  w.days.add(date);
  if(isShabbatShift(date, shiftType)) w.shabbats.add(shabbatKeyOf(date));
}
function runAround(set, key, step){
  let n = 1, d = addDays(parseDate(key), -step);
  while(set.has(fmtDate(d))){ n++; d = addDays(d, -step); }
  d = addDays(parseDate(key), step);
  while(set.has(fmtDate(d))){ n++; d = addDays(d, step); }
  return n;
}
/* מה היה קורה אם העובד ישובץ למשמרת הזו: מחזיר רשימת הפרות (ריקה = תקין) */
function streakIssues(idx, workerId, date, shiftType){
  const w = (idx||{})[workerId] || {days:new Set(), shabbats:new Set()};
  const out = [];
  const n = runAround(w.days, date, 1);
  if(n > STREAK_MAX_DAYS) out.push(`${n} ימי עבודה ברצף`);
  if(isShabbatShift(date, shiftType)){
    const k = runAround(w.shabbats, shabbatKeyOf(date), 7);
    if(k > STREAK_MAX_SHABBATS) out.push(k===4 ? "שבת רביעית ברצף" : `שבת ${k} ברצף`);
  }
  return out;
}
function streakTag(workerId, date, shiftType){
  const v = streakIssues(S.ui && S.ui.streakIdx, workerId, date, shiftType);
  return v.length ? ` <span class="streak-warn">⚠ ${escapeHtml(v.join(", "))}</span>` : "";
}
function streakNoticeHtml(workerId, date, shiftType){
  const v = streakIssues(S.ui && S.ui.streakIdx, workerId, date, shiftType);
  return v.length ? `<div class="note-box streak-box">⚠ שים לב: שיבוץ כאן ייצור לעובד <b>${escapeHtml(v.join(" ו"))}</b>. אפשר לשבץ בכל זאת (שיבוץ ידני).</div>` : "";
}
/* ריבוע אזהרות בטבלה המרוכזת: עובדים שכבר משובצים 7+ ימים ברצף או שבת רביעית+ ברצף, בתקופה המוצגת */
function streakWarningsHtml(group, dates){
  const ui = S.ui; const idx = ui && ui.streakIdx; if(!idx || !dates.length) return "";
  const sectors = new Set(group.citySectors||[]);
  const first = dates[0], last = dates[dates.length-1];
  const inGroup = new Set((ui.assignments||[]).filter(a=>sectors.has(a.sector)).map(a=>a.worker_id));
  const byId = Object.assign({}, ui.allWorkersById || {}); (ui.workers||[]).forEach(w=>{ if(!byId[w.id]) byId[w.id] = w; });
  const lines = [];
  inGroup.forEach(wid=>{
    const w = idx[wid]; if(!w) return;
    const name = (byId[wid]&&byId[wid].name) || "?";
    // רצפי ימים
    const days = Array.from(w.days).sort(); let runStart = null, prev = null;
    const flush = ()=>{ if(runStart===null) return; const n = Math.round((parseDate(prev)-parseDate(runStart))/86400000)+1;
      if(n > STREAK_MAX_DAYS && prev >= first && runStart <= last) lines.push(`<div>⚠ <b>${escapeHtml(name)}</b> — ${n} ימי עבודה ברצף (${fmtDateHeb(runStart)} עד ${fmtDateHeb(prev)})</div>`); };
    days.forEach(d=>{ if(prev && fmtDate(addDays(parseDate(prev),1))===d){ prev = d; return; } flush(); runStart = d; prev = d; }); flush();
    // רצפי שבתות
    const sh = Array.from(w.shabbats).sort(); let k = 0; prev = null;
    sh.forEach(f=>{ k = (prev && fmtDate(addDays(parseDate(prev),7))===f) ? k+1 : 1; prev = f;
      if(k > STREAK_MAX_SHABBATS && f >= fmtDate(addDays(parseDate(first),-1)) && f <= last) lines.push(`<div>⚠ <b>${escapeHtml(name)}</b> — ${k===4?"שבת רביעית":"שבת "+k} ברצף (${fmtDateHeb(fmtDate(addDays(parseDate(f),1)))})</div>`); });
  });
  if(!lines.length) return "";
  return `<div class="note-box streak-box"><b>אזהרות רצף (7 ימי עבודה / שבת רביעית ברצף):</b>${lines.join("")}</div>`;
}

function renderQuotaPanel(group, slots, ui){
  const workers = ui.workers;
  const assignmentsByDate = {};
  (ui.assignments||[]).forEach(a=>{ (assignmentsByDate[a.entry_date] = assignmentsByDate[a.entry_date]||[]).push(a); });

  const rows = slots.map(slot=>{
    const assigned = (assignmentsByDate[slot.date]||[]).filter(a=>a.sector===slot.sector && a.shift_type===slot.shiftType);
    const avail = availableForSlot(slot, workers, ui.entriesByWorker, assignmentsByDate, slotKey(slot.sector,slot.shiftType));
    const shortAvail = avail.length < slot.required;
    const shortAssigned = assigned.length < slot.required;
    return `<tr>
      <td>${fmtDateHeb(slot.date)}</td>
      <td>${escapeHtml(slot.sector)}</td>
      <td>${escapeHtml(slot.label)}${slot.roleCounts?`<br><span class="muted" style="font-size:.85em;">${escapeHtml(roleCountsText(slot.roleCounts))}</span>`:""}</td>
      <td>${slot.required}</td>
      <td class="${shortAvail?'shortage':'ok-cell'}">${avail.length}</td>
      <td class="${assigned.length?(shortAssigned?'shortage':'ok-cell'):''}">${assigned.length}${assigned.length?` (${assigned.map(a=>{const w=workers.find(x=>x.id===a.worker_id); return w?escapeHtml(w.name)+(w.role?` [${escapeHtml(w.role)}]`:""):"?";}).join(", ")})`:""}</td>
    </tr>`;
  }).join("");

  return `
  <div style="overflow-x:auto;">
  <table>
    <thead><tr><th>תאריך</th><th>גזרה</th><th>משמרת</th><th>נדרש</th><th>זמינים</th><th>משובצים</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="6" class="muted">אין משבצות לתקופה זו</td></tr>`}</tbody>
  </table>
  </div>`;
}

/* ================================================================
   תצוגת "תבנית" (כמו הטופס הרשמי): גזרה -> משמרת בוקר/ערב -> סייר N -> יום
   ================================================================ */
/* מפתח "באקט": שורות שאף פעם לא קיימות יחד באותו תאריך מאוחדות לאותה שורת "סייר" (כדי לא לפתוח
   בלוק נפרד שריק כמעט כל השבוע) - morning/friday_morning (חול מול שישי), וכן night/friday_night/
   motzash (חול/שישי/שבת). "מוצ"ש" תמיד מצטרף ל"לילה" אם יש בגזרה משמרת לילה נפרדת בימי חול (כמו
   בחיפה); אחרת (כשאין "לילה" נפרד, כמו בירושלים) הוא מצטרף ל"ערב" - בדיוק כמו בתבנית. משמרות
   שכן עלולות לרוץ במקביל באותו יום (כמו בחיפה: ערב+מתואמת+לילה יחד) נשארות בבלוקים נפרדים. */
const TMPL_BUCKET_LABEL_OVERRIDE = {morning:"משמרת בוקר", evening:"משמרת ערב", night:"משמרת לילה"};
/* סדר קבוע להצגת תפקידי המוקד (אחמ"ש תמיד מעל מוקדן, כמו בטופס הרשמי) */
const MOKED_ROLE_ORDER = ['אחמ"ש','מוקדן'];

/* בונה את מבנה התבנית: לכל גזרה בקבוצה - אילו "בלוקי משמרת" קיימים בפועל בתקן שכבר מוגדר במערכת,
   ולכל אחד - כמה "סיירים" (המקסימום הנדרש על פני התקופה) והתקן בכל יום בתקופה. עבור גזרות עם דרישת
   תפקידים (role_counts, כמו מוקד) נבנה גם bucket.roles (אילו תפקידים מופיעים בבלוק, לפי הסדר הקבוע)
   ו-bucket.roleMax (המקסימום הנדרש מכל תפקיד על פני התקופה) - משמשים לתצוגה לפי תפקיד במקום "סייר N". */
function buildTemplateData(group, dates, quotas){
  return group.citySectors.map(sector=>{
    const rowsBySector = [];
    dates.forEach(d=>{
      const dt = dayTypeForDate(d), wd = parseDate(d).getDay();
      quotas.filter(q=>q.sector===sector && q.day_type===dt && (q.weekday==null||q.weekday===wd)).forEach(q=>rowsBySector.push(q));
    });
    const hasSeparateNight = rowsBySector.some(q=>q.shift_type==="night"||q.shift_type==="friday_night");
    function bucketKey(shiftType){
      if(shiftType==="morning"||shiftType==="friday_morning") return "morning";
      if(shiftType==="night"||shiftType==="friday_night") return "night";
      if(shiftType==="motzash") return hasSeparateNight ? "night" : "evening";
      return shiftType;
    }
    const byKey = {};
    dates.forEach(d=>{
      const dt = dayTypeForDate(d), wd = parseDate(d).getDay();
      quotas.filter(q=>q.sector===sector && q.day_type===dt && (q.weekday==null||q.weekday===wd))
        .forEach(q=>{
          const key = bucketKey(q.shift_type);
          if(!byKey[key]) byKey[key] = {key, maxReq:0, perDate:{}, minStart:q.start_time, label: TMPL_BUCKET_LABEL_OVERRIDE[key] || q.label.replace(/\s*\([^)]*\)\s*$/,""), roleMax:{}};
          byKey[key].perDate[d] = effQuota(q, d);
          byKey[key].maxReq = Math.max(byKey[key].maxReq, q.required_count);
          if(q.start_time < byKey[key].minStart) byKey[key].minStart = q.start_time;
          if(q.role_counts){ Object.keys(q.role_counts).forEach(r=>{ byKey[key].roleMax[r] = Math.max(byKey[key].roleMax[r]||0, q.role_counts[r]||0); }); }
        });
    });
    const buckets = Object.values(byKey).sort((a,b)=> a.minStart.localeCompare(b.minStart));
    buckets.forEach(b=>{
      dates.forEach(d=>{ if(!(d in b.perDate)) b.perDate[d]=null; });
      const roleKeys = Object.keys(b.roleMax).filter(r=>b.roleMax[r]>0);
      b.roles = MOKED_ROLE_ORDER.filter(r=>roleKeys.includes(r)).concat(roleKeys.filter(r=>!MOKED_ROLE_ORDER.includes(r)));
    });
    return {sector, buckets};
  });
}
/* שעה לתא: "15" לשעה עגולה, "15:30" כשיש דקות (2026-10-12: סיום שישי בוקר בחצאי שעות לפי כניסת שבת) */
function tmplHourNum(t){ if(!t) return ""; const h = String(parseInt(t.slice(0,2),10)), m = t.slice(3,5); return (m && m!=="00") ? `${h}:${m}` : h; }

/* טקסט השעות לתא: שעות התקן הרגילות, אלא אם לעובד יש שעות מותאמות שונות (למשל שיבוץ שחוצה בין
   משמרות) - ואז מציגים את השעה בפועל במקום שבו היא שונה מהסטנדרט */
function tmplHoursTxt(q, assignment){
  const cs = assignment && assignment.custom_start ? assignment.custom_start.slice(0,5) : null;
  const ce = assignment && assignment.custom_end ? assignment.custom_end.slice(0,5) : null;
  const startTxt = (cs && cs!==q.start_time.slice(0,5)) ? tmplHourNum(cs) : tmplHourNum(q.start_time);
  const endTxt = (ce && ce!==q.end_time.slice(0,5)) ? tmplHourNum(ce) : tmplHourNum(q.end_time);
  return `${startTxt}-${endTxt}`;
}

/* לאילו "בלוקי משמרת" בגזרה נתונה שייך טווח שעות מותאם (לשיבוץ שחוצה בין משמרות) - כל בלוק שיש לו
   חפיפה כלשהי (ולו דקה אחת) עם הטווח, ממוין כרונולוגית לפי סדר הבלוקים באותו יום. (עד 2026-10-04 היה
   כאן סף של 3 שעות חפיפה; הוסר לבקשת סרגיי - ראו confirmTmplCustomHours/confirmMokedCustomHours
   ו-tmplHoursTxt2 למטה, שתמיד מגבילים בפועל לכל היותר 2 בלוקים/שורות, לא משנה כמה בלוקים נחצים.) */
function tmplCustomRangeBuckets(group, date, sector, customStart, customEnd){
  const secData = buildTemplateData(group, [date], S.quotas).find(s=>s.sector===sector);
  if(!secData) return [];
  const cs = timeToMinutes(customStart);
  let ce = timeToMinutes(customEnd); if(ce<=cs) ce += 1440;
  const hits = [];
  secData.buckets.forEach(b=>{
    const q = b.perDate[date];
    if(!q) return;
    let qs = timeToMinutes(q.start_time), qe = timeToMinutes(q.end_time); if(qe<=qs) qe += 1440;
    const overlap = Math.min(ce,qe) - Math.max(cs,qs);
    if(overlap > 0) hits.push({bucket:b, quota:q});
  });
  return hits;
}

/* כמו tmplHoursTxt, אך מודעת לפיצול שעות מותאמות שחוצות בין בלוקים: אם לשיבוץ יש custom_start/end
   שחוצים יותר מבלוק אחד (ראו tmplCustomRangeBuckets), תמיד נכתבות לכל היותר 2 שורות (ראו
   confirmTmplCustomHours/confirmMokedCustomHours) - "מוביל" (הבלוק המוקדם ביותר שנחצה) ו"עוגן" (הבלוק
   שאחריו). "מוביל" מציג רק הערת שעת התחלה בפועל ("מ-X"), בלי שעת סיום; "עוגן" מציג את שעת ההתחלה
   הסטנדרטית שלו (לא את השעה בפועל - זו כבר מוצגת ב"מוביל") ועד שעת הסיום בפועל, גם אם זו חורגת מעבר
   לבלוק שלו עצמו (בלי ליצור בלוק/שורה שלישית). לבקשת סרגיי (2026-10-04).
   תיקון באג (2026-10-06, לבקשת סרגיי: "הילה משובצת עד 16:00... זה לא מופיע בתצורה הנכונה"): הפיצול
   ל"מוביל"/"עוגן" מניח ששתי השורות קיימות בפועל ב-DB (אחת לכל בלוק שנחצה) - אבל אם לעובד יש שיבוץ
   עם שעות מותאמות חוצות-בלוק, וקיימת רק שורת שיבוץ אחת בפועל (ה"עוגן" חסר - למשל נוצר/נערך בנפרד,
   לא דרך שני השלבים של confirmTmplCustomHours/confirmMokedCustomHours), אז ה"מוביל" היה מציג הערת
   שעת-התחלה חסרת תועלת (ולעיתים מטעה, כמו עם הילה: שעת ההתחלה שלה היא הסטנדרטית - 07:00 - וההערה
   "(מ-7)" לא מספרת שהיא עובדת עד 16:00 בכלל) - והטווח המלא לא הופיע באף מקום, כי אין שורה שנייה
   שתציג אותו. התיקון: assignmentsByDate מועבר כפרמטר נוסף, ואם אין בפועל שורת שיבוץ לאותו עובד
   בבלוק ה"עוגן" - מוצג הטווח המלא (כמו tmplHoursTxt הרגיל) ישירות בבלוק ה"מוביל", במקום ההערה
   הקצרה. כשקיימות שתי השורות בפועל (המקרה התקין) - אין שינוי בהתנהגות. */
function tmplHoursTxt2(group, date, sector, q, assignment, assignmentsByDate){
  const cs = assignment && assignment.custom_start ? assignment.custom_start.slice(0,5) : null;
  const ce = assignment && assignment.custom_end ? assignment.custom_end.slice(0,5) : null;
  if(!cs || !ce) return tmplHoursTxt(q, assignment);
  const touched = tmplCustomRangeBuckets(group, date, sector, cs, ce);
  if(touched.length < 2) return tmplHoursTxt(q, assignment);
  const leading = touched[0].quota, anchor = touched[1].quota;
  if(q.shift_type === leading.shift_type){
    const anchorRows = (assignmentsByDate && assignmentsByDate[date]) || [];
    const anchorHasRow = anchorRows.some(a=>a.sector===sector && a.shift_type===anchor.shift_type && a.worker_id===assignment.worker_id);
    if(!anchorHasRow) return tmplHoursTxt(q, assignment); // אין שורת "עוגן" בפועל - מציגים את הטווח המלא כאן
    return `(מ-${tmplHourNum(cs)})`;
  }
  if(q.shift_type === anchor.shift_type) return `${tmplHourNum(q.start_time)}-${tmplHourNum(ce)}`;
  return tmplHoursTxt(q, assignment);
}

/* עובדים משובצים למשבצת נתונה, ממוינים לפי סדר השיבוץ (created_at, כי כך ui.assignments נטען) -
   סדר זה הוא גם מספור ה"סייר" בתבנית */
function tmplAssignedList(assignmentsByDate, date, sector, shiftType){
  // שיבוצי "חפיפה" (shadow_of) לא תופסים מקום בתקן - מוצגים בנפרד בתא של העובד שאיתו עושים חפיפה
  return (assignmentsByDate[date]||[]).filter(a=>a.sector===sector && a.shift_type===shiftType && !a.shadow_of);
}
/* ---------- חפיפה (עובד בהכשרה) - לבקשת סרגיי (2026-10-07) ----------
   עובד שמסומן "חפיפה" במסך ניהול העובדים (roster_workers.shadow_trainee) אפשר לשבץ באותה קוביה יחד עם
   עובד שכבר משובץ בה, בבחירת "חפיפה" במסך בחירת סוג המשמרת. השיבוץ נשמר כשורה רגילה ב-shift_assignments
   עם shadow_of = העובד שאיתו עושים חפיפה; היא לא נספרת כמילוי תקן, ומוצגת בתא של אותו עובד עם (ח).
   אם העובד המארח הוסר מהמשבצת, החפיפה נשארת ומוצגת בתא הראשון של המשבצת. */
function tmplShadowList(assignmentsByDate, date, sector, shiftType){
  return (assignmentsByDate[date]||[]).filter(a=>a.sector===sector && a.shift_type===shiftType && a.shadow_of);
}
function tmplCellShadows(assignmentsByDate, date, sector, shiftType, hostIds, isFirstCell){
  const regularIds = new Set(tmplAssignedList(assignmentsByDate, date, sector, shiftType).map(a=>a.worker_id));
  return tmplShadowList(assignmentsByDate, date, sector, shiftType).filter(sh=> hostIds.includes(sh.shadow_of) || (isFirstCell && !regularIds.has(sh.shadow_of)));
}
function tmplShadowHtml(shadows, q, nameOf){
  return shadows.map(sh=>`<span class="tmpl-shadow">${escapeHtml(nameOf(sh.worker_id))} (ח)<br><span class="muted" style="font-size:.85em;">${tmplHoursTxt(q, sh)}</span></span>`).join("");
}
function tmplShadowText(shadows, q, nameOf){
  return shadows.map(sh=>` + ${nameOf(sh.worker_id)} (ח) ${tmplHoursTxt(q, sh)}`).join("");
}
/* כנ"ל, אך מסונן לתפקיד נתון (למוקד: אחמ"ש/מוקדן) - התפקיד נלקח מהעובד עצמו (roster_workers.role), לא מהשיבוץ */
/* התפקיד שהשיבוץ ממלא בפועל: filled_role אם הוגדר (למשל אחמ"ש ששובץ לתקן מוקדן - 2026-10-07), אחרת התפקיד של העובד */
function assignmentRole(a, workersById){
  if(a.filled_role) return a.filled_role;
  const w = workersById[a.worker_id]; return w ? w.role : null;
}
function tmplRoleAssignedList(assignmentsByDate, date, sector, shiftType, role, workersById){
  return tmplAssignedList(assignmentsByDate, date, sector, shiftType).filter(a=> assignmentRole(a, workersById)===role);
}
/* כנ"ל, אך עבור שורת "מוקדן" כולל גם שיבוצי אחמ"ש שמילאו את התקן כ"מילוי" (ראו assignRoleOverrideWorker,
   2026-10-06) - בלעדי זה שיבוץ כזה נשאר בלתי-נראה לגמרי: אין לו שורת-תפקיד משלו באותו תאריך (roleCounts
   של אותו יום לא כולל "אחמ"ש" בכלל, או כבר מכוסה ע"י אחמ"שים אמיתיים), והשורה מוקדן מסננת ל-w.role==="מוקדן"
   בלבד - כך שהתא מציג "חוסר" למרות ששיבוץ אמיתי קיים ב-DB. roleCounts הוא role_counts של אותו תאריך/משמרת
   (q.role_counts / slot.roleCounts) - "יתום" = עובד משובץ שהתפקיד האמיתי שלו לא מופיע שם בכלל (או מופיע
   עם 0), כיוון חד-כיווני בלבד (אחמ"ש יכול "לבלוע" למוקדן, לעולם לא ההפך - מוקדן אף פעם לא נחשב יתום). */
function tmplRoleAssignedListWithOverride(assignmentsByDate, date, sector, shiftType, role, workersById, roleCounts){
  const list = tmplRoleAssignedList(assignmentsByDate, date, sector, shiftType, role, workersById);
  if(role !== "מוקדן") return list;
  const orphans = tmplAssignedList(assignmentsByDate, date, sector, shiftType).filter(a=>{
    const r = assignmentRole(a, workersById);
    if(!r || r==="מוקדן") return false; // כבר נספר למעלה
    return !roleCounts || !roleCounts[r]; // אין לתפקיד שלו שום שורה באותו תאריך
  });
  return list.concat(orphans);
}
/* אילו שיבוצים (מתוך רשימת המועמדים לתפקיד) מוצגים בשורה ridx: השורה האחרונה של התפקיד "בולעת" כל
   מי שנותר מעבר למספר השורות הרגיל (זה בדיוק מקרה ה"חפיפה" בטופס - שני אנשים על אותה משבצת, מוצגים
   יחד באותו תא, מופרדים ב-"\") */
function pickedForRoleCell(candidates, ridx, roleRowsCount){
  return (ridx>=roleRowsCount) ? candidates.slice(ridx-1) : candidates.slice(ridx-1, ridx);
}

/* שורות "מראה" (תצוגה בלבד, לא ניתנות לעריכה) לבלוקי בוקר/ערב בגזרה עם משמרת "מתואמת" (כמו
   מתואמת 11:00-23:00 בחיפה) - מציגות את אותם עובדים שכבר משובצים בבלוק ה"מתואמת" הנפרד (העריכה
   בפועל נשארת שם, הבלוק הנפרד לא מוסר), כדי שיהיה אפשר לראות אותם גם בשורת הבוקר/ערב, ממוספרות
   כהמשך ישיר של מספור ה"סייר" הרגיל של הבלוק (למשל: בוקר עם 3 תקנים + 2 מתואמת -> סייר 4, סייר 5
   מתווספות). גנרי (לא תלוי בשם גזרה ספציפי) - מופעל על כל גזרה שיש לה בלוק "coordinated". לבקשת
   סרגיי (2026-10-05): "עותק תצוגה" בלבד, בלי ליצור אפשרות עריכה כפולה. */
function tmplCoordMirrorRows(sector, bucket, coordBucket, dates, assignmentsByDate, workers, allWorkersById, restViolations, mode){
  /* (2026-10-20, סרגיי) בשיבוץ ידני גם שורות המתואמת שבתוך בוקר/ערב לחיצות - פותחות את משבצת ה"מתואמת" עצמה */
  const clickAttrs = (d, cpos)=> mode==="manual" ? ` data-action="tmpl-cell" data-sector="${escapeHtml(sector)}" data-date="${d}" data-type="coordinated" data-pos="${cpos}"` : "";
  if(bucket.key!=="morning" && bucket.key!=="evening") return "";
  return Array.from({length:coordBucket.maxReq}, (_,i)=>i+1).map(cpos=>{
    const pos = bucket.maxReq + cpos;
    const cells = dates.map(d=>{
      const cq = coordBucket.perDate[d];
      if(!cq || cpos>cq.required_count) return `<td class="tmpl-na"></td>`;
      const list = tmplAssignedList(assignmentsByDate, d, sector, cq.shift_type);
      const a = list[cpos-1];
      const w = a ? (workers.find(x=>x.id===a.worker_id) || allWorkersById[a.worker_id]) : null;
      if(!w) return `<td class="tmpl-missing${mode==="manual"?" tmpl-cell":""}" style="font-style:italic;"${clickAttrs(d, cpos)}>חוסר</td>`;
      const cs = a.custom_start ? a.custom_start.slice(0,5) : cq.start_time.slice(0,5);
      const ce = a.custom_end ? a.custom_end.slice(0,5) : cq.end_time.slice(0,5);
      const q = bucket.perDate[d];
      const hoursTxt = bucket.key==="morning"
        ? `(מ-${tmplHourNum(cs)})`
        : `${tmplHourNum(q?q.start_time:cq.start_time)}-${tmplHourNum(ce)}`;
      const restBad = restViolations.has(restKey(a));
      const restTight = !restBad && restViolations.tight && restViolations.tight.has(restKey(a));
      const restNote = restBad? `<span class="tmpl-restwarn-note">⚠ &lt;8 שעות מנוחה</span>` : "";
      return `<td class="${restBad?'tmpl-restwarn':(restTight?'tmpl-resttight':'')}${mode==="manual"?" tmpl-cell":""}" style="opacity:.8;font-style:italic;"${clickAttrs(d, cpos)}>${escapeHtml(w.name)}<br><span class="muted" style="font-size:.85em;">${hoursTxt}</span>${restNote}</td>`;
    }).join("");
    return `<tr class="tmpl-mirror-row"><td class="tmpl-pos">סייר ${pos}<br><span class="muted" style="font-size:.75em;font-weight:400;">(מתואמת)</span>${tmplBucketHoursHtml(coordBucket)}</td>${cells}</tr>`;
  }).join("");
}

/* שעות המשמרות שבבלוק - מוצגות בעמודת ה"סיירים" (לבקשת סרגיי, 2026-10-20). שישי בוקר: הסיום נקבע לפי
   כניסת השבת (fridayMorningEnd), לכן מוצג כ"עד הסיום לפי כניסת שבת" - השעה המדויקת מופיעה בתא עצמו. */
const TMPL_DAY_NAMES = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
function tmplBucketHoursHtml(bucket){
  const seen = {}, out = [];
  // שישי בוקר: שעת הסיום = שעתיים לפני כניסת השבת (משתנה מדי שבוע) - מציגים את השעות בפועל בתקופה (2026-10-20)
  const friEnds = Array.from(new Set(Object.values(bucket.perDate).filter(q=>q && q.shift_type==="friday_morning").map(q=>String(q.end_time).slice(0,5))));
  Object.values(bucket.perDate).forEach(q=>{
    if(!q || seen[q.shift_type]) return; seen[q.shift_type] = true;
    if(q.shift_type==="friday_morning" || q.shift_type==="motzash") return; // שישי בוקר / מוצ"ש - ההערה רק בכותרת יום שישי, לא בעמודת הסיירים (סרגיי, 2026-10-20)
    const st = String(q.start_time).slice(0,5), en = String(q.end_time).slice(0,5);
    let name, hrs = `${st}-${en}`;
    if(q.shift_type==="friday_morning"){ name = "שישי"; hrs = `${st}-${friEnds.join(" / ")}</span> <span>(שעתיים לפני כניסת שבת)`; }
    else if(q.shift_type==="friday_night") name = "שישי";
    else if(q.shift_type==="motzash") name = 'מוצ"ש';
    else if(q.weekday!=null) name = TMPL_DAY_NAMES[q.weekday];
    else name = "";
    out.push({o: q.shift_type==="motzash"?3:(q.shift_type.startsWith("friday")?2:1), t: `${name?name+" ":""}<span dir="ltr">${hrs}</span>`});
  });
  return out.sort((a,b)=>a.o-b.o).map(x=>`<div class="tmpl-pos-hrs">${x.t}</div>`).join("");
}
/* mode: "view" (תצוגה בלבד, במסך הפלט הראשי) או "manual" (משבצות לחיצות לשיבוץ ידני) */
function renderTemplateGrid(group, dates, ui, mode){
  const quotas = S.quotas;
  const workers = ui.workers;
  const allWorkersById = ui.allWorkersById || {};
  const assignmentsByDate = {};
  (ui.assignments||[]).forEach(a=>{ (assignmentsByDate[a.entry_date] = assignmentsByDate[a.entry_date]||[]).push(a); });
  const restViolations = computeRestViolations(ui.allAssignments || ui.assignments || []);
  const sectors = buildTemplateData(group, dates, quotas);

  const blocksHtml = sectors.map(secData=>{
    if(!secData.buckets.length) return "";
    const coordBucket = secData.buckets.find(b=>b.key==="coordinated");
    const bucketsHtml = secData.buckets.map(bucket=>{
      const bucketHrs = tmplBucketHoursHtml(bucket);
      const rowsHtml = Array.from({length:bucket.maxReq}, (_,i)=>i+1).map(pos=>{
        const cells = dates.map(d=>{
          const q = bucket.perDate[d];
          if(!q || pos>q.required_count) return `<td class="tmpl-na"></td>`;
          const list = tmplAssignedList(assignmentsByDate, d, secData.sector, q.shift_type);
          const a = list[pos-1];
          const w = a ? (workers.find(x=>x.id===a.worker_id) || allWorkersById[a.worker_id]) : null;
          const hoursTxt = a ? tmplHoursTxt2(group, d, secData.sector, q, a, assignmentsByDate) : `${tmplHourNum(q.start_time)}-${tmplHourNum(q.end_time)}`;
          const restBad = a && restViolations.has(restKey(a));
          const restTight = a && !restBad && restViolations.tight.has(restKey(a));
          const restNote = restBad? `<span class="tmpl-restwarn-note">⚠ &lt;8 שעות מנוחה</span>` : "";
          const shadowHtml = tmplShadowHtml(tmplCellShadows(assignmentsByDate, d, secData.sector, q.shift_type, a?[a.worker_id]:[], pos===1), q, id=>{ const x = workers.find(y=>y.id===id) || allWorkersById[id]; return x?x.name:"?"; });
          if(mode==="manual"){
            const cls = "tmpl-cell" + (w? (restBad?" tmpl-restwarn":(restTight?" tmpl-resttight":"")) : " tmpl-missing");
            const label = (w? `${escapeHtml(w.name)}<br><span class="muted" style="font-size:.85em;">${hoursTxt}</span>${restNote}` : "חוסר") + shadowHtml;
            return `<td class="${cls}" data-action="tmpl-cell" data-sector="${escapeHtml(secData.sector)}" data-date="${d}" data-type="${q.shift_type}" data-pos="${pos}">${label}</td>`;
          }
          if(w) return `<td class="${restBad?'tmpl-restwarn':(restTight?'tmpl-resttight':'')}">${escapeHtml(w.name)}<br><span class="muted" style="font-size:.85em;">${hoursTxt}</span>${restNote}${shadowHtml}</td>`;
          return `<td class="tmpl-missing">חוסר${shadowHtml}</td>`;
        }).join("");
        return `<tr><td class="tmpl-pos">סייר ${pos}${bucketHrs}</td>${cells}</tr>`;
      }).join("");
      const mirrorHtml = coordBucket ? tmplCoordMirrorRows(secData.sector, bucket, coordBucket, dates, assignmentsByDate, workers, allWorkersById, restViolations, mode) : "";
      return `
      <div class="tmpl-bucket-head">${escapeHtml(bucket.label)}</div>
      <div style="overflow-x:auto;">
      <table class="tmpl-table">
        <thead><tr><th></th>${dates.map(d=>`<th>${fmtDateHeb(d)}${shabbatThHtml(d, secData.sector)}</th>`).join("")}</tr></thead>
        <tbody>${rowsHtml || `<tr><td colspan="${dates.length+1}" class="muted">אין תקן</td></tr>`}${mirrorHtml}</tbody>
      </table>
      </div>`;
    }).join("");
    return `<div class="tmpl-block"><div class="tmpl-sector-head">${escapeHtml(secData.sector)}</div>${bucketsHtml}${schedTasksBlock(secData.sector, dates, ui, mode)}</div>`;
  }).join("");

  return blocksHtml || `<p class="muted">אין תקן מוגדר לגזרות אלו.</p>`;
}

/* ================================================================
   משימות שאינן משמרת (2026-10-20, לבקשת סרגיי): בתחתית טבלת השיבוץ - 3 שורות בכל יום. המשבץ בוחר מאבטח,
   כותב מה המשימה (מלל חופשי) ושעות. המשימה מופיעה אצל המאבטח באיזור האישי (worker_sched_tasks) והוא מקבל
   התראה. נשמר מיד (rpc_sched_task_save / rpc_sched_task_remove). בתצוגה/פלט - מוצג רק אם יש משימות.
   ================================================================ */
const STASK_ROWS = 5; // (2026-10-20) הורחב מ-3 ל-5 שורות לבקשת סרגיי
function schedTasksBlock(sector, dates, ui, mode){
  const tasks = (ui.schedTasks||[]).filter(t=>t.sector===sector);
  if(mode!=="manual" && mode!=="agg" && !tasks.some(t=>dates.includes(t.date))) return "";
  const rows = Array.from({length:STASK_ROWS}, (_,i)=>i+1).map(slot=>{
    const cells = dates.map(d=>{
      const t = tasks.find(x=>x.date===d && x.slot===slot);
      const hrs = t && (t.start||t.end) ? `<br><span class="muted" style="font-size:.85em;" dir="ltr">${escapeHtml(t.start||"")}${t.end?"-"+escapeHtml(t.end):""}</span>` : "";
      const body = t ? `<b>${escapeHtml(t.worker_name||"?")}</b><br><span style="font-size:.85em;">${escapeHtml(t.title)}</span>${hrs}` : (mode==="manual" ? `<span class="muted">➕</span>` : "");
      return mode==="manual"
        ? `<td class="tmpl-cell stask-cell" data-action="stask-cell" data-sector="${escapeHtml(sector)}" data-date="${d}" data-slot="${slot}">${body}</td>`
        : `<td class="stask-cell">${body}</td>`;
    }).join("");
    return `<tr><td class="tmpl-pos">משימה ${slot}</td>${cells}</tr>`;
  }).join("");
  return `
      <div class="tmpl-bucket-head">משימות (לא משמרת)${mode==="agg"?` <span class="muted" style="font-weight:400;font-size:.85em;">— להוספה או עריכה: "שיבוץ ידני"</span>`:""}</div>
      <div style="overflow-x:auto;">
      <table class="tmpl-table">
        <thead><tr><th></th>${dates.map(d=>`<th>${fmtDateHeb(d)}</th>`).join("")}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div>`;
}
async function schedTaskAction(a){
    const ui = S.ui;
    const c = ui.staskCell; if(!c || ui.staskBusy) return;
    const v = id=>{ const x = document.getElementById(id); return x ? x.value : ""; };
    const wid = v("stask_worker"), title = v("stask_title").trim(), st = v("stask_start"), en = v("stask_end");
    if(a==="stask-save" && !wid){ ui.staskMsg = "צריך לבחור מאבטח"; return render(); }
    if(a==="stask-save" && !title){ ui.staskMsg = "צריך לכתוב מה המשימה"; return render(); }
    ui.staskBusy = true; render();
    try{
      if(a==="stask-save") await apiRpc("rpc_sched_task_save", {p_pin:S.pin, p_sector:c.sector, p_date:c.date, p_slot:c.slot, p_worker_id:wid, p_title:title, p_start:st||null, p_end:en||null});
      else await apiRpc("rpc_sched_task_remove", {p_pin:S.pin, p_sector:c.sector, p_date:c.date, p_slot:c.slot});
      const team = teamById(ui.teamId), group = sectorGroupForTeam(team), dts = periodDates(ui.periodStart, team);
      ui.schedTasks = await apiRpc("sched_tasks_list", {p_sectors: group.citySectors, p_from: dts[0], p_to: dts[dts.length-1]});
      ui.staskCell = null; ui.staskMsg = null;
    }catch(err){ ui.staskMsg = /invalid pin/i.test(err.message) ? "אין הרשאה — צריך להתחבר מחדש" : err.message; }
    ui.staskBusy = false; return render();
}
function renderSchedTaskOverlay(){
  const ui = S.ui, c = ui.staskCell;
  if(!c) return "";
  const t = (ui.schedTasks||[]).find(x=>x.sector===c.sector && x.date===c.date && x.slot===c.slot);
  const ws = (ui.workers||[]).slice().sort((a,b)=>a.name.localeCompare(b.name,"he"));
  const sel = t ? t.worker_id : "";
  return `
  <div class="overlay" data-action="stask-close-bg">

      <div class="field"><label>המשימה</label><input type="text" id="stask_title" maxlength="200" placeholder="למשל: ליווי מבקר, תדריך, השתלמות" value="${escapeHtml(t?t.title:"")}"></div>
      <div class="row">

      <p class="muted" style="font-size:.85em;">המשימה תופיע אצל המאבטח באיזור האישי, והוא יקבל התראה.</p>
      ${ui.staskMsg? `<p class="shortage">${escapeHtml(ui.staskMsg)}</p>`:""}
      <div class="row" style="margin-top:8px;">

      </div>
    </div>
  </div>`;
